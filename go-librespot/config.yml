log_level: info
device_name: Pi Display
device_type: speaker
audio_backend: alsa
audio_device: default
bitrate: 320
initial_volume: 80
volume_steps: 100
ignore_last_volume: false
zeroconf_enabled: true
zeroconf_port: 0
zeroconf_backend: avahi
credentials:
  type: zeroconf
  zeroconf:
    # Keep the last connected account's credentials so the display can start
    # playback on its own (Record Shelf taps) without a phone present.
    # One-time setup: pick "Pi Display" in Spotify once after this changes.
    # The credentials file lives in this directory and is gitignored.
    persist_credentials: true
server:
  enabled: true
  address: 127.0.0.1
  port: 3678
  image_size: large
mpris_enabled: false
