name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Install native build dependencies
        # lgpio ships wheels only up to CPython 3.12; newer interpreters build
        # the sdist, which needs swig and the liblgpio headers/library to link.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig liblgpio-dev
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes \
            -r requirements.lock -r requirements-test.lock
      - name: Validate repository
        run: ./scripts/validate.sh
