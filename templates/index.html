    // A jump larger than a poll's drift means a seek landed — re-trigger the
    // active line so the karaoke sweep restarts from the seek position.
    const jumped = Math.abs(p - lyricsLastP) > 1500;
    lyricsLastP = p;

    // Find current line
    let idx = -1;
    for (let i = lyricsLines.length - 1; i >= 0; i--) {
      if (p >= lyricsLines[i].time) { idx = i; break; }
    }

    if (idx === currentLyricIdx && !jumped) return;
    currentLyricIdx = idx;

    for (let i = 0; i < lyricsLines.length; i++) {
      lyricLinePool[i].classList.toggle("active", i === idx);
      lyricLinePool[i].classList.toggle("past", i < idx);
      if (i !== idx) lyricLinePool[i].classList.remove("ly-filling");
    }

    // Karaoke fill: sweep the accent twin across the active line over the
    // line's own duration, starting partway when a seek lands mid-line.
    if (FLAG_KARAOKE && idx >= 0) {
      const line = lyricLinePool[idx];
      const fill = line.lastChild;
      const start = lyricsLines[idx].time;
      const end = idx + 1 < lyricsLines.length ? lyricsLines[idx + 1].time : state.durationMs;
      line.classList.remove("ly-filling");
      void fill.offsetWidth; // restart the animation
      fill.style.animationDuration = Math.max(400, end - start) + "ms";
      fill.style.animationDelay = "-" + Math.max(0, Math.min(p - start, end - start)) + "ms";
      line.classList.add("ly-filling");
    }

    // Scroll so the active line sits in the focus lane. Line heights vary
    // (some lyrics wrap to two rows) but they're STABLE — emphasis is a
    // transform scale, never a font-size change — so this single offsetTop
    // read is exact and the column can't drift mid-transition.
    if (idx >= 0 && lyricLinePool[idx]) {
      const offset = lyricLinePool[idx].offsetTop - 118; // keep the active line in the focus lane
      lyricsInner.style.transform = `translateY(${-offset}px)`;
    }
  }

  // ── Easing: cubic ease-in-out ──
  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutQuint(t) {
    return 1 - Math.pow(1 - t, 5);
  }

  function applyVinylTransform(now) {
    // Flip is a single rigid rotation about the VERTICAL centre axis
    // (rotateY). Semantic next/previous actions turn in opposite directions;
    // the vinyl spin is frozen so the flip reads as one clean motion.
    // `flipDirection` carries that transport direction.
    let flipAngle = 0;
    let sheen = 0;

    if (flipStartTime) {
      let t = Math.min((now - flipStartTime) / FLIP_DURATION, 1);

      // At the hidden 90° point, reveal the new track's art + label and
      // counter-mirror the whole disc face so the back half (90→180°) reads
      // upright. If the art isn't loaded yet (fresh skip), hold edge-on until
      // it arrives; if nothing ever arrives, finish as a plain turn-over
      // (no swap, no mirror — the pre-existing look).
      if (!flipArtSwapped && t >= 0.5) {
        if (pendingArt !== null) {
          flipArtSwapped = true;
          artworkEl.src = pendingArt;
          pendingArt = null;
          if (pendingPalette !== undefined) { labelPalette = pendingPalette; pendingPalette = undefined; setUiAccent(labelPalette); }
          sideB = !sideB;
          lastLabelKey = "";
          renderLabel();
          discFace.style.transform = "scaleX(-1)";
        } else if (flipHoldDeadline && now >= flipHoldDeadline) {
          flipArtSwapped = true; // give up waiting — plain turn-over
        } else {
          if (!flipHoldDeadline) flipHoldDeadline = now + FLIP_HOLD_MAX;
          flipStartTime = now - FLIP_DURATION * 0.5;
          t = 0.5;
        }
      }

      const resolve = easeInOut(t);
      flipAngle = resolve * 180 * flipDirection;
      // Subtle sheen pulse — sells the 3D rotation against the album art.
      sheen = Math.sin(t * Math.PI) * 0.55;

      if (t >= 1) {
        flipStartTime = 0;
        sheen = 0;
        vinyl.classList.remove("flipping");
        artworkEl.classList.remove("art-changing");
        progressCanvas.classList.remove("flip-hidden"); // notches ease back in
        sheenEl.classList.remove("flip-hidden");        // reflection eases back in
        // Cleared in the same frame the rotateY(180°) below disappears —
        // rotateY(180)+mirror ≡ upright, so the hand-off is invisible. The
        // wrapper has no transition, so both snap together.
        discFace.style.transform = "";
      }
    }

    vinyl.style.setProperty("--flip-sheen", sheen.toFixed(3));
    if (flipStartTime) {
      // Spin (rotate = rotateZ) is applied first (innermost) so it stays the
      // record's own centre spin, then the flip pivots about the screen's
      // vertical axis — matching the horizontal swipe, never a tilted axis.
      vinyl.style.transform =
        `perspective(1600px) rotateY(${flipAngle.toFixed(2)}deg) rotate(${currentAngle.toFixed(2)}deg)`;
    } else {
      // Pressing eccentricity: a sub-pixel orbit of the spin centre, scaled
      // by spinSpeed so it fades with the platter. Frozen while the tracklist
      // is up so the blurred platter stays a cached layer. Settle: the record
      // seats onto the platter (1.004 → 1) across the spin-up ramp.
      let wx = 0, wy = 0;
      if (!state.tracklisting && spinSpeed > 0.001) {
        const rad = currentAngle * Math.PI / 180;
        wx = WOBBLE_PX * spinSpeed * Math.cos(rad);
        wy = WOBBLE_PX * spinSpeed * Math.sin(rad);
      }
      const settle = (spinTarget === 1 && spinSpeed < 1)
        ? 1 + SETTLE_SCALE * (1 - spinSpeed) : 1;
      vinyl.style.transform =
        `translate(${wx.toFixed(2)}px, ${wy.toFixed(2)}px) rotate(${currentAngle.toFixed(2)}deg) scale(${settle.toFixed(4)})`;
    }
  }

  // Circle→square morph driven by minimizeProg: the album art rounds off to
  // a square cover and the vinyl furniture (grooves, label, spindle, ring)
  // fades, so the spinning record becomes the original square artwork.
  function applyMinimizeMorph() {
    const m = minimizeProg;
    artworkEl.style.borderRadius = (50 - 47.5 * m).toFixed(2) + "%";
    // Decorations clear a touch ahead of full square so the cover reads clean.
    const fade = Math.max(0, 1 - m * 1.15).toFixed(3);
    groovesEl.style.opacity = fade;
    labelSvg.style.opacity = fade;
    spindleEl.style.opacity = fade;
    progressCanvas.style.opacity = fade;
    sheenEl.style.opacity = fade; // a square cover has no vinyl to catch light
  }

  function startRecordFlip(direction) {
    if (REDUCED_MOTION) {
      flipStartTime = 0;
      flipArtSwapped = false;
      flipHoldDeadline = 0;
      scheduleAnimation(true);
      return;
    }
    flipDirection = direction === "previous" ? 1 : -1;
    flipStartTime = performance.now();
    lastFlipStartedAt = flipStartTime;
    flipArtSwapped = false;
    flipHoldDeadline = 0;
    pendingArt = null;
    pendingPalette = undefined;
    // Clear any counter-mirror a prior (rapidly-superseded) flip left behind,
    // so this flip's front half is never mirrored.
    discFace.style.transform = "";
    vinyl.classList.add("flipping");
    artworkEl.classList.add("art-changing");
    progressCanvas.classList.add("flip-hidden"); // static notches fade off for the flip
    sheenEl.classList.add("flip-hidden");        // static reflection sits the flip out
    scheduleAnimation(true);
    // The disc-face swap, and the art-changing cleanup, are handled at the
    // hidden 90° point and on flip completion inside applyVinylTransform.
  }

  // Artwork and its sampled palette are one versioned bundle. A slow CDN
  // response from a skipped track can never recolour or overwrite the current
  // record, and the label/accent change in the same frame as the decoded image.
  function commitArtworkBundle(url, palette) {
    if (flipStartTime && !flipArtSwapped) {
      pendingArt = url;
      pendingPalette = palette;
    } else {
      artworkEl.src = url;
      labelPalette = palette;
      lastLabelKey = "";
      renderLabel();
      setUiAccent(palette);
    }
  }

  function artworkRequestIsCurrent(epoch, playbackKey, url) {
    return epoch === artworkEpoch && playbackKey === state.playbackKey && url === state.artUrl;
  }

  function stageArtworkBundle(url, palette, epoch, playbackKey) {
    if (!artworkRequestIsCurrent(epoch, playbackKey, url)) return;
    commitArtworkBundle(url, palette);
  }

  function failArtworkBundle(epoch, playbackKey, url) {
    if (!artworkRequestIsCurrent(epoch, playbackKey, url)) return false;
    artworkLoadFailedAt = performance.now();
    // Keep state.artUrl pointing at the desired remote URL so the normal retry
    // window can recover it, but never leave the previous record visible.
    commitArtworkBundle(NEUTRAL_ART_URL, null);
    return true;
  }

  function stageNeutralArtwork(playbackKey) {
    // This synchronous epoch invalidates every older image/palette promise,
    // preventing a late previous cover from replacing the neutral surface.
    artworkEpoch++;
    artworkLoadFailedAt = -Infinity;
    state.artUrl = "";
    if (playbackKey !== state.playbackKey) return;
    commitArtworkBundle(NEUTRAL_ART_URL, null);
  }

  async function loadArtworkBundle(url, playbackKey) {
    const epoch = ++artworkEpoch;
    const imageReady = new Promise((resolve, reject) => {
      const image = new Image();
      image.decoding = "async";
      const timeout = setTimeout(() => {
        image.src = "";
        reject(new Error("Artwork preload timed out"));
      }, 8000);
      image.onload = async () => {
        clearTimeout(timeout);
        try { if (image.decode) await image.decode(); } catch (e) { /* already decoded by onload */ }
        resolve();
      };
      image.onerror = error => { clearTimeout(timeout); reject(error); };
      image.src = url;
    });
    const paletteReady = Promise.race([
      sampleLabelPalette(url),
      new Promise(resolve => setTimeout(() => resolve(null), 1200)),
    ]);
    const [imageResult, paletteResult] = await Promise.allSettled([
      imageReady,
      paletteReady,
    ]);
    if (imageResult.status !== "fulfilled") {
      failArtworkBundle(epoch, playbackKey, url);
      return;
    }
    if (!artworkRequestIsCurrent(epoch, playbackKey, url)) return;
    artworkLoadFailedAt = -Infinity;
    const palette = paletteResult.status === "fulfilled" ? paletteResult.value : null;
    stageArtworkBundle(url, palette, epoch, playbackKey);
  }

  // Title goes in as an inner span so overflow can edge-fade + take one
  // marquee pass (transform-only) instead of truncating with an ellipsis.
  function setTrackTitle(name) {
    pillTrack.innerHTML = "";
    const span = document.createElement("span");
    span.className = "pt-inner";
    span.textContent = name;
    pillTrack.appendChild(span);
    const over = span.scrollWidth - pillTrack.clientWidth;
    if (over > 8) {
      pillTrack.classList.add("overflowing");
      pillTrack.style.setProperty("--marq", `${-(over + 46)}px`);
    } else {
      pillTrack.classList.remove("overflowing");
    }
  }

  function setPillMetadata(trackName, artistName, animateChange) {
    if (metadataTimer) {
      window.clearTimeout(metadataTimer);
      metadataTimer = null;
    }
    pillFace = 0; // a new record always opens on its title/artist face
    pillFaceChangedAt = performance.now();

    if (!animateChange) {
      pill.classList.remove("metadata-out", "metadata-in");
      setTrackTitle(trackName);
      pillArtist.textContent = artistName;
      return;
    }

    pill.classList.remove("metadata-in");
    pill.classList.add("metadata-out");
    metadataTimer = window.setTimeout(() => {
      setTrackTitle(trackName);
      pillArtist.textContent = artistName;
      pill.classList.remove("metadata-out");
      pill.classList.add("metadata-in");
      metadataTimer = window.setTimeout(() => {
        pill.classList.remove("metadata-in");
        metadataTimer = null;
      }, 560);
    }, 190);
  }

  // ── Sleeve notes — the pill's rich-metadata faces ──
  // Face 0 is title/artist (the resting state). Tap the pill, or wait for
  // the slow auto-cycle, to see the record's sleeve notes: album · year ·
  // label, then the pressing facts (speed, side, year). Every face reuses
  // the metadata-out/in crossfade so the swap reads as one calm motion.
  let pillFace = 0;
  let pillFaceChangedAt = 0;         // timestamp of the last face swap (tap or ambient)
  const PILL_FACE_REST_MS = 45000;   // dwell on the title/artist face — the resting state
  const PILL_FACE_DWELL_MS = 11000;  // dwell on each sleeve-note face

  function pillFaces() {
    const faces = [{ title: state.trackName, sub: state.artistName }];
    if (!state.trackId) return faces;
    const year = (state.releaseDate || "").slice(0, 4);
    if (state.albumName && state.albumName !== state.trackName) {
      faces.push({
        title: state.albumName,
        sub: [year, state.recordLabel].filter(Boolean).join("  ·  "),
      });
    }
    const pressing = [state.isSingle ? "45 RPM" : "33⅓ RPM", "Side " + (sideB ? "B" : "A")].join("  ·  ");
    const pressingSub = [state.recordLabel, year].filter(Boolean).join("  ·  ");
    if (pressingSub || !faces.length) faces.push({ title: pressing, sub: pressingSub });
    return faces;
  }

  function showPillFace(idx) {
    const faces = pillFaces();
    pillFace = ((idx % faces.length) + faces.length) % faces.length;
    pillFaceChangedAt = performance.now();
    const face = faces[pillFace];
    if (metadataTimer) {
      window.clearTimeout(metadataTimer);
      metadataTimer = null;
      pill.classList.remove("metadata-out", "metadata-in");
    }
    pill.classList.add("metadata-out");
    metadataTimer = window.setTimeout(() => {
      setTrackTitle(face.title);
      pillArtist.textContent = face.sub;
      pill.classList.remove("metadata-out");
      pill.classList.add("metadata-in");
      metadataTimer = window.setTimeout(() => {
        pill.classList.remove("metadata-in");
        metadataTimer = null;
      }, 560);
    }, 190);
  }

  function cyclePillFace() {
    showPillFace(pillFace + 1);
  }

  // The ambient cycle is the appliance case: the rich content surfaces even
  // when nobody touches the panel. Title/artist is the resting face — it
  // holds 45s, each sleeve-note face holds 11s, so the primary readout owns
  // roughly two thirds of the loop. Gated at fire time so nothing animates
  // under a dimmed screen, a modal mode, or mid track-change crossfade; a
  // pause or stale receiver settles the pill back onto the title face.
  window.setInterval(() => {
    if (!FLAG_FACES || !state.trackId) return;
    if (screenDimmed || state.browsing || state.tracklisting) return;
    if (metadataTimer) return; // never cancel an in-flight crossfade
    const dwell = performance.now() - pillFaceChangedAt;
    if (!state.isPlaying || state.stale || pillFaces().length < 2) {
      if (pillFace !== 0 && dwell > PILL_FACE_DWELL_MS) showPillFace(0);
      return;
    }
    if (dwell > (pillFace === 0 ? PILL_FACE_REST_MS : PILL_FACE_DWELL_MS)) cyclePillFace();
  }, 2500);

  pill.addEventListener("click", () => {
    if (performance.now() < suppressTapUntil) return;
    if (screenDimmed || state.browsing || state.tracklisting || !state.trackId) return;
    if (metadataTimer) return; // a track change is mid-crossfade — let it land
    if (pillFaces().length < 2) return;
    cyclePillFace();
  });
  pill.tabIndex = 0;
  pill.title = "Sleeve notes — tap to cycle album, label and pressing details";
  pill.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (metadataTimer) return;
    if (pillFaces().length < 2) return;
    cyclePillFace();
  });

  // ── Animation loop ──
  let animationRaf = null;
  let animationWakeTimer = null;
  let standbyTimer = null;
  let frameWindowTotal = 0;
  let frameWindowCount = 0;
  let slowFrameWindows = 0;
  let fastFrameWindows = 0;

  function animationNeedsFullRate() {
    const minTarget = state.browsing ? 1 : 0;
    const crateMoving = crateTarget !== null && Math.abs(crateScroll - crateTarget) > 0.4;
    return (!REDUCED_MOTION && state.isPlaying && !state.stale && !state.tracklisting && !state.browsing) || !!flipStartTime ||
      Math.abs(spinSpeed - spinTarget) > 0.001 || returningToZero ||
      Math.abs(minimizeProg - minTarget) > 0.0015 || crateMoving;
  }

  function scheduleAnimation(immediate) {
    if (screenDimmed || animationRaf !== null) return;
    if (immediate && animationWakeTimer) {
      clearTimeout(animationWakeTimer);
      animationWakeTimer = null;
    }
    if (immediate || animationNeedsFullRate()) {
      lastFrameTime = performance.now();
      animationRaf = requestAnimationFrame(animate);
      return;
    }
    if (animationWakeTimer) return;
    // Static paused/idle scenes only need a low-rate tick to notice the dim
    // deadline. Any input, poll or transition requests an immediate frame.
    const untilDim = Math.max(50, DIM_DELAY - (performance.now() - lastInteractionAt));
    animationWakeTimer = setTimeout(() => {
      animationWakeTimer = null;
      if (!screenDimmed) {
        lastFrameTime = performance.now();
        animationRaf = requestAnimationFrame(animate);
      }
    }, Math.min(REDUCED_MOTION && state.isPlaying ? 250 : 1000, untilDim));
  }

  function scheduleStandbyClock() {
    if (standbyTimer) clearTimeout(standbyTimer);
    standbyTimer = null;
    if (!screenDimmed || !FLAG_STANDBY_CLOCK) return;
    drawStandbyClock();
    const now = new Date();
    const toNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20;
    standbyTimer = setTimeout(scheduleStandbyClock, toNextMinute);
  }

  function setScreenDimmed(dimmed) {
    if (screenDimmed === dimmed) return;
    screenDimmed = dimmed;
    dimmer.classList.toggle("dim", dimmed);
    viewport.classList.toggle("dimmed", dimmed);
    syncScreenBrightness();
    standbyClock.classList.toggle("on", dimmed && FLAG_STANDBY_CLOCK);
    wledChip.setAttribute("aria-hidden", dimmed || !wledChip.classList.contains("visible") ? "true" : "false");
    if (dimmed) {
      if (animationRaf !== null) cancelAnimationFrame(animationRaf);
      animationRaf = null;
      if (animationWakeTimer) clearTimeout(animationWakeTimer);
      animationWakeTimer = null;
      lastClockMin = -1;
      scheduleStandbyClock();
      if (wledRefreshTimer) clearTimeout(wledRefreshTimer);
      wledRefreshTimer = null;
    } else {
      if (standbyTimer) clearTimeout(standbyTimer);
      standbyTimer = null;
      lastFrameTime = performance.now();
      scheduleAnimation(true);
      scheduleWledRefresh(0);
    }
  }

  function observeFrame(dt) {
    if (dt <= 0 || dt > 250) return;
    frameWindowTotal += dt;
    frameWindowCount++;
    if (dt > 40) diagnostics.frameDrops++;
    if (frameWindowCount < 120) return;
    diagnostics.frameAvgMs = frameWindowTotal / frameWindowCount;
    if (diagnostics.frameAvgMs > 24) {
      slowFrameWindows++;
      fastFrameWindows = 0;
    } else if (diagnostics.frameAvgMs < 18) {
      fastFrameWindows++;
      slowFrameWindows = 0;
    }
    if (slowFrameWindows >= 2 && diagnostics.quality !== "reduced") {
      diagnostics.quality = "reduced";
      viewport.classList.add("quality-low");
    } else if (fastFrameWindows >= 4 && diagnostics.quality !== "full") {
      diagnostics.quality = "full";
      viewport.classList.remove("quality-low");
    }
    frameWindowTotal = 0;
    frameWindowCount = 0;
    renderDiagnostics();
  }

  function animate(now) {
    animationRaf = null;
    const dt = now - lastFrameTime;
    lastFrameTime = now;
    observeFrame(dt);

    // --- Screen dim / wake — decided first so a dimmed screen can skip all
    // rendering. Dimming only happens when not playing and after genuine user
    // inactivity. Once dimmed, rAF is stopped entirely until a wake event. ---
    setPlayerMode(!!state.trackId);
    viewport.classList.toggle("controls-idle",
      !!state.trackId && now - lastInteractionAt > CONTROLS_IDLE_MS);
    const modalOpen = $("wled-modal").classList.contains("open");
    const shouldDim = !state.isPlaying && !modalOpen && now - lastInteractionAt >= DIM_DELAY;
    if (shouldDim !== screenDimmed) setScreenDimmed(shouldDim);
    if (screenDimmed) {
      // No rAF is scheduled while dimmed. The optional clock has its own
      // minute-aligned timer, so both CPU and GPU truly sleep.
      return;
    }

    // --- Minimize morph easing (pinch to/from the crate) ---
    const minTarget = state.browsing ? 1 : 0;
    if (REDUCED_MOTION) {
      minimizeProg = minTarget;
    } else if (minimizeProg !== minTarget) {
      minimizeProg += (minTarget - minimizeProg) * (1 - Math.exp(-dt / 150));
      if (Math.abs(minTarget - minimizeProg) < 0.0015) minimizeProg = minTarget;
    }

    if (state.browsing) {
      // Minimizing: decelerate the record to upright (so it lands as a
      // square cover the right way up), coupled to the shrink progress.
      const e = REDUCED_MOTION ? 1 : easeOutQuint(Math.min(1, minimizeProg));
      currentAngle = browseStartAngle + (browseTargetAngle - browseStartAngle) * e;
    } else if (!state.tracklisting) {
      // (While the tracklist is up the record is held still — see below — so the
      // blurred platter stays a cached layer instead of re-rasterising each
      // frame as it spins. Through the blur the freeze is imperceptible.)
      // --- Spin easing ---
      if (spinSpeed !== spinTarget) {
        const elapsed = now - spinStartTime;
        const t = Math.min(elapsed / SPIN_RAMP, 1);
        const eased = easeInOut(t);
        spinSpeed = spinStartSpeed + (spinTarget - spinStartSpeed) * eased;
        if (t >= 1) {
          spinSpeed = spinTarget;
          // When fully stopped, start return-to-zero
          if (spinTarget === 0 && !returningToZero && Math.abs(currentAngle % 360) > 0.5) {
            returningToZero = true;
            returnStartAngle = currentAngle % 360;
            returnStartTime = now;
          }
        }
      }

      // --- Return to 0 degrees when stopped ---
      if (returningToZero && spinSpeed === 0) {
        const elapsed = now - returnStartTime;
        const t = Math.min(elapsed / RETURN_DURATION, 1);
        const eased = easeInOut(t);
        // Take shortest path to 0
        let target = 0;
        if (returnStartAngle > 180) target = 360;
        currentAngle = returnStartAngle + (target - returnStartAngle) * eased;
        if (t >= 1) {
          currentAngle = 0;
          returningToZero = false;
        }
      }
      // --- Rotate vinyl ---
      // Spin pauses during a flip so the only motion you see is the clean
      // 180° flip about the horizontal centre line, just like grabbing a
      // record off the platter to turn it over. The spin resumes on the
      // same angle the moment the flip ends.
      else if (spinSpeed > 0.001 && !flipStartTime) {
        returningToZero = false;
        // Ease toward the target RPM so a 33⅓ ↔ 45 change reads as the
        // platter motor catching up, not a snap.
        if (rpmCurrent !== rpmTarget) {
          rpmCurrent += (rpmTarget - rpmCurrent) * Math.min(1, dt / RPM_EASE_MS);
          if (Math.abs(rpmCurrent - rpmTarget) < 0.02) rpmCurrent = rpmTarget;
        }
        currentAngle += ((rpmCurrent * 360) / 60000) * dt * spinSpeed;
        currentAngle %= 360;
      }
    }

    applyVinylTransform(now);
    if (minimizeProg !== lastMinimizeProg) {
      applyMinimizeMorph();
      lastMinimizeProg = minimizeProg;
    }

    // While the tracklist is up, the record is frozen and its furniture is
    // hidden under the scrim — skip the per-frame canvas redraws so the
    // platter stays a cached layer (keeps the panel at 60fps).
    if (!state.tracklisting) {
      updateProgressRing(now); // progress ring
      updateLyrics(now);       // lyrics
      updateCrate(now, dt);    // crate glide/snap
    }
    scheduleAnimation();
  }

  // ── Static ring furniture, pre-rendered once per accent palette ──
  // The 60 ticks and the background track never move, so they're rendered to
  // an offscreen canvas once (and again only when the accent changes) and
  // blitted; each PROGRESS_DRAW_INTERVAL tick redraws just the progress arc,
  // the leading dot and the pause glyph.
  const ringStaticCanvas = document.createElement("canvas");
  ringStaticCanvas.width = ringStaticCanvas.height = 296;
  let ringStaticKey = "";
  function renderRingStatic() {
    ringStaticKey = uiAccentKey;
    const ctx = ringStaticCanvas.getContext("2d");
    const cx = RING_CX, cy = RING_CY, r = RING_R;
    const startAngle = -Math.PI / 2; // 12 o'clock
    ctx.clearRect(0, 0, 296, 296);

    // ── Tick marks (watch-style) ──
    for (let i = 0; i < TICK_COUNT; i++) {
      const angle = startAngle + (i / TICK_COUNT) * Math.PI * 2;
      const major = i % TICK_MAJOR_EVERY === 0;
      const len = major ? 10 : 4;
      const gap = 4;
      const tickR1 = r + gap;
      const tickR2 = r + gap + len;
      ctx.beginPath();
      ctx.moveTo(cx + tickR1 * Math.cos(angle), cy + tickR1 * Math.sin(angle));
      ctx.lineTo(cx + tickR2 * Math.cos(angle), cy + tickR2 * Math.sin(angle));
      ctx.strokeStyle = major
        ? `rgba(${uiAccentArr[0]},${uiAccentArr[1]},${uiAccentArr[2]},0.34)`
        : `rgba(${uiAccentArr[0]},${uiAccentArr[1]},${uiAccentArr[2]},0.13)`;
      ctx.lineWidth = major ? 1.5 : 0.8;
      ctx.stroke();
    }

    // ── Background track ──
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = RING_TRACK_W;
    ctx.stroke();
  }

  function updateProgressRing(now, force) {
    if (!state.trackId) {
      if (!lastProgressEmpty) {
        progressCtx.clearRect(0, 0, 296, 296);
        timeElapsed.textContent = "0:00";
        timeRemaining.textContent = "-0:00";
        timeFill.style.transform = "scaleX(0)";
        lastProgressEmpty = true;
      }
      return;
    }
    if (!force && now - lastProgressDraw < PROGRESS_DRAW_INTERVAL) return;
    lastProgressDraw = now;
    lastProgressEmpty = false;

    let p = state.progressMs;
    if (state.isPlaying && !state.stale) {
      p += now - state.lastUpdate;
    }
    p = Math.min(p, state.durationMs);
    const pct = p / Math.max(state.durationMs, 1);

    const ctx = progressCtx;
    const cx = RING_CX, cy = RING_CY, r = RING_R;
    const startAngle = -Math.PI / 2; // 12 o'clock

    ctx.clearRect(0, 0, 296, 296);
    if (ringStaticKey !== uiAccentKey) renderRingStatic();
    ctx.drawImage(ringStaticCanvas, 0, 0);

    if (pct > 0) {
    // ── Progress arc with gradient ──
    const endAngle = startAngle + pct * Math.PI * 2;

    // Create a conical-style gradient by drawing many small segments
    const segments = Math.max(2, Math.floor(pct * 72));
    for (let i = 0; i < segments; i++) {
      const t0 = i / segments;
      const t1 = (i + 1.5) / segments; // slight overlap to avoid gaps
      const a0 = startAngle + t0 * pct * Math.PI * 2;
      const a1 = startAngle + Math.min(t1, 1) * pct * Math.PI * 2;

      // Gradient: the record's accent → bright white along the arc, so the
      // trailing tail carries the album's colour and the leading edge stays
      // a bright tip.
      const t = t0;
      const alpha = 0.3 + t * 0.7;
      const rr = Math.round(uiAccentArr[0] + t * (255 - uiAccentArr[0]));
      const gg = Math.round(uiAccentArr[1] + t * (255 - uiAccentArr[1]));
      const bb = Math.round(uiAccentArr[2] + t * (255 - uiAccentArr[2]));

      ctx.beginPath();
      ctx.arc(cx, cy, r, a0, a1);
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.lineWidth = RING_ARC_W;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    // ── Glow behind the leading edge ──
    const glowAngle = endAngle;
    const glowX = cx + r * Math.cos(glowAngle);
    const glowY = cy + r * Math.sin(glowAngle);
    const glow = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, 18);
    glow.addColorStop(0, "rgba(255,255,255,0.25)");
    glow.addColorStop(0.5, "rgba(255,255,255,0.08)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    ctx.arc(glowX, glowY, 18, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // ── Dot at the leading edge ──
    const dotX = cx + r * Math.cos(endAngle);
    const dotY = cy + r * Math.sin(endAngle);

    // Outer ring
    ctx.beginPath();
    ctx.arc(dotX, dotY, RING_DOT_R, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();

    // Inner cutout (creates a ring/donut shape)
    ctx.beginPath();
    ctx.arc(dotX, dotY, RING_DOT_INNER, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(30,30,30,0.9)";
    ctx.fill();

    // Tiny bright center
    ctx.beginPath();
    ctx.arc(dotX, dotY, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fill();
    } // end pct > 0

    // ── Twist-seek preview — ghost of where the needle will land ──
    // Drawn while the twist gesture runs (forced redraws, not the idle
    // cadence): a faint bridge arc from here to the target and a hollow
    // accent marker on the target tick.
    if (seekPreviewPct != null) {
      const ppct = Math.max(0, Math.min(1, seekPreviewPct));
      const curAngle = startAngle + pct * Math.PI * 2;
      const targetAngle = startAngle + ppct * Math.PI * 2;
      if (Math.abs(ppct - pct) > 0.002) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.min(curAngle, targetAngle), Math.max(curAngle, targetAngle));
        // Forward: a faint white bridge over unplayed track. Rewinding lands
        // ON the bright progress arc, where white vanishes — dim that span
        // instead, so it reads as "about to be un-played".
        ctx.strokeStyle = ppct >= pct ? "rgba(255,255,255,0.22)" : "rgba(10,11,13,0.55)";
        ctx.lineWidth = RING_ARC_W;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      const gx = cx + r * Math.cos(targetAngle);
      const gy = cy + r * Math.sin(targetAngle);
      ctx.beginPath();
      ctx.arc(gx, gy, RING_DOT_R - 1, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${uiAccentArr[0]},${uiAccentArr[1]},${uiAccentArr[2]},0.95)`;
      ctx.lineWidth = 3.5;
      ctx.stroke();
    }

    // Pause icon — two vertical bars in center when paused
    if (!state.isPlaying && state.trackId) {
      const barW = 5, barH = 24, gap = 8;
      // Soft dark backing so the bars read on light label paper too
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,6,4,0.45)";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.roundRect(cx - gap/2 - barW, cy - barH/2, barW, barH, 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(cx + gap/2, cy - barH/2, barW, barH, 2);
      ctx.fill();
    }

    // Time display
    timeElapsed.textContent = fmt(p);
    timeRemaining.textContent = "-" + fmt(state.durationMs - p);
    timeFill.style.transform = `scaleX(${pct.toFixed(4)})`;
  }

  // ── Spin control ──
  function setSpinTarget(target) {
    if (REDUCED_MOTION) target = 0;
    if (spinTarget === target) return;
    spinTarget = target;
    spinStartTime = performance.now();
    spinStartSpeed = spinSpeed;
    scheduleAnimation(true);
  }

  // ── 45 Mode ──
  function setSingleMode(isSingle) {
    if (state.isSingle === isSingle) return;
    state.isSingle = isSingle;
    rpmTarget = isSingle ? RPM_SINGLE : RPM_BASE;
    viewport.classList.toggle("single", isSingle);
    // A 7" label is wider — grooves start beyond it, and the label re-renders
    // in its big-hole form.
    drawGrooves(isSingle ? 122 : GROOVE_START);
    lastLabelKey = "";
    renderLabel();
  }

  // ── Record Shelf — the crate ──
  // Sections of records (house picks, your playlists, recently spun, deeper
  // cuts) presented as a draggable crate: riffle through with momentum and
  // snap, the focused record turns face-on and lifts, tap it to put it on.
  const shelf = $("shelf");
  const crateEl = $("crate");
  const crateBelt = $("crate-belt");
  const crateChips = $("crate-chips");
  const crateReflection = $("crate-reflection");
  const capTitle = document.querySelector("#crate-caption .cap-title");
  const capSub = document.querySelector("#crate-caption .cap-sub");
  const crateProfilePrompt = $("crate-profile-prompt");
  const crateProfileCopy = $("crate-profile-copy");
  const crateProfileLink = $("crate-profile-link");

  const CRATE_SPACING = 224;   // px between records in the row
  const CRATE_CARD = 312;      // face size
  const CRATE_TOP = 360;       // #crate band's screen offset (must match CSS top)
  const CRATE_ROW_Y = 636 - CRATE_TOP; // row center, container-local (lower half)
  const CRATE_LIFT = 46;       // how far the focused record rises out of the crate
  let crateData = null;        // {sections: [...]}
  let crateSection = null;     // active section id
  let crateItems = [];
  let crateCards = [];
  let crateScroll = 0;
  let crateTarget = 0;         // null while dragging
  let crateDrag = null;
  let crateCaptionIdx = -1;
  let shelfFetchedAt = -Infinity;
  let shelfRetryAt = -Infinity;
  let shelfRefreshPromise = null;
  let shelfRetryTimer = null;
  let crateBuilding = false;
  let shelfLaunchedAt = -Infinity;
  let shelfRenderKey = "";
  let crateProfileSeen = false;
  let crateProfileState = null;
  let crateProfileEpoch = null;
  let crateProfileRevision = 0;
  let crateJoinUrl = null;
  let crateJoinPromise = null;
  let cratePairingUnavailable = false;
  let crateRotationApproximation = false;
  const CRATE_CACHE_MS = 120000;
  const CRATE_RETRY_MS = 10000;
  const CRATE_BUILD_RETRY_MS = 3000;

  function crateMaxScroll() {
    return Math.max(0, (crateItems.length - 1) * CRATE_SPACING);
  }

  function crateFocusedIndex() {
    return Math.max(0, Math.min(crateItems.length - 1, Math.round(crateScroll / CRATE_SPACING)));
  }

  function stableSectionKey(section, index) {
    return String(section && section.id || section && section.title || "section-" + index);
  }

  function stableCrateItemKey(item, index) {
    return String(item && (item.id || item.uri) || [item && item.title || "", item && item.subtitle || "", index].join("|"));
  }

  function crateSectionIsTopListening(section, index) {
    const key = stableSectionKey(section, index).toLowerCase();
    const title = String(section && section.title || "").trim().toLowerCase();
    return key === "rotation" || title === "your rotation";
  }

  function crateSectionDisplayTitle(section, index) {
    return crateSectionIsTopListening(section, index)
      ? "Your rotation · top listening"
      : String(section && section.title || "Records");
  }

  const CRATE_PROFILE_STATES = new Set(["linked", "unlinked", "reauth_required", "no_receiver"]);

  function crateProfileNeedsLink() {
    return crateProfileState === "unlinked" || crateProfileState === "reauth_required";
  }

  function crateProfileSignal(data) {
    if (!data || typeof data !== "object") return null;
    if (!Object.prototype.hasOwnProperty.call(data, "profile_state") ||
        !Object.prototype.hasOwnProperty.call(data, "profile_epoch")) return null;
    const profileState = data.profile_state;
    const profileEpoch = data.profile_epoch;
    if (!CRATE_PROFILE_STATES.has(profileState) ||
        (profileEpoch !== null && typeof profileEpoch !== "string")) return null;
    return { state: profileState, epoch: profileEpoch };
  }

  function currentCrateProfileMatches(signal) {
    return !!signal && crateProfileSeen && signal.state === crateProfileState &&
      signal.epoch === crateProfileEpoch;
  }

  function safePairingHref(value) {
    if (typeof value !== "string" || !value) return null;
    try {
      const url = new URL(value, location.href);
      return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
    } catch (e) {
      return null;
    }
  }

  function renderCrateProfilePrompt() {
    let message = "";
    if (crateProfileState === "reauth_required") {
      message = cratePairingUnavailable
        ? "House picks are showing. Spotify reauthorization is temporarily unavailable."
        : "House picks are showing. This household Spotify account needs to be linked again.";
    } else if (crateProfileState === "unlinked") {
      // The public profile signal deliberately does not reveal whether this
      // account belongs to a household member. Keep the prompt generic and do
      // not expose a Spotify name or identifier on the shared display.
      message = cratePairingUnavailable
        ? "House picks are showing. Household Spotify linking is temporarily unavailable."
        : "House picks are showing. Link this household Spotify account to show its playlists and albums.";
    } else if (crateProfileState === "no_receiver") {
      message = "Choose Pi Display in Spotify. Linked household crates return automatically; everyone else sees House picks.";
    }
    crateProfileCopy.textContent = message;
    const href = crateProfileNeedsLink() ? crateJoinUrl : null;
    crateProfileLink.hidden = !href;
    crateProfileLink.textContent = href
      ? "On that household member’s phone, " +
        (crateProfileState === "reauth_required" ? "link again at " : "open ") + href
      : "";
    crateProfilePrompt.classList.toggle("visible", !!message);
  }

  function invalidateCrateContents() {
    crateData = null;
    crateBuilding = false;
    shelfFetchedAt = -Infinity;
    shelfRetryAt = -Infinity;
    if (shelfRetryTimer) clearTimeout(shelfRetryTimer);
    shelfRetryTimer = null;
    cancelCratePreloads();
    clearCrateUi(false);
    renderCrateProfilePrompt();
  }

  function applyCrateProfileSignal(data, options) {
    const required = !!(options && options.required);
    const forceClear = !!(options && options.forceClear);
    const signal = crateProfileSignal(data);
    if (!signal) {
      if (required) throw new Error("invalid crate profile context");
      return false;
    }
    const changed = !currentCrateProfileMatches(signal);
    if (changed) {
      crateProfileSeen = true;
      crateProfileState = signal.state;
      crateProfileEpoch = signal.epoch;
      crateProfileRevision++;
      crateJoinUrl = null;
      cratePairingUnavailable = false;
    }
    if (changed || forceClear) invalidateCrateContents();
    else renderCrateProfilePrompt();
    if (changed && crateProfileNeedsLink()) {
      const pairingRevision = crateProfileRevision;
      queueMicrotask(() => {
        if (pairingRevision === crateProfileRevision && crateProfileNeedsLink()) {
          refreshCratePairingLink();
        }
      });
    }
    return changed;
  }

  function markCrateProfileUnknown() {
    // Receiver context is an authorization boundary. A mixed-version response,
    // malformed SSE event or receiver outage must not leave the last person's
    // private shelf visible while identity can no longer be verified.
    if (!crateProfileSeen && crateProfileState === "no_receiver" && crateProfileEpoch === null) return;
    crateProfileSeen = false;
    crateProfileState = "no_receiver";
    crateProfileEpoch = null;
    crateProfileRevision++;
    crateJoinUrl = null;
    cratePairingUnavailable = false;
    invalidateCrateContents();
  }

  function profileSignalFromResponse(response) {
    const profileState = response.headers.get("X-Spotify-Profile-State");
    if (!profileState) return null;
    const rawEpoch = response.headers.get("X-Spotify-Profile-Epoch");
    return {
      profile_state: profileState,
      profile_epoch: rawEpoch || null,
    };
  }

  function queueCrateRefreshForProfile() {
    const revision = crateProfileRevision;
    const pending = shelfRefreshPromise;
    if (!pending) {
      refreshCrateData();
      return;
    }
    pending.finally(() => {
      if (revision === crateProfileRevision && !shelfRefreshPromise) refreshCrateData();
    });
  }

  function observeReceiverProfile(data) {
    const changed = applyCrateProfileSignal(data);
    if (changed) queueCrateRefreshForProfile();
    return changed;
  }

  const CHIP_ARC_R = 2000; // px — must match the #crate-chips top offset
  function renderChips() {
    crateChips.innerHTML = "";
    const els = [];
    crateData.sections.forEach((s, sectionIndex) => {
      const sectionKey = stableSectionKey(s, sectionIndex);
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "crate-chip" + (sectionKey === crateSection ? " active" : "");
      chip.textContent = crateSectionDisplayTitle(s, sectionIndex);
      chip.setAttribute("role", "tab");
      chip.setAttribute("aria-selected", sectionKey === crateSection ? "true" : "false");
      chip.addEventListener("click", () => {
        if (crateSection === sectionKey) return;
        crateSection = sectionKey;
        buildCrate();
        renderChips();
      });
      crateChips.appendChild(chip);
      els.push(chip);
    });
    // Arc layout: cumulative widths → angle about an anchor far below the
    // row, so the chips follow the bezel's curvature and tilt with it.
    const gap = 12;
    const widths = els.map(el => el.offsetWidth);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (els.length - 1);
    let cum = -total / 2;
    els.forEach((el, i) => {
      const theta = (((cum + widths[i] / 2) / CHIP_ARC_R) * 180) / Math.PI;
      el.style.transform =
        `translate(-50%, -50%) rotate(${theta.toFixed(3)}deg) translateY(${-CHIP_ARC_R}px)`;
      cum += widths[i] + gap;
    });
  }

  function buildCrate() {
    const sections = crateData.sections;
    const sectionIndex = Math.max(0, sections.findIndex((s, i) => stableSectionKey(s, i) === crateSection));
    const section = sections[sectionIndex] || sections[0];
    if (!section) return;
    crateSection = stableSectionKey(section, sectionIndex);
    crateRotationApproximation = crateSectionIsTopListening(section, sectionIndex);
    crateItems = section.items || [];
    crateBelt.innerHTML = "";
    crateCards = crateItems.map((item, index) => {
      const el = document.createElement("div");
      el.className = "crate-card";
      el.dataset.key = stableCrateItemKey(item, index);
      el.id = "crate-option-" + index;
      el.setAttribute("role", "option");
      el.setAttribute("aria-label", [item.title || "Untitled record", item.subtitle || ""].filter(Boolean).join(" — "));
      el.setAttribute("aria-selected", "false");
      el.style.setProperty("--accent", item.accent || "#888");
      el._imageUrl = item.image || "";
      el._imageApplied = false;
      crateBelt.appendChild(el);
      return el;
    });
    crateScroll = 0;
    crateTarget = 0;
    crateCaptionIdx = -1;
    layoutCrate();
    markCrateNowPlaying();
  }

  function layoutCrate() {
    const focusIdx = crateFocusedIndex();
    for (let i = 0; i < crateCards.length; i++) {
      const el = crateCards[i];
      const d = i * CRATE_SPACING - crateScroll;
      const ad = Math.abs(d);
      if (ad > 720) {
        el.setAttribute("aria-hidden", "true");
        el.style.opacity = "0";
        el.style.transform = "translate3d(-9999px,0,0)";
        el.style.willChange = "auto"; // demote parked sleeves — GPU layers cost real RAM on the 1GB Pi
        continue;
      }
      el.setAttribute("aria-hidden", "false");
      if (!el._imageApplied && el._imageUrl) {
        el.style.backgroundImage = cssUrl(el._imageUrl);
        el._imageApplied = true;
        queueCrateImage(el._imageUrl);
      }
      el.style.willChange = "transform";
      const t = Math.max(-1, Math.min(1, d / 320));
      const lift = 1 - Math.abs(t);
      const x = 540 + d * 1.02 - CRATE_CARD / 2;
      const y = CRATE_ROW_Y - lift * CRATE_LIFT - CRATE_CARD / 2;
      const z = lift * 220;
      const rotY = -t * 56;
      const scale = 0.80 + lift * 0.40;
      el.style.transform =
        `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) rotateY(${rotY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
      el.style.opacity = ad > 560 ? String(Math.max(0, 1 - (ad - 560) / 140)) : "1";
      el.style.zIndex = String(200 - Math.round(ad / 10));
      el.classList.toggle("focused", i === focusIdx);
      el.setAttribute("aria-selected", i === focusIdx ? "true" : "false");
    }
    if (focusIdx !== crateCaptionIdx && crateItems[focusIdx]) {
      crateEl.setAttribute("aria-activedescendant", crateCards[focusIdx].id);
      crateCaptionIdx = focusIdx;
      const focusedItem = crateItems[focusIdx];
      capTitle.textContent = focusedItem.title || "";
      const subtitle = focusedItem.subtitle || "";
      const isNowPlaying = !!(crateNowPlayingUri() && focusedItem.uri === crateNowPlayingUri());
      const prefix = isNowPlaying
        ? "Now spinning"
        : (crateRotationApproximation ? "Top-listening approximation" : "");
      capSub.textContent = [prefix, subtitle].filter(Boolean).join(" · ");
      if (FLAG_REFLECT) {
        const img = focusedItem.image;
        crateReflection.style.display = img ? "block" : "none";
        if (img) crateReflection.style.backgroundImage = cssUrl(img);
      }
      preloadCrateWindow(focusIdx);
    }
  }

  // The shelf card holding the playing record is matched by album URI —
  // item ids are synthetic per section (saved-3, rotation-<id>, spin-<id>)
  // but every album item carries uri spotify:album:<albumId>.
  function crateNowPlayingUri() {
    return state.albumId ? "spotify:album:" + state.albumId : "";
  }

  // Mark the shelf card that holds the record currently on the turntable:
  // a mini-disc peeks out of its sleeve and turns while playback runs.
  let crateLastNowUri = "";
  function markCrateNowPlaying() {
    const nowUri = crateNowPlayingUri();
    for (let i = 0; i < crateCards.length; i++) {
      const el = crateCards[i];
      const item = crateItems[i];
      const isNow = !!(nowUri && item && item.uri === nowUri);
      if (isNow && !el.classList.contains("now-playing")) {
        el.classList.add("now-playing");
        const peek = document.createElement("div");
        peek.className = "crate-peek";
        peek.setAttribute("aria-hidden", "true");
        const disc = document.createElement("div");
        disc.className = "crate-peek-disc";
        peek.appendChild(disc);
        el.appendChild(peek);
      } else if (!isNow && el.classList.contains("now-playing")) {
        el.classList.remove("now-playing", "peek-paused");
        const peek = el.querySelector(".crate-peek");
        if (peek) peek.remove();
      }
      if (isNow) el.classList.toggle("peek-paused", !state.isPlaying || state.stale);
    }
    // The caption's "Now spinning" prefix is memoized on the focused index —
    // when the playing record changes, invalidate it so an open shelf's
    // caption agrees with the marker without waiting for a scroll.
    if (nowUri !== crateLastNowUri) {
      crateLastNowUri = nowUri;
      crateCaptionIdx = -1;
      if (state.browsing) layoutCrate();
    }
  }

  // Crate physics — exponential glide toward the snap target; momentum comes
  // from projecting the release velocity forward before snapping.
  function updateCrate(now, dt) {
    if (!crateCards.length || !shelf.classList.contains("visible")) return;
    if (!crateDrag && crateTarget !== null && crateScroll !== crateTarget) {
      if (REDUCED_MOTION) {
        crateScroll = crateTarget;
        layoutCrate();
        return;
      }
      const k = 1 - Math.exp(-dt / 130);
      crateScroll += (crateTarget - crateScroll) * k;
      if (Math.abs(crateTarget - crateScroll) < 0.4) crateScroll = crateTarget;
      layoutCrate();
    }
  }

  crateEl.addEventListener("pointerdown", e => {
    if (!crateCards.length) return;
    try { crateEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    crateDrag = {
      id: e.pointerId,
      startX: e.clientX,
      startScroll: crateScroll,
      lastX: e.clientX,
      lastT: performance.now(),
      vel: 0,
      moved: false,
    };
  });

  crateEl.addEventListener("pointermove", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const now = performance.now();
    if (Math.abs(e.clientX - crateDrag.startX) > 9) crateDrag.moved = true;
    let next = crateDrag.startScroll - (e.clientX - crateDrag.startX);
    const max = crateMaxScroll();
    if (next < 0) next *= 0.35;                       // rubber band
    else if (next > max) next = max + (next - max) * 0.35;
    const dtm = Math.max(1, now - crateDrag.lastT);
    crateDrag.vel = 0.75 * crateDrag.vel + 0.25 * (-(e.clientX - crateDrag.lastX) / dtm);
    crateDrag.lastX = e.clientX;
    crateDrag.lastT = now;
    crateScroll = next;
    crateTarget = null;
    layoutCrate();
    e.preventDefault();
  }, { passive: false });

  function crateRelease(e) {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const drag = crateDrag;
    crateDrag = null;
    scheduleAnimation(true);
    const max = crateMaxScroll();

    if (!drag.moved) {
      // In browse mode the parked mini-disc overlaps the top of this band —
      // a tap there means "back to the player", so let it bubble to the
      // viewport handler instead of gliding the crate.
      if (state.browsing && Math.abs(e.clientX - 540) <= 150 && e.clientY <= 320) return;
      // Tap — invert the layout to find which record was touched.
      const d = (e.clientX - 540) / 1.02;
      const idx = Math.round((crateScroll + d) / CRATE_SPACING);
      if (idx >= 0 && idx < crateItems.length) {
        const offset = Math.abs(d - (idx * CRATE_SPACING - crateScroll));
        if (idx === crateFocusedIndex() && offset < CRATE_CARD * 0.7) {
          launchItem(crateItems[idx]);   // tap the focused record → play it
        } else {
          crateTarget = Math.min(max, Math.max(0, idx * CRATE_SPACING));
        }
      }
      return;
    }
    // Flick — project the velocity forward, snap to the nearest record.
    const projected = crateScroll + drag.vel * 260;
    crateTarget = Math.min(max, Math.max(0, Math.round(projected / CRATE_SPACING) * CRATE_SPACING));
  }
  crateEl.addEventListener("pointerup", crateRelease);
  crateEl.addEventListener("pointercancel", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    crateDrag = null;
    crateTarget = Math.min(crateMaxScroll(), Math.max(0, Math.round(crateScroll / CRATE_SPACING) * CRATE_SPACING));
    scheduleAnimation(true);
  });

  crateEl.addEventListener("keydown", e => {
    if (!crateItems.length) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      launchItem(crateItems[crateFocusedIndex()]);
      return;
    }
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const direction = e.key === "ArrowRight" ? 1 : -1;
    const next = Math.max(0, Math.min(crateItems.length - 1, crateFocusedIndex() + direction));
    crateTarget = next * CRATE_SPACING;
    crateScroll = crateTarget;
    layoutCrate();
    armBrowseTimeout();
  });

  async function launchItem(item) {
    if (performance.now() - shelfLaunchedAt < 4000) return;
    shelfLaunchedAt = performance.now();
    const launchProfileRevision = crateProfileRevision;
    const launchProfileEpoch = crateProfileEpoch;
    try {
      const r = await fetch("/api/idle/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uri: item.uri, profile_epoch: launchProfileEpoch }),
      });
      let responseData = {};
      try { responseData = await r.json(); } catch (e2) { /* empty success is valid */ }
      if (r.status === 409 && responseData.code === "profile_changed") {
        applyCrateProfileSignal(responseData, { required: true, forceClear: true });
        queueCrateRefreshForProfile();
        shelfLaunchedAt = -Infinity;
        showWledToast("The active listener changed — refreshing their crate");
        return;
      }
      if (!r.ok) {
        const msg = responseData.error || "";
        throw new Error(msg || ("idle play failed: " + r.status));
      }
      // A profile-bearing playback/SSE update may beat this response back to
      // the kiosk. Do not complete an old listener's launch after handoff.
      if (launchProfileRevision !== crateProfileRevision) {
        invalidateCrateContents();
        queueCrateRefreshForProfile();
        shelfLaunchedAt = -Infinity;
        showWledToast("The active listener changed — refreshing their crate");
        return;
      }
      shelf.classList.remove("visible");
      exitBrowse(); // zoom the platter back up for the new record
      startRecordFlip("next"); // pull the record onto the platter
      setTimeout(poll, 600);
      setTimeout(poll, 1800);
    } catch (e) {
      shelfLaunchedAt = -Infinity;
      // "not ready" = go-librespot has no stored session yet. One Spotify
      // Connect visit fixes it for good (credentials persist from then on).
      showWledToast(/not ready/i.test(e.message)
        ? "One-time setup: pick “Pi Display” in Spotify once — then the shelf can start music by itself"
        : "Couldn't start playback — speaker not ready");
    }
  }

  // Warm only the likely-visible sleeves, with bounded concurrency and a
  // persistent completed set. This avoids repeating a burst of ~50 decodes on
  // every two-minute crate refresh.
  const _crateImgDone = new Set();
  const _crateImgQueued = new Set();
  const _crateImgQueue = [];
  const _crateImgActive = new Map();
  const CRATE_PRELOAD_CONCURRENCY = 3;

  function cancelCratePreloads() {
    _crateImgQueue.length = 0;
    _crateImgQueued.clear();
    _crateImgDone.clear();
    for (const image of _crateImgActive.values()) {
      image.onload = null;
      image.onerror = null;
      image.src = "";
    }
    _crateImgActive.clear();
  }

  function pumpCratePreloads() {
    while (_crateImgActive.size < CRATE_PRELOAD_CONCURRENCY && _crateImgQueue.length) {
      const url = _crateImgQueue.shift();
      _crateImgQueued.delete(url);
      if (_crateImgDone.has(url) || _crateImgActive.has(url)) continue;
      const image = new Image();
      image.decoding = "async";
      _crateImgActive.set(url, image);
      image.onload = image.onerror = () => {
        _crateImgActive.delete(url);
        _crateImgDone.add(url); // also suppress retry storms for broken covers
        while (_crateImgDone.size > 256) _crateImgDone.delete(_crateImgDone.values().next().value);
        pumpCratePreloads();
      };
      image.src = url;
    }
  }

  function queueCrateImage(url) {
    if (!url || _crateImgDone.has(url) || _crateImgActive.has(url) || _crateImgQueued.has(url)) return;
    if (_crateImgQueue.length >= 64) return;
    _crateImgQueued.add(url);
    _crateImgQueue.push(url);
    pumpCratePreloads();
  }

  function preloadCrateWindow(focusIndex) {
    for (let i = Math.max(0, focusIndex - 3); i <= Math.min(crateItems.length - 1, focusIndex + 3); i++) {
      queueCrateImage(crateItems[i] && crateItems[i].image);
    }
  }

  function preloadCrateImages(data) {
    if (!data || !data.sections) return;
    for (const s of data.sections) {
      // First few covers from each tab make initial navigation feel instant;
      // layoutCrate queues neighbours as focus moves.
      for (const it of (s.items || []).slice(0, 4)) queueCrateImage(it && it.image);
    }
  }

  function clearCrateUi(showEmptyMessage) {
    crateSection = null;
    crateItems = [];
    crateCards = [];
    crateDrag = null;
    crateScroll = 0;
    crateTarget = 0;
    crateCaptionIdx = -1;
    crateRotationApproximation = false;
    shelfRenderKey = "empty";
    crateChips.replaceChildren();
    crateBelt.replaceChildren();
    crateEl.removeAttribute("aria-activedescendant");
    crateReflection.style.display = "none";
    crateReflection.style.backgroundImage = "";
    capTitle.textContent = showEmptyMessage ? "No records available" : "";
    capSub.textContent = showEmptyMessage
      ? crateProfileState === "linked"
        ? "This linked crate is empty right now"
        : crateProfileState === "reauth_required"
          ? "Link this household Spotify account again to restore its albums and playlists"
          : crateProfileState === "unlinked"
          ? "Link a household Spotify account to add its albums and playlists"
          : "Choose Pi Display in Spotify; unlinked listeners use House picks"
      : "";
  }

  function renderCrateLoading() {
    clearCrateUi(false);
    shelfRenderKey = "loading";
    capTitle.textContent = "Building the record shelf…";
    capSub.textContent = "Finding albums and playlists";
    shelf.classList.toggle("visible", !state.trackId || state.browsing);
  }

  function renderCrateData() {
    if (!crateData && crateBuilding) {
      renderCrateLoading();
      return;
    }
    const sections = (crateData && crateData.sections) || [];
    if (!sections.length) {
      clearCrateUi(true);
      shelf.classList.toggle("visible", !state.trackId || state.browsing);
      return;
    }
    const key = JSON.stringify(sections.map((s, sectionIndex) => [
      stableSectionKey(s, sectionIndex),
      (s.items || []).map((item, itemIndex) => stableCrateItemKey(item, itemIndex)),
    ]));
    if (key !== shelfRenderKey) {
      shelfRenderKey = key;
      if (!crateSection || !sections.some((s, i) => stableSectionKey(s, i) === crateSection)) {
        crateSection = stableSectionKey(sections[0], 0);
      }
      renderChips();
      buildCrate();
    }
    shelf.classList.toggle("visible", !state.trackId || state.browsing);
  }

  function scheduleCrateRetry(delay) {
    if (shelfRetryTimer) clearTimeout(shelfRetryTimer);
    shelfRetryTimer = setTimeout(() => {
      shelfRetryTimer = null;
      refreshCrateData();
    }, delay);
  }

  function refreshCratePairingLink() {
    if (!crateProfileNeedsLink()) return Promise.resolve(false);
    if (crateJoinPromise) return crateJoinPromise;
    const expectedRevision = crateProfileRevision;
    crateJoinPromise = (async () => {
      const response = await fetch("/api/idle/playlists", {
        cache: "no-store",
        credentials: "same-origin",
      });
      if (!response.ok) throw new Error("pairing request failed: " + response.status);
      const data = await response.json();
      // A profile signal received while this request was in flight wins. An
      // old pairing URL must never cross a receiver handoff.
      if (expectedRevision !== crateProfileRevision) return false;
      const signal = crateProfileSignal(data);
      if (!signal) throw new Error("invalid pairing profile context");
      if (!currentCrateProfileMatches(signal)) {
        if (applyCrateProfileSignal(data)) queueCrateRefreshForProfile();
        return false;
      }
      crateJoinUrl = safePairingHref(data.join_url);
      cratePairingUnavailable = !crateJoinUrl && !!data.pairing_error;
      renderCrateProfilePrompt();
      return !!crateJoinUrl;
    })().catch(() => {
      if (expectedRevision === crateProfileRevision && crateProfileNeedsLink()) {
        crateJoinUrl = null;
        cratePairingUnavailable = true;
        renderCrateProfilePrompt();
      }
      return false;
    }).finally(() => {
      crateJoinPromise = null;
      if (expectedRevision !== crateProfileRevision && crateProfileNeedsLink() &&
          !crateJoinUrl) queueMicrotask(refreshCratePairingLink);
    });
    return crateJoinPromise;
  }

  function applyCratePayload(data, now) {
    if (!data || !Array.isArray(data.sections)) throw new Error("invalid crate payload");
    applyCrateProfileSignal(data, { required: true });
    if (crateProfileNeedsLink()) refreshCratePairingLink();
    if (data.building === true) {
      crateBuilding = true;
      shelfRetryAt = now + CRATE_BUILD_RETRY_MS;
      if (!crateData) renderCrateLoading();
      scheduleCrateRetry(CRATE_BUILD_RETRY_MS);
      return false;
    }

    crateBuilding = false;
    crateData = data;
    shelfFetchedAt = now;
    shelfRetryAt = now + CRATE_CACHE_MS;
    if (shelfRetryTimer) clearTimeout(shelfRetryTimer);
    shelfRetryTimer = null;
    preloadCrateImages(data);
    renderCrateData();
    return true;
  }

  function refreshCrateData() {
    if (shelfRefreshPromise) return shelfRefreshPromise;
    // Reserve a short retry window immediately so rapid playback/SSE updates
    // cannot start duplicate crate requests. A failed request preserves the
    // last successfully rendered data and becomes eligible again after 10s.
    shelfRetryAt = performance.now() + CRATE_RETRY_MS;
    const expectedProfileRevision = crateProfileRevision;
    shelfRefreshPromise = (async () => {
      const response = await fetch("/api/crate", { cache: "no-store", credentials: "same-origin" });
      if (!response.ok) throw new Error("crate request failed: " + response.status);
      const data = await response.json();
      const signal = crateProfileSignal(data);
      if (!signal) throw new Error("invalid crate profile context");
      if (expectedProfileRevision !== crateProfileRevision &&
          !currentCrateProfileMatches(signal)) return false;
      // A non-building empty array is authoritative (for example after an
      // account disconnect). `building:true`, however, is a transient cold
      // response and must never erase the last completed shelf.
      return applyCratePayload(data, performance.now());
    })().catch(() => {
      crateBuilding = false;
      shelfRetryAt = performance.now() + CRATE_RETRY_MS;
      scheduleCrateRetry(CRATE_RETRY_MS);
      renderCrateData();
      return false;
    }).finally(() => {
      shelfRefreshPromise = null;
    });
    return shelfRefreshPromise;
  }

  async function updateShelf() {
    if (state.trackId && !state.browsing) {
      shelf.classList.remove("visible");
      return;
    }
    // Just launched something — keep the *idle* shelf hidden while the receiver
    // starts up. But if the user has pinched back into browse mode they want the
    // crate NOW, so don't let the startup window swallow a deliberate re-entry.
    if (!state.browsing && performance.now() - shelfLaunchedAt < 10000) return;

    const now = performance.now();
    if ((!crateData || now - shelfFetchedAt > CRATE_CACHE_MS) && now >= shelfRetryAt) {
      const refresh = refreshCrateData();
      // Only block when we have nothing to show; a stale crate renders
      // immediately and the refresh lands on a later poll.
      if (!crateData) await refresh;
    }
    renderCrateData();
  }

  // ── Browse mode (pinch-in minimize) ──
  // The platter recedes to a mini-disc parked up top while the shelf rises
  // beneath — layers moving in z, like minimizing an app. Tap the mini-disc
  // (or wait) to zoom back; tap a sleeve to put on a new record.
  let browseTimer = null;

  function enterBrowse() {
    if (state.browsing || !state.trackId) return;
    state.browsing = true;
    viewport.classList.add("browsing");
    // Decelerate the record to a stop at the nearest upright position, so it
    // settles square-side-up as it morphs into the cover. The animate loop
    // eases currentAngle from here to browseTargetAngle over the minimize.
    browseStartAngle = ((currentAngle % 360) + 360) % 360;
    browseTargetAngle = browseStartAngle > 180 ? 360 : 0;
    spinTarget = 0;
    spinSpeed = 0;
    spinStartSpeed = 0;
    returningToZero = false;
    // Show whatever crate data we already have IMMEDIATELY — updateShelf
    // refreshes in the background when its TTL lapses. Forcing a refetch
    // here made every pinch-in wait on the server.
    updateShelf();
    armBrowseTimeout();
    scheduleAnimation(true);
  }

  function exitBrowse() {
    if (!state.browsing) return;
    state.browsing = false;
    viewport.classList.remove("browsing");
    if (browseTimer) { clearTimeout(browseTimer); browseTimer = null; }
    if (state.trackId) shelf.classList.remove("visible");
    // Record is upright (angle 0) — spin it back up if playback continues.
    setSpinTarget(state.isPlaying ? 1 : 0);
    scheduleAnimation(true);
  }

  function armBrowseTimeout() {
    if (browseTimer) clearTimeout(browseTimer);
    browseTimer = setTimeout(exitBrowse, 45000);
  }

  // Tap the parked cover (top of screen) to return to the player.
  viewport.addEventListener("click", e => {
    if (!state.browsing) return;
    if (Math.abs(e.clientX - 540) <= 150 && e.clientY <= 300) exitBrowse();
  });

  // ── Track list (pinch-out) ──
  // The record stays spinning but recedes behind a scrim; a center-focused
  // picker of the album's tracks rises over it. Tap a track to play the album
  // from there; tap aside (off the list column) to dismiss.
  const tlEl = $("tracklist");
  const tlPicker = $("tl-picker");
  const tlStatus = $("tl-status");
  const tlAlbumEl = tlEl.querySelector(".tl-album");
  const tlArtistEl = tlEl.querySelector(".tl-artist");
  const TL_ROW_PX = 96;        // vertical spacing between rows (1080 space)
  const TL_CENTER = 330;       // picker mid-line (height 660 / 2)
  const tracklistCache = new Map(); // bounded insertion-order LRU: albumId -> tracks
  let tlTracks = [];
  let tlRows = [];
  let tlOffset = 0;            // float index centered on the mid-line
  let tlSnapRaf = null;
  let tlDragMoved = false;
  let tlTimer = null;
  let tlLaunchAt = -Infinity;
  let tlRequestEpoch = 0;
  let tlAbortController = null;
  let tlRestoreFocus = null;

  // Tracklist highlight uses the guarded UI accent — same tint as the rest of
  // the chrome, and never goes muddy on dark artwork like the raw accent could.
  function tlAccent() { return uiAccentCss; }

  function tlLayout() {
    for (let i = 0; i < tlRows.length; i++) {
      const d = i - tlOffset, ad = Math.abs(d);
      const y = TL_CENTER + d * TL_ROW_PX;
      const scale = Math.max(0.6, 1 - 0.085 * ad);
      const op = ad > 3.6 ? 0 : Math.max(0, 1.12 - 0.30 * ad);
      const row = tlRows[i];
      row.style.transform = `translateY(${y}px) scale(${scale.toFixed(3)})`;
      row.style.opacity = op.toFixed(3);
      row.style.pointerEvents = ad > 3.6 ? "none" : "auto";
      if (!row._current) {
        const t = row.querySelector(".tl-title");
        t.style.color = `rgba(255,255,255,${(0.4 + 0.5 * Math.max(0, 1 - ad * 0.5)).toFixed(2)})`;
      }
    }
  }

  function tlAnimateTo(target) {
    cancelAnimationFrame(tlSnapRaf);
    if (REDUCED_MOTION) {
      tlOffset = target;
      tlLayout();
      return;
    }
    const step = () => {
      tlOffset += (target - tlOffset) * 0.22;
      if (Math.abs(target - tlOffset) < 0.004) { tlOffset = target; tlLayout(); return; }
      tlLayout();
      tlSnapRaf = requestAnimationFrame(step);
    };
    step();
  }

  function tlSnap() {
    tlOffset = Math.max(0, Math.min(tlTracks.length - 1, Math.round(tlOffset)));
    tlAnimateTo(tlOffset);
  }

  function buildTlRows() {
    tlPicker.innerHTML = "";
    tlRows = [];
    if (tlTracks.length) tlStatus.textContent = "";
    else if (!tlStatus.textContent) tlStatus.textContent = "No tracks are available for this album.";
    const curUri = state.trackUri || "";
    let curIdx = 0;
    tlTracks.forEach((t, i) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "tl-row";
      const isCur = t.uri === curUri;
      if (isCur) { row.classList.add("tl-current"); row._current = true; curIdx = i; }
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", isCur ? "true" : "false");
      row.tabIndex = -1;
      row.dataset.key = String(t.id || t.uri || [t.name || "", t.duration_ms || 0, i].join("|"));
      const num = document.createElement("span");
      num.className = "tl-num";
      if (isCur) {
        // Animated EQ bars instead of the track number on the live row.
        const eq = document.createElement("span");
        eq.className = "tl-eq";
        eq.setAttribute("aria-hidden", "true");
        eq.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
        num.appendChild(eq);
      } else {
        num.textContent = t.number || (i + 1);
      }
      const title = document.createElement("span");
      title.className = "tl-title";
      title.textContent = t.name || "";
      const dur = document.createElement("span");
      dur.className = "tl-dur";
      dur.textContent = fmt(t.duration_ms || 0);
      if (isCur) { num.style.color = tlAccent(); title.style.color = tlAccent(); }
      row.append(num, title, dur);
      row.addEventListener("click", ev => {
        ev.stopPropagation();
        if (tlDragMoved) return;
        playTrack(t.uri);
      });
      tlPicker.appendChild(row);
      tlRows.push(row);
    });
    tlOffset = curIdx;
    if (tlRows[curIdx]) tlRows[curIdx].tabIndex = 0;
    tlLayout();
  }

  async function loadTracklist() {
    const key = state.albumId || "";
    const epoch = ++tlRequestEpoch;
    if (tlAbortController) tlAbortController.abort();
    tlAbortController = new AbortController();
    if (key && tracklistCache.has(key)) {
      tlTracks = tracklistCache.get(key);
      tracklistCache.delete(key);
      tracklistCache.set(key, tlTracks);
      tlStatus.textContent = tlTracks.length ? "" : "No tracks are available for this album.";
      buildTlRows();
      tlAbortController = null;
      return;
    }
    tlTracks = [];
    tlPicker.innerHTML = "";
    tlStatus.textContent = "Loading album tracks…";
    try {
      const url = key ? "/api/album/tracks?album_id=" + encodeURIComponent(key) : "/api/album/tracks";
      const r = await fetch(url, { signal: tlAbortController.signal, credentials: "same-origin" });
      if (epoch !== tlRequestEpoch || key !== (state.albumId || "") || !state.tracklisting) return;
      if (r.ok) {
        const d = await r.json();
        tlTracks = (d && d.tracks) || [];
        if (d && d.album_id) {
          tracklistCache.delete(d.album_id);
          tracklistCache.set(d.album_id, tlTracks);
          while (tracklistCache.size > 12) tracklistCache.delete(tracklistCache.keys().next().value);
        }
        tlStatus.textContent = "";
      } else {
        tlTracks = [];
        tlStatus.textContent = r.status === 401 || r.status === 403
          ? "Owner authorisation is required to browse this album."
          : "Album tracks could not be loaded. Tap aside to close.";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
      if (epoch !== tlRequestEpoch || !state.tracklisting) return;
      tlTracks = [];
      tlStatus.textContent = "Album tracks are unavailable while the display is offline.";
    } finally {
      if (epoch === tlRequestEpoch) tlAbortController = null;
    }
    if (state.tracklisting) {
      buildTlRows();
      const focused = tlRows[Math.round(tlOffset)];
      if (focused) focused.focus({ preventScroll: true });
    }
  }

  function refreshTracklist() {
    if (!state.tracklisting) return;
    tlAlbumEl.textContent = state.albumName || "";
    tlArtistEl.textContent = state.artistName || "";
    loadTracklist();
  }

  function openTracklist() {
    if (state.tracklisting || state.browsing || !state.trackId) return;
    state.tracklisting = true;
    tlRestoreFocus = document.activeElement;
    setModalLayersInert("tracklist", tracklistBackgroundLayers, true);
    viewport.classList.add("tracklisting");
    tlEl.classList.add("visible");
    tlEl.setAttribute("aria-hidden", "false");
    tlEl.focus({ preventScroll: true });
    // Progressive disclosure: the gesture hint retires after 3 viewings.
    try {
      const seen = +(localStorage.tlHintSeen || 0);
      $("tl-hint").style.display = seen >= 3 ? "none" : "";
      localStorage.tlHintSeen = seen + 1;
    } catch (e) { /* storage unavailable — keep the hint */ }
    tlAlbumEl.textContent = state.albumName || "";
    tlArtistEl.textContent = state.artistName || "";
    loadTracklist();
    armTlTimeout();
  }

  function closeTracklist() {
    const wasOpen = state.tracklisting;
    state.tracklisting = false;
    setModalLayersInert("tracklist", tracklistBackgroundLayers, false);
    viewport.classList.remove("tracklisting");
    tlEl.classList.remove("visible");
    tlEl.setAttribute("aria-hidden", "true");
    if (tlTimer) { clearTimeout(tlTimer); tlTimer = null; }
    if (tlAbortController) { tlAbortController.abort(); tlAbortController = null; }
    tlRequestEpoch++;
    cancelAnimationFrame(tlSnapRaf);
    tlPts.clear();
    tlScroll = null;
    tlPinch = null;
    tlDragMoved = false;
    if (wasOpen && tlRestoreFocus && typeof tlRestoreFocus.focus === "function") {
      tlRestoreFocus.focus({ preventScroll: true });
    }
    tlRestoreFocus = null;
    scheduleAnimation(true);
  }

  function armTlTimeout() {
    if (tlTimer) clearTimeout(tlTimer);
    tlTimer = setTimeout(closeTracklist, 45000);
  }

  async function playTrack(uri) {
    if (performance.now() - tlLaunchAt < 1500) return;
    tlLaunchAt = performance.now();
    try {
      const r = await fetch("/api/album/play-track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uri }),
      });
      if (!r.ok) {
        let msg = "";
        try { msg = (await r.json()).error || ""; } catch (e2) {}
        throw new Error(msg || ("play-track failed: " + r.status));
      }
      closeTracklist();
      startRecordFlip("next");      // pull the chosen track onto the platter
      setTimeout(poll, 600);
      setTimeout(poll, 1800);
    } catch (e) {
      tlLaunchAt = -Infinity;
      showWledToast("Couldn't start that track");
    }
  }

  // One pointer tracker for the whole overlay drives BOTH interactions:
  // one finger on the list column scrolls it; two fingers pinching in closes
  // the tracklist (back to the player — same as tapping aside). Events on the
  // rows/picker bubble up to #tracklist, so no pointer capture is needed.
  const tlPts = new Map();        // pointerId -> {x, y}
  let tlScroll = null;            // {id, y, o} active one-finger scroll
  let tlPinch = null;             // {d0} active two-finger pinch
  function tlDist() {
    const p = [...tlPts.values()];
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  tlEl.addEventListener("pointerdown", e => {
    tlPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    armTlTimeout();
    if (tlPts.size === 2) {
      tlScroll = null;            // a second finger landed — it's a pinch, not a scroll
      tlPinch = { d0: tlDist() };
    } else if (tlPts.size === 1 && e.target.closest("#tl-picker")) {
      tlScroll = { id: e.pointerId, y: e.clientY, o: tlOffset };
      tlDragMoved = false;
      cancelAnimationFrame(tlSnapRaf);
    }
  });
  tlEl.addEventListener("pointermove", e => {
    const p = tlPts.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (tlPinch && tlPts.size >= 2) {
      // Fingers drawn together past the commit distance → back to the player.
      if (tlDist() - tlPinch.d0 <= -PINCH_COMMIT_PX) { tlPinch = null; closeTracklist(); }
      return;
    }
    if (tlScroll && e.pointerId === tlScroll.id) {
      const dy = e.clientY - tlScroll.y;
      if (Math.abs(dy) > 5) tlDragMoved = true;
      tlOffset = Math.max(0, Math.min(tlTracks.length - 1, tlScroll.o - dy / TL_ROW_PX));
      tlLayout();
    }
  });
  function tlPointerEnd(e) {
    tlPts.delete(e.pointerId);
    if (tlScroll && e.pointerId === tlScroll.id) {
      tlScroll = null;
      if (tlDragMoved) tlSnap();
      setTimeout(() => { tlDragMoved = false; }, 0); // let the row click see it first
    }
    if (tlPts.size < 2) tlPinch = null;
  }
  function tlPointerAbort(e) {
    tlPts.delete(e.pointerId);
    tlScroll = null;
    tlPinch = null;
    tlDragMoved = false;
    tlSnap();
  }
  tlEl.addEventListener("pointerup", tlPointerEnd);
  tlEl.addEventListener("pointercancel", tlPointerAbort);
  tlEl.addEventListener("lostpointercapture", tlPointerAbort);
  tlPicker.addEventListener("wheel", e => {
    e.preventDefault();
    tlOffset = Math.max(0, Math.min(tlTracks.length - 1, tlOffset + (e.deltaY > 0 ? 0.5 : -0.5)));
    tlLayout();
    armTlTimeout();
    clearTimeout(tlPicker._wt);
    tlPicker._wt = setTimeout(tlSnap, 140);
  }, { passive: false });

  // Tap anywhere off the list column (gutters, scrim, header band) dismisses.
  tlEl.addEventListener("click", e => {
    if (tlDragMoved) return;
    if (e.target.closest("#tl-picker")) return;
    closeTracklist();
  });

  tlEl.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      e.preventDefault();
      closeTracklist();
      return;
    }
    if (e.key === "Tab" && tlRows.length) {
      e.preventDefault();
      const row = tlRows[Math.max(0, Math.min(tlRows.length - 1, Math.round(tlOffset)))];
      if (row) row.focus({ preventScroll: true });
      return;
    }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const delta = e.key === "ArrowDown" ? 1 : -1;
    tlOffset = Math.max(0, Math.min(tlTracks.length - 1, Math.round(tlOffset) + delta));
    tlAnimateTo(tlOffset);
    tlRows.forEach(row => { row.tabIndex = -1; });
    const row = tlRows[tlOffset];
    if (row) row.tabIndex = 0;
    if (row) row.focus({ preventScroll: true });
    armTlTimeout();
  });

  // ── Volume HUD (two-finger vertical drag) ──
  const VOL_ARC_R = 505;
  const VOL_A0 = -55, VOL_A1 = 55; // degrees on the right rim; -55 = top = 100%
  let volHudTimer = null;
  let volSendTimer = null;
  let volPendingPct = null;
  let volLastSetAt = -Infinity;

  function volPoint(deg) {
    const r = (deg * Math.PI) / 180;
    return [540 + VOL_ARC_R * Math.cos(r), 540 + VOL_ARC_R * Math.sin(r)];
  }
  function volArcPath(a0, a1) {
    const [x0, y0] = volPoint(a0), [x1, y1] = volPoint(a1);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${VOL_ARC_R} ${VOL_ARC_R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

  function renderVolume(pct) {
    const a = VOL_A1 - (pct / 100) * (VOL_A1 - VOL_A0);
    volFill.setAttribute("d", volArcPath(a, VOL_A1));
    const [kx, ky] = volPoint(a);
    volKnob.setAttribute("cx", kx.toFixed(1));
    volKnob.setAttribute("cy", ky.toFixed(1));
    volLabel.textContent = String(Math.round(pct));
  }

  function showVolumeHud() {
    renderVolume(state.volume);
    brightnessHud.classList.remove("visible");
    volumeHud.classList.add("visible");
    if (volHudTimer) clearTimeout(volHudTimer);
    volHudTimer = setTimeout(() => {
      volumeHud.classList.remove("visible");
    }, 2600);
  }

  function setVolume(pct) {
    pct = Math.max(0, Math.min(100, pct));
    state.volume = pct;
    volLastSetAt = performance.now();
    renderVolume(pct);
    // Throttle the POSTs; always deliver the final value.
    volPendingPct = Math.round(pct);
    if (!volSendTimer) {
      volSendTimer = setTimeout(async () => {
        volSendTimer = null;
        const send = volPendingPct;
        volPendingPct = null;
        try {
          await fetch("/api/control/volume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ percent: send }),
          });
        } catch (e) { /* receiver offline — HUD still reflects intent */ }
      }, 150);
    }
  }

  // ── Backlight HUD + hardware control (three-finger vertical drag) ──
  // UI values stay logical 0–100. The server maps them onto the current
  // hardware-safe range (80% maximum while the display is on the Pi's 3A
