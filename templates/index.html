<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080, user-scalable=no">
<title>Spotify Vinyl Display</title>
<link rel="preload" href="/static/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --size: 1080px;
    --center: 540px;
    --groove-start: 100;
    --groove-end: 530;
    --label-radius: 96px;
    --ring-radius: 90px;
    --spindle-radius: 14px;
    --pill-w: 610px;
    --pill-r: 18px;

    /* ── Motion tokens ── */
    --dur-fast: 0.22s;
    --dur-med: 0.45s;
    --dur-slow: 0.7s;
    --ease-glide: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-pop: cubic-bezier(0.16, 1, 0.3, 1);

    /* ── Surface + radius tokens ── */
    --surface-chip: rgba(15, 15, 17, 0.86);
    --hairline: rgba(255, 255, 255, 0.10);
    --r-pill: 999px;
    --r-panel: 24px;
    --r-card: 5px;

    /* ── Per-record UI accent — overridden from JS (setUiAccent) with the
       album accent lifted to a chrome-legible tint. Consumers land in
       Phase 1; defaults match the tracklist's warm fallback. ── */
    --ui-accent: rgb(240, 168, 104);
    --ui-accent-rgb: 240, 168, 104;
  }

  /* ── Shared chip surface (gesture readout, WLED chip/toast, volume label) ── */
  .chip {
    padding: 10px 20px;
    border-radius: var(--r-pill);
    background: var(--surface-chip);
    border: 1px solid var(--hairline);
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 0.04em;
  }

  html, body {
    width: var(--size); height: var(--size);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    cursor: none;
    user-select: none;
  }

  button {
    font: inherit;
  }

  .skip-btn,
  .crate-chip,
  .tl-row,
  #wled-chip,
  #wled-modal li > button {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    outline: 0;
    padding: 0;
    background: transparent;
    color: inherit;
  }

  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--ui-accent);
    outline-offset: 4px;
  }

  #viewport {
    position: relative;
    width: var(--size); height: var(--size);
    border-radius: 50%;
    overflow: hidden;
    touch-action: none;
  }

  #viewport::before,
  #viewport::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    z-index: 18;
    pointer-events: none;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.35s ease;
  }

  #viewport.playing::before,
  #viewport.playing::after {
    opacity: 0;
    visibility: hidden;
  }

  #viewport::before {
    top: 0;
    height: 44%;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(0,0,0,0.56) 0%, rgba(0,0,0,0.30) 38%, rgba(0,0,0,0) 76%),
      linear-gradient(to bottom, rgba(0,0,0,0.34), rgba(0,0,0,0));
  }

  #viewport::after {
    bottom: 0;
    height: 35%;
    background:
      radial-gradient(ellipse at 50% 92%, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.42) 44%, rgba(0,0,0,0) 82%),
      linear-gradient(to top, rgba(0,0,0,0.38), rgba(0,0,0,0));
  }

  /* ── Outer rim depth shadow (static, on top of everything) ── */
  #rim-shadow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 40;
    pointer-events: none;
    /* Multi-layered inset shadow for realistic depth */
    box-shadow:
      /* Outer bevel — dark ring at very edge */
      inset 0 0 0 3px rgba(0,0,0,0.5),
      /* Top highlight — subtle light catch */
      inset 0 4px 8px rgba(255,255,255,0.08),
      /* Bottom shadow — depth underneath */
      inset 0 -6px 16px rgba(0,0,0,0.6),
      /* Soft wide inner vignette */
      inset 0 0 60px rgba(0,0,0,0.4),
      /* Tighter vignette near edge */
      inset 0 0 120px rgba(0,0,0,0.15),
      /* Outer glow/shadow on the desk */
      0 4px 20px rgba(0,0,0,0.8),
      0 0 40px rgba(0,0,0,0.3);
  }

  /* ── Platter — the player layer that minimizes away (iOS-style) ── */
  #platter {
    position: absolute;
    inset: 0;
    z-index: 1;
    transform-origin: 50% 50%;
    will-change: transform;
    transition: transform 680ms var(--ease-glide), opacity 480ms ease;
  }
  /* Browse mode: platter shrinks to a square album cover parked at the top,
     the crate fills the screen beneath it. (The circle→square morph and
     spin-down are driven per-frame in JS; this just parks the layer.) */
  #viewport.browsing #platter {
    transform: translateY(-392px) scale(0.224);
    z-index: 36; /* lift the parked cover above the crate's depth veil */
  }
  /* Live pinch feedback must track the fingers, not ease behind them */
  #platter.no-transition {
    transition: none;
  }
  #viewport.browsing #pill,
  #viewport.browsing #lyrics-wrap,
  #viewport.browsing .skip-btn {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #viewport.browsing #pause-btn {
    pointer-events: none;
  }
  #viewport.browsing #shelf {
    transition: opacity 0.55s ease 0.12s, visibility 0.55s, transform 680ms var(--ease-glide);
  }

  /* ── Vinyl record (rotates) ── */
  #vinyl {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 1;
    will-change: transform;
    transform-style: flat;
    transform-origin: 50% 50%;
    transition: none;
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    --flip-sheen: 0;
  }
  #vinyl.flipping {
    transform-style: preserve-3d;
    backface-visibility: visible;
  }
  #vinyl::after {
    content: '';
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    opacity: var(--flip-sheen);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.04) 46%, rgba(0,0,0,0.42) 100%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.38) 100%);
    mix-blend-mode: screen;
  }
  #vinyl.flipping::after {
    display: block;
  }

  /* Everything printed on the disc — mirrored as one unit at the flip's
     hidden 90° point. Deliberately NO transition: the counter-mirror must
     snap in the same frame as the rotation math, never ease. */
  #disc-face {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    border-radius: 50%;
  }

  /* Album art fills the vinyl */
  #artwork {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.36s ease, filter 0.5s ease, transform 0.5s ease;
  }
  #artwork.art-changing {
    opacity: 0.72;
    filter: saturate(0.86) brightness(0.78);
    transform: scale(1.035);
  }

  /* ── Static specular sheen ──
     A fixed light source over the moving grooves: two soft opposing
     highlight lobes (conic), masked to the donut between label and rim.
     It does NOT rotate and never repaints — the grooves turning beneath a
     stationary reflection is what reads as light on vinyl. Compositor cost:
     one static layer. */
  #sheen {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 7;
    pointer-events: none;
    background: conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,0) 0deg,
      rgba(255,255,255,0) 95deg,
      rgba(255,255,255,0.085) 130deg,
      rgba(255,255,255,0) 168deg,
      rgba(255,255,255,0) 275deg,
      rgba(255,255,255,0.075) 310deg,
      rgba(255,255,255,0) 348deg);
    -webkit-mask-image: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 112px, #000 152px, #000 452px, rgba(0,0,0,0) 528px);
    mask-image: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 112px, #000 152px, #000 452px, rgba(0,0,0,0) 528px);
    transition: opacity 0.25s ease;
  }
  /* The flip tilts the disc in 3D — a full-face static reflection would give
     the illusion away, so it sits out (the flip has its own sheen pulse). */
  #sheen.flip-hidden {
    opacity: 0 !important;
  }

  /* Groove overlay — drawn by canvas */
  #grooves {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  /* Procedural record label — lives inside #vinyl so it rotates and flips
     with the record. Content is rendered as SVG per track. */
  #label {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #label text {
    font-family: 'Montserrat', sans-serif;
  }

  /* 45 Mode — singles get the classic 7" big-hole look */
  #viewport.single {
    --spindle-radius: 30px;
  }

  /* Spindle */
  #spindle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc(var(--spindle-radius) * 2);
    height: calc(var(--spindle-radius) * 2);
    border-radius: 50%;
    background: #323232;
    border: 1px solid #1e1e1e;
    z-index: 10;
    transition: width 0.8s ease, height 0.8s ease;
  }
  #spindle::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-radius: 50%;
    border: 1px solid #464646;
  }

  /* ── Static layer (doesn't rotate) ── */
  #static-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }

  /* ── Canvas progress ring (on the center label) ── */
  #progress-ring-canvas {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc((var(--ring-radius) * 2) + 40px);
    height: calc((var(--ring-radius) * 2) + 40px);
    z-index: 25;
    pointer-events: none;
    transition: width 0.8s ease, height 0.8s ease, opacity 0.28s ease;
  }
  /* The ring doesn't flip with the disc — hide it during the flip so the
     static notches aren't a distraction. !important so it also wins over
     the inline opacity the minimize morph manages. */
  #progress-ring-canvas.flip-hidden {
    opacity: 0 !important;
  }
  /* On a 7" single the label is wider — swell the ring to its edge so it
     hugs the paper instead of cutting through the curved type. The canvas
     drawing scales with its CSS box, so everything stays proportional. */
  #viewport.single #progress-ring-canvas {
    width: calc(((var(--ring-radius) * 2) + 40px) * 1.24);
    height: calc(((var(--ring-radius) * 2) + 40px) * 1.24);
  }

  /* ── Player info ── */
  #pill {
    position: absolute;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%) translateY(12px);
    width: fit-content;
    min-width: 318px;
    max-width: min(560px, calc(100vw - 260px));
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 30;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: rgba(5, 7, 8, 0.78);
    border: 1px solid rgba(var(--ui-accent-rgb), 0.18);
    border-radius: 22px;
    box-shadow:
      0 18px 42px rgba(0,0,0,0.46),
      inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 15px 30px 17px;
    opacity: 0;
    transition: opacity var(--dur-med) ease, transform var(--dur-med) ease;
  }
  #pill.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* Sleeve notes: the pill is tappable (cycles title/artist → album/label →
     pressing facts). Keyboard focus gets the same accent hairline language
     as the rest of the chrome. */
  #pill:focus-visible {
    outline: 2px solid rgba(var(--ui-accent-rgb), 0.6);
    outline-offset: 3px;
  }

  /* Subtle text shadow keeps the type legible over any artwork */
  #pill-track, #pill-artist, #time-row {
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  #pill-track {
    font-size: 31px;
    font-weight: 600;
    line-height: 1.18;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(500px, calc(100vw - 330px));
    text-align: center;
    padding-bottom: 2px;
    transition: opacity 0.28s ease, transform 0.36s ease;
  }
  /* Overflowing titles: right edge-fade instead of an ellipsis, plus ONE
     gentle marquee pass on track change (transform-only), then settle. */
  #pill-track .pt-inner { display: inline-block; }
  #pill-track.overflowing {
    text-overflow: clip;
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 46px), transparent 100%);
    mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 46px), transparent 100%);
  }
  #pill-track.overflowing .pt-inner {
    animation: pill-marq 9s ease-in-out 1.6s 1;
  }
  @keyframes pill-marq {
    0% { transform: translateX(0); }
    42% { transform: translateX(var(--marq, 0px)); }
    58% { transform: translateX(var(--marq, 0px)); }
    100% { transform: translateX(0); }
  }

  #pill-artist {
    margin-top: 7px;
    font-size: 21px;
    font-weight: 300;
    color: rgba(255,255,255,0.86);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(470px, calc(100vw - 350px));
    text-align: center;
    transition: opacity 0.28s ease, transform 0.36s ease;
  }

  #pill.metadata-out #pill-track,
  #pill.metadata-out #pill-artist {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }

  #pill.metadata-in #pill-track,
  #pill.metadata-in #pill-artist {
    animation: metadata-in 520ms var(--ease-pop);
  }

  #time-row {
    width: 100%;
    min-width: 258px;
    margin-top: 13px;
    display: grid;
    grid-template-columns: 48px 1fr 58px;
    align-items: center;
    gap: 13px;
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.68);
    font-variant-numeric: tabular-nums;
  }

  #time-elapsed {
    text-align: right;
  }

  #time-remaining {
    text-align: left;
  }

  #time-bar {
    position: relative;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background:
      linear-gradient(to right, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.05),
      0 1px 7px rgba(0,0,0,0.28);
  }

  #time-fill {
    position: absolute;
    inset: 0;
    transform-origin: 0 50%;
    transform: scaleX(0);
    border-radius: inherit;
    background:
      linear-gradient(to right, rgba(var(--ui-accent-rgb), 0.75), rgba(255,255,255,0.96));
    box-shadow: 0 0 16px rgba(var(--ui-accent-rgb), 0.30);
    transition: transform 0.38s linear;
  }

  /* ── Playback controls ── */
  .skip-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;
    --swipe-strength: 0;
    width: 172px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    opacity: 0;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease, filter var(--dur-fast) ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* Swipe feedback is an arc of light hugging the rim (same language as the
     volume HUD) — the radial gradient's centre sits at the SCREEN centre, so
     the lit band at radius ~470-540px follows the bezel's curve. */
  .skip-btn::before {
    content: '';
    position: absolute;
    top: -60px; bottom: -60px;
    left: 0; right: 0;
    opacity: calc(var(--swipe-strength) * 0.78);
    transition: opacity var(--dur-fast) ease;
    pointer-events: none;
  }
  .skip-btn.visible { opacity: 0.22; }
  /* Press feedback: the arrow itself compresses (the button's own transform
     is busy with positioning and swipe drags, so the svg takes the press). */
  .skip-btn svg { transition: transform 160ms var(--ease-pop); }
  .skip-btn:active svg { transform: scale(0.8); transition-duration: 60ms; }
  /* Quiet chrome: after 8s without a touch the arrows retire; any touch
     brings them back instantly (swipes work regardless of visibility). */
  #viewport.controls-idle .skip-btn.visible { opacity: 0; }
  .skip-btn.visible.dragging {
    opacity: calc(0.28 + var(--swipe-strength) * 0.62);
    transform: translateY(-50%) scale(calc(1 + var(--swipe-strength) * 0.08));
    filter: drop-shadow(0 0 calc(18px + var(--swipe-strength) * 18px) rgba(255,255,255,0.18));
  }
  .skip-btn.confirm {
    animation: edge-confirm 360ms ease-out;
  }
  .skip-btn:active { opacity: 0.78; }
  #skip-prev { left: 0; }
  #skip-next { right: 0; }
  #skip-prev::before {
    /* screen centre is 540px right of this element's left edge */
    background: radial-gradient(circle at 540px 50%,
      rgba(0,0,0,0) 465px, rgba(255,255,255,0.30) 508px,
      rgba(255,255,255,0.10) 530px, rgba(0,0,0,0) 542px);
  }
  #skip-next::before {
    /* screen centre is 368px left of this element's left edge */
    background: radial-gradient(circle at -368px 50%,
      rgba(0,0,0,0) 465px, rgba(255,255,255,0.30) 508px,
      rgba(255,255,255,0.10) 530px, rgba(0,0,0,0) 542px);
  }
  .skip-btn svg {
    width: 58px;
    height: 58px;
    fill: rgba(255,255,255,0.78);
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.65));
  }
  #pause-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 190px; height: 190px;
    border-radius: 50%;
    z-index: 26;
    pointer-events: auto;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    color: transparent;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Lyrics overlay (top half, frosted glass) ── */
  #lyrics-wrap {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 720px;
    height: 355px;
    padding: 54px 52px 60px;
    z-index: 28;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    content-visibility: hidden;
    transition: opacity 0.6s;
    /* Borderless: a contrast wash that fades out on ALL sides (the mask
       handles top/bottom, the radial handles left/right) — no floating
       rectangle sitting inside the circle. closest-side matters: the
       default farthest-corner ellipse still carried ~0.11 alpha where the
       box clips it, leaving a hard vertical edge at the sides. */
    background: radial-gradient(ellipse closest-side at 50% 50%,
      rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.34) 55%, rgba(0,0,0,0) 98%);
    /* Mask fades top/bottom — also softens the blur edges naturally */
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%, transparent 9%, white 25%, white 66%, transparent 92%, transparent 100%);
    mask-image: linear-gradient(to bottom,
      transparent 0%, transparent 9%, white 25%, white 66%, transparent 92%, transparent 100%);
  }
  #lyrics-wrap.visible {
    opacity: 1;
    visibility: visible;
    content-visibility: visible;
  }

  #lyrics-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    /* A touch of overshoot as the column glides to the next line */
    transition: transform 0.55s cubic-bezier(0.3, 1.18, 0.35, 1);
  }

  /* One constant layout size for every line (26px in a 500px column) —
     emphasis is pure transform scale, so activating a line never reflows
     the column and the measured scroll offsets stay exact. Weight is
     constant too (variable-font 450): a weight change would re-wrap a
     line exactly like a size change would. */
  .lyric-line {
    font-size: 26px;
    font-weight: 450;
    line-height: 1.28;
    text-align: center;
    padding: 7px 20px;
    color: rgba(255,255,255,0.24);
    transform: scale(0.885);          /* reads ≈ the old 23px */
    transform-origin: 50% 50%;
    transition: color 0.35s, transform 0.35s ease;
    text-shadow: 0 2px 12px rgba(0,0,0,0.58);
    white-space: normal;
    overflow: hidden;
    text-overflow: clip;
    max-width: 500px;
    max-height: 2.65em;
  }
  .lyric-line.active {
    color: #fff;
    transform: scale(1.19);           /* reads ≈ the old 31px, fits the 616px panel */
    text-shadow:
      0 2px 16px rgba(0,0,0,0.72),
      0 0 28px rgba(var(--ui-accent-rgb), 0.30);
  }
  .lyric-line.past {
    color: rgba(255,255,255,0.38);
  }

  /* Karaoke fill — an accent-coloured twin of the active line, revealed
     left-to-right over the line's own duration via a clipped overlay.
     clip-path animation repaints one text line only; duration/negative
     delay are set inline per activation so seeks land mid-sweep. */
  .lyric-line { position: relative; }
  .lyric-line .ly-fill {
    position: absolute;
    inset: 0;
    padding: 7px 20px;              /* match .lyric-line padding exactly */
    color: rgb(var(--ui-accent-rgb));
    white-space: normal;
    overflow: hidden;
    clip-path: inset(0 100% 0 0);   /* hidden until the line activates */
    pointer-events: none;
  }
  .lyric-line.ly-filling .ly-fill {
    animation-name: ly-fill;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    /* Promote only the one animating twin so Chromium can run the clip-path
       sweep on the compositor instead of repainting the line per frame. */
    will-change: clip-path;
  }
  #lyrics-wrap.lyrics-paused .lyric-line.ly-filling .ly-fill {
    animation-play-state: paused;
  }
  @keyframes ly-fill {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0% 0 0); }
  }

  @keyframes edge-confirm {
    0% { opacity: 0.98; filter: drop-shadow(0 0 32px rgba(255,255,255,0.25)); }
    100% { opacity: 0.22; filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
  }

  @keyframes metadata-in {
    0% {
      opacity: 0;
      transform: translateY(-10px) scale(0.985);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* ── Record Shelf (idle launcher) ── */
  #shelf {
    position: absolute;
    inset: 0;
    z-index: 32;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.12);
    transition: opacity var(--dur-slow) ease, visibility var(--dur-slow), transform var(--dur-slow) ease;
  }
  /* Depth veil — pushes whatever record is on the platter back in z so the
     crate reads as the front layer */
  #shelf::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle at 50% 56%,
      rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.44) 52%, rgba(0,0,0,0.28) 100%);
  }

  /* ── Crate aura — one static radial field tinted by the playing record's
     accent at low opacity over the dark shelf surface. No motion, no blend
     mode, one cached layer: the tint flips with --ui-accent-rgb and costs
     nothing per frame. The #viewport's circular clip trims its edges. ── */
  #crate-aura {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 46%,
      rgba(var(--ui-accent-rgb), 0.18) 0%,
      rgba(var(--ui-accent-rgb), 0.07) 45%,
      rgba(var(--ui-accent-rgb), 0) 72%);
  }
  #viewport.dimmed * { animation-play-state: paused !important; }
  #shelf.visible {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }
  /* Section chips — switch between crates. They sit on an arc that echoes
     the bezel's curvature: the anchor is 2000px below the row, so each chip
     tilts a few degrees and the outer ones sag the way the round bezel does.
     renderChips() assigns the rotate+translateY transforms. */
  #crate-chips {
    position: absolute;
    top: calc(322px + 2000px);   /* row centre + CHIP_ARC_R (must match JS) */
    left: 540px;
    width: 0; height: 0;
    z-index: 30; /* above the crate drag surface — chips must stay tappable */
  }
  .crate-chip {
    position: absolute;
    left: 0; top: 0;
    white-space: nowrap;
    pointer-events: none;
    padding: 10px 20px;
    border-radius: var(--r-pill);
    background: rgba(20, 20, 22, 0.66);
    border: 1px solid var(--hairline);
    color: rgba(255,255,255,0.55);
    font-size: 13.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
    transition: color var(--dur-fast) ease, background var(--dur-fast) ease, border-color var(--dur-fast) ease;
  }
  #shelf.visible .crate-chip { pointer-events: auto; }
  .crate-chip.active {
    color: rgba(255,255,255,0.95);
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.22);
  }

  /* The crate itself — a draggable belt of standing records */
  #crate {
    /* Drag surface is a band, not the whole screen — it must not swallow
       taps on the chips above or the parked cover in browse mode. */
    position: absolute;
    top: 360px;
    left: 0; right: 0;
    height: 560px;
    z-index: 5; /* above the crate aura */
    perspective: 1500px;
    perspective-origin: 50% 42%;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shelf.visible #crate { pointer-events: auto; }
  .crate-card {
    position: absolute;
    top: 0; left: 0;
    width: 312px;
    height: 312px;
    border-radius: var(--r-card);
    background-size: cover;
    background-position: center;
    background-color: #1b1b20;
    border-left: 6px solid var(--accent, #888);
    box-shadow:
      0 18px 36px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.10);
    /* NO blanket will-change: on the 1GB Pi, promoting all ~50 sleeves cost
       ~19MB of GPU layers for cards that are parked off-screen. layoutCrate
       promotes only the visible window per-card. */
    pointer-events: none; /* the belt handles all input */
    backface-visibility: hidden;
  }
  .crate-card.focused {
    box-shadow:
      0 26px 52px rgba(0,0,0,0.7),
      0 0 36px rgba(255,255,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.16);
  }

  /* Now-spinning marker: the record currently on the turntable peeks out of
     its sleeve as a slowly turning mini-disc (one compositor-only rotation,
     only ever attached to a single card). The accent outline ties the shelf
     back to the chrome's tint. */
  .crate-card.now-playing {
    outline: 2px solid var(--accent, #fff);
    outline-offset: 2px;
  }
  .crate-peek {
    position: absolute;
    top: -56px;                 /* disc centre lands 10px below the sleeve edge */
    left: 50%;
    width: 132px;
    height: 66px;
    margin-left: -66px;
    overflow: hidden;
    pointer-events: none;
  }
  .crate-peek-disc {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, var(--accent, #888) 0 15px, #101013 16px 20px, transparent 21px),
      repeating-radial-gradient(circle at 50% 50%, #141419 0 3px, #1e1e25 3px 6px);
    box-shadow: 0 5px 16px rgba(0,0,0,0.6);
    animation: crate-peek-spin 3.4s linear infinite;
  }
  .crate-card.peek-paused .crate-peek-disc { animation-play-state: paused; }
  /* No ticking behind a hidden shelf — same rule the lava blobs lived by. */
  #shelf:not(.visible) .crate-peek-disc { animation-play-state: paused; }
  @keyframes crate-peek-spin { to { transform: rotate(360deg); } }

  /* Caption for the focused record */
  #crate-caption {
    position: absolute;
    top: 884px;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    text-align: center;
    pointer-events: none;
    z-index: 5; /* above the crate aura */
  }
  #crate-caption .cap-title {
    font-size: 23px;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  #crate-caption .cap-sub {
    margin-top: 5px;
    font-size: 14.5px;
    font-weight: 300;
    color: rgba(255,255,255,0.48);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Receiver-aware crate notice. This stays deliberately generic: the
     display never exposes Spotify account handles or identifiers. */
  #crate-profile-prompt {
    position: absolute;
    top: 964px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    width: min(760px, 72vw);
    min-height: 44px;
    z-index: 31;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 7px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    color: rgba(255,255,255,0.70);
    font-size: 12.5px;
    line-height: 1.35;
    text-align: center;
    transition: opacity var(--dur-med) ease, transform var(--dur-med) ease,
      visibility var(--dur-med);
  }
  #crate-profile-prompt.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }
  #crate-profile-copy { max-width: 620px; }
  #crate-profile-link {
    display: block;
    max-width: 700px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: var(--r-pill);
    padding: 7px 14px;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.94);
    font: inherit;
    font-weight: 600;
    overflow-wrap: anywhere;
    user-select: all;
  }
  #crate-profile-link[hidden] { display: none; }

  /* ── Hardware-control HUDs — arc faders on opposing rims ── */
  #volume-hud,
  #brightness-hud {
    position: absolute;
    inset: 0;
    z-index: 45;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  #volume-hud.visible,
  #brightness-hud.visible {
    opacity: 1;
    visibility: visible;
  }
  #volume-hud svg,
  #brightness-hud svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
  }
  /* Arc fill takes the record's accent; the knob stays a white thumb with an
     accent halo so it keeps contrast over any artwork. */
  #vol-fill,
  #bright-fill {
    stroke: var(--ui-accent);
  }
  #vol-knob,
  #bright-knob {
    filter: drop-shadow(0 0 10px rgba(var(--ui-accent-rgb), 0.55));
  }
  #vol-label,
  #bright-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 7px 16px;
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  #vol-label { right: 152px; }
  #bright-label { left: 152px; }
  #vol-label::after,
  #bright-label::after {
    content: "%";
    font-size: 15px;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    margin-left: 2px;
  }

  /* ── Track list — pinch-out album browser over the spinning record ── */
  /* Recess the platter: shrink it a touch and dim it so the frozen record
     reads as sunk into the background (iOS-style depth). No filter — the
     static #tl-scrim below supplies the defocus, as a pure opacity layer. */
  #viewport.tracklisting #platter {
    transform: scale(0.86);
    opacity: 0.5;
  }
  #viewport.tracklisting #pill,
  #viewport.tracklisting #lyrics-wrap,
  #viewport.tracklisting .skip-btn {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #viewport.tracklisting #pause-btn { pointer-events: none; }

  #tracklist {
    position: absolute;
    inset: 0;
    z-index: 44;
    opacity: 0;
    visibility: hidden;
    touch-action: none; /* we handle scroll + pinch ourselves */
    transition: opacity 0.4s ease, visibility 0.4s;
  }
  #tracklist.visible { opacity: 1; visibility: visible; }
  /* Radial scrim darkens the record so the type stays readable; pure opacity,
     no filter on the moving record. */
  #tl-scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.62) 46%, rgba(0,0,0,0.78) 100%);
  }
  #tl-head {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 720px;
    text-align: center;
    pointer-events: none;
  }
  #tl-head .tl-album {
    font-size: 25px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  }
  #tl-head .tl-artist {
    margin-top: 5px;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.46);
  }
  /* Side gutters — the "tap aside to close" zones. */
  .tl-gutter {
    position: absolute;
    top: 0; bottom: 0;
    width: 270px;
    z-index: 2;
  }
  #tl-gutter-l { left: 0; }
  #tl-gutter-r { right: 0; }
  /* Selection slot — a soft dark band across the mid-line that darkens the
     record right where the focused track sits, so its (accent-coloured) text
     stays crisp over the centre label. Fades at the ends; no hard pill edges. */
  #tl-focus {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 700px;
    height: 94px;
    margin: -47px 0 0 -350px;
    z-index: 2;
    pointer-events: none;
    border-radius: 24px;
    background: linear-gradient(to right,
      rgba(0,0,0,0) 0%, rgba(0,0,0,0.52) 16%, rgba(0,0,0,0.58) 50%,
      rgba(0,0,0,0.52) 84%, rgba(0,0,0,0) 100%);
  }
  /* Center-focused picker: rows are absolutely positioned by JS, the centered
     one largest/brightest, neighbours shrinking toward the round edges. */
  #tl-picker {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 660px;
    height: 660px;
    margin: -330px 0 0 -330px;
    z-index: 3;
    touch-action: none;
  }
  #tl-status {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 620px;
    transform: translate(-50%, -50%);
    z-index: 4;
    color: rgba(255,255,255,0.62);
    font-size: 18px;
    letter-spacing: 0.03em;
    text-align: center;
    pointer-events: none;
  }
  #tl-status:empty { display: none; }
  .tl-row {
    position: absolute;
    left: 0; right: 0;
    height: 72px;
    margin-top: -36px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 30px;
    cursor: pointer;
    will-change: transform, opacity;
  }
  .tl-row .tl-num {
    width: 40px;
    text-align: right;
    font-size: 24px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.40);
  }
  .tl-row .tl-title {
    flex: 1;
    font-size: 30px;
    font-weight: 400;
    color: rgba(255,255,255,0.90);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .tl-row .tl-dur {
    font-size: 22px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.34);
  }
  .tl-row.tl-current .tl-title { font-weight: 500; }
  .tl-row.tl-current .tl-num i { font-size: 22px; }

  /* EQ bars on the currently-playing row — compositor-only scaleY bounce,
     tinted by the row's accent currentColor; frozen while paused. */
  .tl-eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
  }
  .tl-eq i {
    width: 4px;
    height: 100%;
    background: currentColor;
    border-radius: 1.5px;
    transform-origin: 50% 100%;
    animation: tl-eq-bounce 0.92s ease-in-out infinite;
  }
  .tl-eq i:nth-child(2) { animation-delay: -0.31s; }
  .tl-eq i:nth-child(3) { animation-delay: -0.58s; }
  #tl-picker.eq-paused .tl-eq i { animation-play-state: paused; }
  /* No ticking behind a closed tracklist — rows persist until the next open. */
  #tracklist:not(.visible) .tl-eq i { animation-play-state: paused; }
  @keyframes tl-eq-bounce {
    0%, 100% { transform: scaleY(0.22); }
    50%      { transform: scaleY(1); }
  }
  /* Gesture hint set on an arc hugging the lower rim (SVG textPath — same
     move as the label's dead-wax etching). Retires after 3 viewings. */
  #tl-hint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  #tl-hint text {
    font-family: 'Montserrat', sans-serif;
  }

  /* ── Gesture chip — transient twist-seek readout ── */
  #gesture-chip {
    position: absolute;
    top: 132px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 45;
    padding: 12px 24px;
    font-size: 22px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
  }
  #gesture-chip.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Standby clock (flagged: ?standby=clock) — large digital time while
     the screen is dimmed, framed by the progress ring's tick language. One
     canvas redraw per minute; the GPU stays essentially idle. ── */
  #standby-clock {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 900px;
    z-index: 101;              /* the only content above the wake shield */
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #standby-clock.on { opacity: 1; }

  /* ── Crate reflection (flagged: ?reflect=1, default off) — mirrored slice
     of the focused sleeve on the crate floor. Updated only when focus
     changes. ── */
  #crate-reflection {
    position: absolute;
    top: 782px;
    left: 50%;
    width: 374px;
    height: 92px;
    margin-left: -187px;
    display: none;
    pointer-events: none;
    z-index: 4;
    background-size: 374px 374px;
    background-position: 0 -282px;   /* the sleeve's bottom slice */
    transform: scaleY(-1);           /* mirrored */
    opacity: 0.16;
    /* element is flipped, so "to bottom" fades the on-screen bottom edge */
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 12%, #000 100%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 12%, #000 100%);
  }

  /* ── Screen dimmer (saves display after extended idle) ── */
  #dimmer {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    /* base transition = the WAKE fade: quick */
    transition: opacity 0.45s ease;
  }
  /* While dimmed the overlay swallows all input — the first press anywhere
     only wakes the screen, it can never activate what's underneath. */
  #dimmer.dim {
    opacity: 0.85;
    pointer-events: auto;
    /* dimming down stays slow and gentle */
    transition: opacity 3s ease-in-out;
  }
  #dimmer.wake-drain {
    opacity: 0;
    pointer-events: auto;
    transition: opacity 0.45s ease;
  }

  /* ── WLED setup affordance (idle only) ── */
  #wled-chip {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-slow) ease;
    -webkit-user-select: none;
    user-select: none;
  }
  #wled-chip.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #wled-chip .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b8ff70;
    margin-right: 10px;
    vertical-align: 1px;
    box-shadow: 0 0 8px rgba(184, 255, 112, 0.7);
  }

  #wled-modal {
    position: absolute;
    inset: 0;
    z-index: 70;
    background: rgba(8, 8, 9, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255, 255, 255, 0.92);
  }
  #wled-modal.open { display: flex; }
  #wled-modal .panel {
    width: 560px;
    max-width: 80%;
    background: #111114;
    border: 1px solid var(--hairline);
    border-radius: var(--r-panel);
    padding: 28px 28px 22px;
  }
  #wled-modal h2 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #wled-modal .sub {
    margin: 0 0 18px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
  }
  #wled-modal ul {
    list-style: none;
    padding: 0;
    margin: 0 0 16px;
    max-height: 320px;
    overflow-y: auto;
  }
  #wled-modal li {
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    margin-bottom: 8px;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s ease;
  }
  #wled-modal li > button {
    width: 100%;
    padding: 0;
    background: transparent;
    color: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    cursor: pointer;
  }
  #wled-modal li:hover, #wled-modal li:active {
    background: rgba(255, 255, 255, 0.08);
  }
  #wled-modal li .meta { display: flex; flex-direction: column; gap: 2px; }
  #wled-modal li .name { font-size: 15px; }
  #wled-modal li .ip { font-size: 12px; color: rgba(255, 255, 255, 0.45); }
  #wled-modal li .action {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.85);
  }
  #wled-modal li.added .action {
    color: #b8ff70;
    border-color: rgba(184, 255, 112, 0.4);
    background: rgba(184, 255, 112, 0.06);
  }
  #wled-modal .controls {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  #wled-modal .controls button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.78);
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  #wled-modal .controls button.danger {
    color: #ffb1b1;
  }
  #wled-modal .empty {
    padding: 24px;
    text-align: center;
    justify-content: center;
    background: transparent;
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
  }

  #wled-toast {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 80;
    padding: 12px 22px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-med) ease, transform var(--dur-med) ease;
  }
  #wled-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);

  #connection-status {

<body>

<div id="viewport">
  <!-- Platter — everything that shrinks away when the player minimizes -->
  <div id="platter">
    <!-- Vinyl record — this whole div rotates -->
    <div id="vinyl">
      <!-- disc-face wraps everything printed on the disc so the 90° counter-
           mirror moves art, grooves and label as ONE object, instantly
           (the wrapper has no CSS transitions). -->
      <div id="disc-face">
        <img id="artwork" src="" alt="" draggable="false" ondragstart="return false" onmousedown="return false">
        <canvas id="grooves" width="1080" height="1080"></canvas>
        <!-- Procedural record label — rendered per track, spins and flips with the record -->
        <svg id="label" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

    <!-- Static specular sheen — fixed light over the moving grooves -->
    <div id="sheen"></div>

    <!-- Spindle (static, doesn't rotate) -->
    <div id="spindle"></div>

    <!-- Circular progress ring (canvas-based for smooth rendering) -->
    <canvas id="progress-ring-canvas" width="296" height="296"></canvas>
  </div>

	  <!-- Static overlay layer -->
	  <div id="static-layer">
    <!-- Lyrics -->
    <div id="lyrics-wrap" class="lyrics-paused">
      <div id="lyrics-inner"></div>
    </div>
    <div id="lyrics-status" role="status" aria-live="polite"></div>

    <!-- Player pill -->
    <div id="pill" role="status" aria-live="polite" aria-atomic="true">
      <div id="pill-track"></div>
      <div id="pill-artist"></div>
      <div id="time-row">
        <span id="time-elapsed">0:00</span>
        <div id="time-bar"><div id="time-fill"></div></div>
        <span id="time-remaining">-0:00</span>
      </div>
    </div>

    <!-- Skip buttons — semi-transparent triangles at outer edges -->
    <button type="button" id="skip-prev" class="skip-btn" aria-label="Previous track" disabled>
      <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="3" height="16"/></svg>
    </button>
    <button type="button" id="skip-next" class="skip-btn" aria-label="Next track" disabled>
      <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><rect x="16" y="4" width="3" height="16"/></svg>
    </button>

	    <!-- Tap-to-pause zone over center label -->
	    <button type="button" id="pause-btn" aria-label="Play" disabled></button>
	  </div>

	  <!-- Outer rim depth shadow — creates 3D recessed look -->
	  <div id="rim-shadow"></div>

  <!-- Record Shelf — the crate: riffle through records, tap to put one on -->
  <div id="shelf">
    <!-- Crate aura — one static accent-tinted radial field (no animation) -->
    <div id="crate-aura" aria-hidden="true"></div>
    <div id="crate-chips" role="tablist" aria-label="Record shelf sections"></div>

      <span id="crate-profile-copy"></span>
      <span id="crate-profile-link" hidden></span>
    </div>
  </div>

  <!-- Volume HUD — arc fader hugging the right rim -->
  <div id="volume-hud" role="status" aria-live="polite" aria-label="Volume">
    <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>

        </filter>

      <!-- dark backing band so the arc reads over bright album art -->

      <path id="vol-track" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
      <path id="vol-fill" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="12" stroke-linecap="round"/>
      <circle id="vol-knob" r="14" fill="#fff"/>
    </svg>
    <div id="vol-label" class="chip">50</div>
  </div>

  <!-- Backlight HUD — three-finger fader mirrored on the left rim -->
  <div id="brightness-hud" role="status" aria-live="polite" aria-label="Display brightness">
    <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">

          <feGaussianBlur stdDeviation="11"/>

      <path id="bright-backing" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="60" stroke-linecap="round" filter="url(#bright-blur)"/>
      <path id="bright-track" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
      <path id="bright-fill" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="12" stroke-linecap="round"/>

  <!-- Track list — pinch out during playback to riffle the album's tracks
       over the (defocused, still-spinning) record. -->
  <div id="tracklist" role="dialog" aria-modal="true" aria-labelledby="tl-album-title" aria-describedby="tl-status" aria-hidden="true" tabindex="-1">
    <div id="tl-scrim"></div>

    </div>

    <div id="tl-status" role="status" aria-live="polite"></div>

      <defs><path id="tl-hint-arc" d="M 238 900 A 470 470 0 0 0 842 900"/></defs>
      <text font-size="15" letter-spacing="1.5" fill="rgba(255,255,255,0.30)">
        <textPath href="#tl-hint-arc" startOffset="50%" text-anchor="middle">scroll · tap a track · tap aside to close</textPath>
      </text>
    </svg>
  </div>

  <!-- Gesture chip — transient readout for twist-seek -->
  <div id="gesture-chip" class="chip" role="status" aria-live="polite"></div>

  <!-- Screen dimmer — fades to near-black after extended idle -->
  <div id="dimmer" aria-hidden="true"></div>

  <!-- Standby clock (flagged: ?standby=clock) — drawn only while dimmed -->
  <canvas id="standby-clock" width="900" height="900"></canvas>

  <!-- WLED setup affordance (only appears when idle and a new device is seen) -->
  <button type="button" id="wled-chip" class="chip" aria-hidden="true" tabindex="-1"><span class="dot" aria-hidden="true"></span><span class="label">WLED device found — tap to set up</span></button>

  <!-- WLED device picker modal -->
  <div id="wled-modal" role="dialog" aria-modal="true" aria-labelledby="wled-title" aria-describedby="wled-description" aria-hidden="true">
    <div class="panel" tabindex="-1">
      <h2 id="wled-title">WLED devices</h2>
      <p class="sub" id="wled-description">Tap to add or remove a device. All selected strips run the same album-art palette in sync.</p>
      <ul id="wled-list"></ul>
      <div class="controls">
        <button type="button" id="wled-disable" class="danger">Disable WLED</button>
        <button type="button" id="wled-close">Done</button>

    </div>
  </div>

  <div id="connection-status" class="chip" role="status" aria-live="polite"></div>
  <div id="wled-toast" class="chip" role="status" aria-live="polite"></div>
  <aside id="diagnostics" hidden aria-label="Display diagnostics"></aside>
</div>

<script>
(function() {
  "use strict";

  // ── Constants ──
  const SIZE = 1080;
  const CENTER = SIZE / 2;
  const GROOVE_COUNT = 120;
  const GROOVE_START = 100;
  const GROOVE_END = 530;
  // 45 Mode: albums spin at 33⅓, singles at 45 — like the real shelf.
  const RPM_BASE = 33.333;
  const RPM_SINGLE = 45;
  const NEUTRAL_ART_URL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080"><defs><radialGradient id="g"><stop offset="0" stop-color="#252831"/><stop offset=".58" stop-color="#111318"/><stop offset="1" stop-color="#050506"/></radialGradient></defs><rect width="1080" height="1080" fill="url(#g)"/></svg>`
  );
  const RPM_EASE_MS = 450;   // exponential approach time constant
  let rpmCurrent = RPM_BASE;
  let rpmTarget = RPM_BASE;

  // Eased spin-up / spin-down duration (ms)
  const SPIN_RAMP = 4000;

  // Pressing physicality: sub-pixel eccentricity orbit (real records are
  // never perfectly centred) and the seat-onto-the-platter settle scale
  // applied across the spin-up ramp. Set WOBBLE_PX to 0 to disable.
  const WOBBLE_PX = 0.7;
  const SETTLE_SCALE = 0.004;

  // ── Elements ──
  const $ = id => document.getElementById(id);
  const viewport   = $("viewport");
  const vinyl      = $("vinyl");
  const artworkEl  = $("artwork");
  const pill       = $("pill");
  const pillTrack  = $("pill-track");
  const pillArtist = $("pill-artist");
  const timeElapsed = $("time-elapsed");
  const timeRemaining = $("time-remaining");
  const timeFill = $("time-fill");
  const progressCanvas = $("progress-ring-canvas");
  const progressCtx = progressCanvas.getContext("2d");
  const lyricsWrap = $("lyrics-wrap");
  const lyricsInner = $("lyrics-inner");
  const lyricsStatus = $("lyrics-status");
  const skipPrev   = $("skip-prev");
  const skipNext   = $("skip-next");
  const pauseBtn   = $("pause-btn");
  const dimmer     = $("dimmer");
  const groovesEl  = $("grooves");
  const spindleEl  = $("spindle");
  const discFace   = $("disc-face");
  const sheenEl    = $("sheen");
  const platter    = $("platter");
  const volumeHud  = $("volume-hud");
  const volTrack   = $("vol-track");
  const volFill    = $("vol-fill");
  const volKnob    = $("vol-knob");
  const volLabel   = $("vol-label");
  const brightnessHud = $("brightness-hud");
  const brightTrack = $("bright-track");
  const brightFill = $("bright-fill");
  const brightKnob = $("bright-knob");
  const brightLabel = $("bright-label");
  const gestureChip = $("gesture-chip");
  const standbyClock = $("standby-clock");
  const connectionStatus = $("connection-status");
  const diagnosticsEl = $("diagnostics");

  // Progress ring constants (canvas is 296x296 = 2x the CSS size for retina)
  const RING_CX = 148;
  const RING_CY = 148;
  const RING_R = 122;          // main arc radius (leave room for ticks + glow)
  const RING_TRACK_W = 2.2;    // background track width
  const RING_ARC_W = 6.5;      // progress arc width
  const RING_DOT_R = 9;        // dot outer radius
  const RING_DOT_INNER = 4.5;  // dot inner radius (creates ring shape)
  const TICK_COUNT = 60;        // minute-mark ticks around the ring
  const TICK_MAJOR_EVERY = 5;   // every 5th tick is longer

  // ── State ──
  let state = {
    isPlaying: false,
    progressMs: 0,
    durationMs: 1,
    trackId: null,
    trackUri: "",
    playbackKey: null,
    trackName: "",
    artistName: "",
    albumName: "",
    albumId: "",
    artUrl: "",
    volume: 50,
    brightness: 100,
    activeBrightness: 100,
    isSingle: false,
    releaseDate: "",
    recordLabel: "",
    browsing: false,
    tracklisting: false,
    stale: false,
    lastUpdate: performance.now(),
  };

  let screenDimmed = false;
  // Idle time before the screen dims. Overridable for testing/tuning via
  // URL param, e.g. /?dim=30 dims after 30 seconds.
  const DIM_DELAY = (parseInt(new URLSearchParams(location.search).get("dim"), 10) || 5 * 60) * 1000;

  // Quiet chrome: skip arrows retire after this long without a touch.
  const CONTROLS_IDLE_MS = 8000;
  let lastInteractionAt = performance.now();

  // ── Flourishes (Phase 6) — default ON since 2026-07-02; URL params
  // disable individually if the live trial argues against one:
  //   ?standby=off  no analog clock while the screen is dimmed
  //   ?boot=1       groove sweep-in on load (default off)
  //   ?reflect=1    floor reflection under the crate's focused sleeve (default off)
  //   ?faces=0      no sleeve-notes auto-cycle in the pill (tap still cycles)
  //   ?karaoke=0    no per-line lyric fill sweep
  const FLAGS = new URLSearchParams(location.search);
  const FLAG_STANDBY_CLOCK = FLAGS.get("standby") !== "off";
  const FLAG_BOOT = FLAGS.get("boot") === "1";
  const FLAG_REFLECT = FLAGS.get("reflect") === "1";
  const FLAG_FACES = FLAGS.get("faces") !== "0";
  const FLAG_DIAGNOSTICS = FLAGS.get("diag") === "1";
  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FLAG_KARAOKE = FLAGS.get("karaoke") !== "0" && !REDUCED_MOTION;

  // Local diagnostics deliberately contain no account or track metadata.
  // Press D (or use ?diag=1) to toggle the overlay.
  const diagnostics = {
    transport: "starting",
    pollMs: 0,
    lastSuccessAt: 0,
    failures: 0,
    frameAvgMs: 0,
    frameDrops: 0,
    quality: "full",
  };
  let diagnosticsVisible = FLAG_DIAGNOSTICS;
  let backendDiagnostics = null;
  let backendDiagnosticsState = "local only";
  let diagnosticsTimer = null;
  diagnosticsEl.hidden = !diagnosticsVisible;

  // Lyrics state
  let lyricsLines = [];      // [{time: ms, text: ""}, ...]
  const lyricLinePool = [];  // recycled .lyric-line divs — never torn down per track
  let lyricsTrackId = null;
  let currentLyricIdx = -1;
  let lyricsLastP = 0;     // last lyric-clock position — seek detection
  let lyricsStatusTimer = null;
  let lyricsLoadingTimer = null;

  // Vinyl rotation state
  let currentAngle = 0;
  let spinSpeed = 0;        // 0 = stopped, 1 = full speed
  let spinTarget = 0;       // 0 or 1
  let spinStartTime = 0;
  let spinStartSpeed = 0;
  let lastFrameTime = performance.now();

  // Return-to-zero state
  let returningToZero = false;
  let returnStartAngle = 0;
  let returnStartTime = 0;
  const RETURN_DURATION = 1200; // ms to ease back to 0

  // Minimize (pinch-to-crate) morph: 0 = full spinning vinyl, 1 = square cover
  // parked at the top. Drives the circle→square shape and decoration fade,
  // and decelerates the record to upright as it shrinks.
  let minimizeProg = 0;
  let lastMinimizeProg = -1;
  let browseStartAngle = 0;
  let browseTargetAngle = 0;

  // Track transition state
  let metadataTimer = null;
  let flipStartTime = 0;
  let flipDirection = 1;
  const FLIP_DURATION = 920;
  // New art/label are revealed at the flip's hidden 90° point. They're staged
  // here while the front half plays, then swapped; if a fresh skip's art is
  // slow to load the flip holds edge-on (up to FLIP_HOLD_MAX) until it arrives.
  // If nothing arrives at all, the flip completes as a plain turn-over.
  let pendingArt = null;
  let pendingPalette = undefined;
  let artworkEpoch = 0;
  let artworkLoadFailedAt = -Infinity;
  let flipArtSwapped = false;
  let flipHoldDeadline = 0;
  let lastFlipStartedAt = -Infinity;
  const FLIP_HOLD_MAX = 1800;
  let lastProgressDraw = 0;
  let lastProgressEmpty = false;
  const PROGRESS_DRAW_INTERVAL = 125;
  // Twist-seek ghost target (fraction of the track), null when no twist is
  // live. Drawn by updateProgressRing, set by the twist branch of the
  // gesture engine, cleared on release/abort.
  let seekPreviewPct = null;

  // ── Draw grooves on canvas (redrawn when the label size changes) ──
  // reveal < 1 draws only the innermost fraction — used by the flagged boot
  // moment to sweep the grooves in from the label outward.
  function drawGrooves(startRadius, reveal) {
    const start = startRadius || GROOVE_START;
    const frac = reveal === undefined ? 1 : reveal;
    const canvas = $("grooves");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, SIZE, SIZE);
    const spacing = (GROOVE_END - start) / GROOVE_COUNT;
    const count = Math.max(1, Math.floor(GROOVE_COUNT * frac));

    for (let i = 0; i < count; i++) {
      const r = start + i * spacing;
      const alpha = (15 + (i % 3) * 5) / 255;
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (frac < 1) return; // rim lands with the final frame of the sweep

    // Outer rim
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, SIZE / 2 - 2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,0,0,0.157)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ── Standby clock (flagged: ?standby=clock) — large digital time ──
  let lastClockMin = -1;
  function drawStandbyClock() {
    const t = new Date();
    const mins = t.getHours() * 60 + t.getMinutes();
    if (mins === lastClockMin) return; // one redraw per minute
    lastClockMin = mins;
    const ctx = standbyClock.getContext("2d");
    const S = 900, C = S / 2, R = 430;
    const [ar, ag, ab] = uiAccentArr;
    ctx.clearRect(0, 0, S, S);

    // Minute tick ring — the frame stays in the record's design language,
    // with the current minute lit in the album accent.
    for (let i = 0; i < 60; i++) {
      const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const major = i % 5 === 0;
      const lit = i === t.getMinutes();
      const len = lit ? 22 : major ? 16 : 6;
      ctx.beginPath();
      ctx.moveTo(C + (R - len) * Math.cos(a), C + (R - len) * Math.sin(a));
      ctx.lineTo(C + R * Math.cos(a), C + R * Math.sin(a));
      ctx.strokeStyle = lit
        ? `rgba(${ar},${ag},${ab},0.6)`
        : major ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.04)";
      ctx.lineWidth = lit ? 3 : major ? 2 : 1;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    // HH:MM — bold hours, light minutes, accent colon, soft accent glow.
    // Mixed weights need manual centering across three measured runs.
    const hh = String(t.getHours()).padStart(2, "0");
    const mm = String(t.getMinutes()).padStart(2, "0");
    const hoursFont = "600 232px 'Montserrat', sans-serif";
    const colonFont = "300 232px 'Montserrat', sans-serif";
    const minsFont = "300 232px 'Montserrat', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = hoursFont; const wH = ctx.measureText(hh).width;
    ctx.font = colonFont; const wC = ctx.measureText(":").width;
    ctx.font = minsFont; const wM = ctx.measureText(mm).width;
    let x = C - (wH + wC + wM) / 2;
    const yTime = C - 26;
    ctx.shadowColor = `rgba(${ar},${ag},${ab},0.45)`;
    ctx.shadowBlur = 56;
    ctx.font = hoursFont;
    ctx.fillStyle = "rgba(255,255,255,0.60)";
    ctx.fillText(hh, x, yTime); x += wH;
    ctx.font = colonFont;
    ctx.fillStyle = `rgba(${ar},${ag},${ab},0.55)`;
    ctx.fillText(":", x, yTime); x += wC;
    ctx.font = minsFont;
    ctx.fillStyle = "rgba(255,255,255,0.42)";
    ctx.fillText(mm, x, yTime);
    ctx.shadowBlur = 0;

    // Date line — quiet, spaced small caps below the time.
    ctx.textAlign = "center";
    ctx.letterSpacing = "7px";
    ctx.font = "500 34px 'Montserrat', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.26)";
    const date = t.toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long",
    }).toUpperCase();
    ctx.fillText(date, C, C + 138);
    ctx.letterSpacing = "0px";
  }

  // ── Helpers ──
  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function stableTrackKey(track) {
    if (!track) return null;
    if (track.id) return "id:" + track.id;
    if (track.uri) return "uri:" + track.uri;
    const artists = (track.artists || []).map(a => a && a.name || "").join("|");
    const album = track.album || {};
    // Some local files and receiver transitions have no Spotify id. This key
    // remains stable across polls without merging unrelated null-id tracks.
    return "meta:" + [track.name || "", artists, album.name || "", track.duration_ms || 0].join("\u001f");
  }

  function spotifyTrackId(track) {
    if (track && track.id) return track.id;
    const m = track && typeof track.uri === "string" && track.uri.match(/^spotify:track:([A-Za-z0-9]+)$/);
    return m ? m[1] : null;
  }

  function setConnectionMessage(message, kind) {
    connectionStatus.textContent = message || "";
    connectionStatus.classList.toggle("visible", !!message);
    connectionStatus.dataset.kind = kind || "";
  }

  function renderDiagnostics() {
    if (!diagnosticsVisible) return;
    const age = diagnostics.lastSuccessAt
      ? ((performance.now() - diagnostics.lastSuccessAt) / 1000).toFixed(1) + "s"
      : "never";
    const lines = [
      `transport  ${diagnostics.transport}`,
      `last poll   ${diagnostics.pollMs.toFixed(0)} ms`,
      `last good   ${age}`,
      `failures    ${diagnostics.failures}`,
      `frame avg   ${diagnostics.frameAvgMs.toFixed(1)} ms`,
      `long frames ${diagnostics.frameDrops}`,
      `quality     ${diagnostics.quality}`,
      `motion      ${REDUCED_MOTION ? "reduced" : "full"}`,
      `server      ${backendDiagnosticsState}`,
    ];
    if (backendDiagnostics) {
      const system = backendDiagnostics.system || {};
      const receiver = backendDiagnostics.receiver || {};
      const events = backendDiagnostics.events || {};
      const wled = backendDiagnostics.wled || {};
      const lyrics = backendDiagnostics.lyrics || {};
      const crate = backendDiagnostics.crate || {};
      const load = Array.isArray(system.load_average) ? system.load_average.join(" / ") : "n/a";
      const diskGiB = typeof system.disk_free_bytes === "number"
        ? (system.disk_free_bytes / 1073741824).toFixed(1) + " GiB"
        : "n/a";
      lines.push(
        `uptime      ${Math.round((backendDiagnostics.uptime_seconds || 0) / 60)} min`,
        `receiver    ${receiver.available ? "ready" : "unavailable"}${receiver.active ? " / active" : ""}`,
        `sse clients ${events.clients ?? "n/a"}`,
        `crate       ${crate.building ? "building" : "ready"}${crate.age_seconds == null ? "" : ` / ${Math.round(crate.age_seconds)}s old`}`,
        `wled        ${wled.configured_devices ?? 0} configured / ${wled.discovered_devices ?? 0} seen`,
        `lyrics      ${lyrics.circuit_open ? `backoff ${lyrics.retry_after}s` : "ready"}`,
        `temperature ${system.cpu_temperature_c == null ? "n/a" : system.cpu_temperature_c + " °C"}`,
        `load        ${load}`,
        `disk free   ${diskGiB}`,
      );
    }
    diagnosticsEl.textContent = lines.join("\n");
  }

  async function fetchBackendDiagnostics() {
    if (!diagnosticsVisible || document.hidden) return;
    try {
      const response = await fetch("/api/diagnostics", {
        cache: "no-store",
        credentials: "same-origin",
      });
      if (!response.ok) {
        backendDiagnostics = null;
        backendDiagnosticsState = response.status === 401 || response.status === 403
          ? "owner authorisation required"
          : `unavailable (${response.status})`;
      } else {
        backendDiagnostics = await response.json();
        backendDiagnosticsState = "connected";
      }
    } catch (e) {
      backendDiagnostics = null;
      backendDiagnosticsState = "offline / local only";
    }
    renderDiagnostics();
  }

  function setDiagnosticsVisible(visible) {
    diagnosticsVisible = !!visible;
    diagnosticsEl.hidden = !diagnosticsVisible;
    if (diagnosticsTimer) clearInterval(diagnosticsTimer);
    diagnosticsTimer = null;
    if (diagnosticsVisible) {
      renderDiagnostics();
      fetchBackendDiagnostics();
      diagnosticsTimer = setInterval(fetchBackendDiagnostics, 10000);
    }
  }

  async function fetchNowPlaying(signal) {
    const started = performance.now();
    try {
      const resp = await fetch("/api/now-playing", {
        method: "GET",
        cache: "no-store",
        credentials: "same-origin",
        signal,
      });
      diagnostics.pollMs = performance.now() - started;
      const profile = profileSignalFromResponse(resp);
      const trustedProfile = crateProfileSignal(profile) ? profile : null;
      if (resp.status === 204) {
        return trustedProfile
          ? { kind: "idle", status: 204, profile: trustedProfile }
          : { kind: "error", status: 502, error: new Error("missing receiver profile context") };
      }
      if (!resp.ok) return { kind: "error", status: resp.status, profile: trustedProfile };
      const data = await resp.json();
      if (!crateProfileSignal(data)) {
        return { kind: "error", status: 502, error: new Error("missing receiver profile context") };
      }
      return data && data.item
        ? { kind: "data", data, status: resp.status }
        : { kind: "idle", data, profile: trustedProfile, status: resp.status };
    } catch (error) {
      if (error && error.name === "AbortError") return { kind: "aborted" };
      diagnostics.pollMs = performance.now() - started;
      return { kind: "error", status: 0, error };
    }
  }

  function noteActivity() {
    lastInteractionAt = performance.now();
    if (state.browsing) armBrowseTimeout();
    if (state.tracklisting) armTlTimeout();
    scheduleAnimation(true);
  }

  function setPlayerMode(hasTrack) {
    viewport.classList.toggle("playing", hasTrack);
  }

  // ── Procedural record label ("The Pressing") ──
  // Every album gets a generated label: palette-tinted paper, curved type,
  // an RPM marque, the release year, a side marker that alternates A/B with
  // each record flip, and a faint dead-wax etching in the run-out band.
  const labelSvg = $("label");
  let labelPalette = null;   // {base, edge, ink, accent} from album art, or null
  let sideB = false;
  let lastLabelKey = "";

  // ── Per-record UI accent ──
  // Publishes the album accent as --ui-accent / --ui-accent-rgb on the
  // viewport, lifted through a legibility guard (value ≥ 0.72, saturation
  // ≤ 0.8) so muddy artwork never yields muddy chrome. Applied with the
  // label palette, so chrome tint flips with the artwork.
  let uiAccentKey = "";
  let uiAccentArr = [240, 168, 104];              // canvas ring reads these
  let uiAccentCss = "rgb(240,168,104)";           // guarded accent as CSS string
  function parseRgbStr(c) {
    if (c.charAt(0) === "#") {
      const n = parseInt(c.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    const m = c.match(/(\d+)\D+(\d+)\D+(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [240, 168, 104];
  }
  function setUiAccent(pal) {
    const src = (pal && pal.accent) || LABEL_FALLBACK.accent;
    if (src === uiAccentKey) return;      // no style churn when unchanged
    uiAccentKey = src;
    const [r, g, b] = parseRgbStr(src);
    const [h, s, v] = rgbToHsv(r, g, b);
    const [ur, ug, ub] = parseRgbStr(hsvToCss(h, Math.min(0.8, s), Math.max(0.72, v)));
    uiAccentArr = [ur, ug, ub];
    uiAccentCss = `rgb(${ur},${ug},${ub})`;
    viewport.style.setProperty("--ui-accent", uiAccentCss);
    viewport.style.setProperty("--ui-accent-rgb", `${ur},${ug},${ub}`);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function cssUrl(value) {
    // JSON string escaping is also valid for a quoted CSS url() token. Unlike
    // HTML escaping it preserves query separators such as `&` verbatim.
    return "url(" + JSON.stringify(String(value)) + ")";
  }

  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
    }
    return [h, max ? d / max : 0, max];
  }

  function hsvToCss(h, s, v) {
    const f = n => {
      const k = (n + h / 60) % 6;
      return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))));
    };
    return `rgb(${f(5)},${f(3)},${f(1)})`;
  }

  // Sample colors from a CORS-enabled copy of the artwork. The displayed
  // <img> is left untouched so artwork can never break if the CDN refuses
  // cross-origin reads — we just fall back to a cream paper label.
  function sampleLabelPalette(url) {
    return new Promise(resolve => {
      if (!url) return resolve(null);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = c.height = 24;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(img, 0, 0, 24, 24);
          const d = x.getImageData(0, 0, 24, 24).data;
          let best = null, bestScore = -1;
          let rSum = 0, gSum = 0, bSum = 0, n = 0;
          // Weight each colour by chroma × value so punchy accents beat muddy
          // fills when picking the record's accent.
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            rSum += r; gSum += g; bSum += b; n++;
            const [h, s, v] = rgbToHsv(r, g, b);
            const score = s * v * (0.35 + 0.65 * Math.min(1, v * 1.4));
            if (score > bestScore) { bestScore = score; best = [h, s, v]; }
          }
          const [ah, as, av] = rgbToHsv(rSum / n, gSum / n, bSum / n);
          // Prefer the punchiest accent; fall back to the average hue.
          const hue = (best && best[1] > 0.18) ? best[0] : ah;
          const sat = (best && best[1] > 0.18) ? best[1] : as;
          const baseV = 0.58 + Math.min(0.2, av * 0.25);
          const baseS = Math.min(0.62, sat * 0.75 + 0.08);
          resolve({
            base: hsvToCss(hue, baseS, baseV),
            edge: hsvToCss(hue, Math.min(0.7, baseS * 1.15), baseV * 0.66),
            ink: baseV * (1 - baseS * 0.45) > 0.42 ? "#181208" : "#f3ecdc",
            accent: hsvToCss(hue, Math.min(1, sat * 1.2), Math.min(0.9, Math.max(0.4, (best ? best[2] : av)))),
          });
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  const LABEL_FALLBACK = { base: "#d9cfba", edge: "#a89a7e", ink: "#241c10", accent: "#8a2d22" };

  function arcFontSize(text, radius, maxPx) {
    const arcLen = Math.PI * radius * 0.96;
    return Math.max(8.5, Math.min(maxPx, arcLen / (Math.max(text.length, 6) * 0.62)));
  }

  function clip(text, max) {
    return text.length > max ? text.slice(0, max - 1).trimEnd() + "…" : text;
  }

  function renderLabel() {
    if (!state.trackId) return; // keep the last pressing on the platter when idle
    // During a flip's front half, hold the old label — the new one is drawn at
    // the hidden 90° swap (which calls renderLabel with flipArtSwapped set).
    if (flipStartTime && !flipArtSwapped) return;

    const single = state.isSingle;
    const pal = labelPalette || LABEL_FALLBACK;
    const album = clip(state.albumName || state.trackName || "", 34);
    const artist = clip(state.artistName || "", 36);
    const year = (state.releaseDate || "").slice(0, 4);
    const recLabel = clip((state.recordLabel || "").toUpperCase(), 24);
    const side = sideB ? "B" : "A";

    const key = [state.trackId, album, artist, year, recLabel, single, side, pal.base].join("|");
    if (key === lastLabelKey) return;
    lastLabelKey = key;

    const C = 540;
    const R = single ? 114 : 96;        // label paper radius
    const holeR = single ? 30 : 16;     // center hole
    const textR = single ? 74 : 62;     // title/artist arc radius
    const marqueY = single ? 48 : 40;   // marque offset below center
    const sideX = single ? 64 : 50;     // side letter / year offset
    const etchR = R + 9;                // dead-wax etching radius

    const titleSize = arcFontSize(album, textR, 13.5);
    const artistSize = arcFontSize(artist, textR, 11);
    const marque = (single ? "45 RPM" : "33⅓ RPM") + " · STEREO";
    const cat = "PID-" + (state.trackId || "").replace(/[^a-zA-Z0-9]/g, "").slice(-6).toUpperCase();
    const etch = [cat, "SIDE " + side, year, recLabel].filter(Boolean).join(" ✵ ");

    const adapter = single
      ? `<circle cx="${C}" cy="${C}" r="34" fill="none" stroke="url(#lbl-metal)" stroke-width="9"/>
         <circle cx="${C}" cy="${C}" r="38.5" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>`
      : "";

    labelSvg.innerHTML = `
      <defs>
        <radialGradient id="lbl-paper" cx="50%" cy="47%" r="55%">
          <stop offset="0%" stop-color="${pal.base}"/>
          <stop offset="78%" stop-color="${pal.base}"/>
          <stop offset="100%" stop-color="${pal.edge}"/>
        </radialGradient>
        <linearGradient id="lbl-metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#777"/>
          <stop offset="45%" stop-color="#3c3c3c"/>
          <stop offset="100%" stop-color="#666"/>
        </linearGradient>
        <path id="lbl-arc-top" d="M ${C - textR} ${C} A ${textR} ${textR} 0 0 1 ${C + textR} ${C}"/>
        <path id="lbl-arc-bottom" d="M ${C - textR} ${C} A ${textR} ${textR} 0 0 0 ${C + textR} ${C}"/>
        <path id="lbl-arc-etch" d="M ${C - etchR} ${C} A ${etchR} ${etchR} 0 0 0 ${C + etchR} ${C}"/>
      </defs>

      <!-- dead-wax etching (outside the paper, in the run-out) -->
      <text font-size="10" letter-spacing="5.5" fill="rgba(255,255,255,0.20)">
        <textPath href="#lbl-arc-etch" startOffset="50%" text-anchor="middle">${esc(etch)}</textPath>
      </text>

      <!-- label paper -->
      <circle cx="${C}" cy="${C}" r="${R}" fill="url(#lbl-paper)"/>
      <circle cx="${C}" cy="${C}" r="${R - 1}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      <circle cx="${C}" cy="${C}" r="${R - 5}" fill="none" stroke="${pal.edge}" stroke-width="1.6" opacity="0.65"/>
      <!-- press rings -->
      <circle cx="${C}" cy="${C}" r="${R * 0.48}" fill="none" stroke="${pal.ink}" stroke-width="0.6" opacity="0.10"/>
      <circle cx="${C}" cy="${C}" r="${R * 0.62}" fill="none" stroke="${pal.ink}" stroke-width="0.6" opacity="0.08"/>

      <!-- curved type -->
      <text font-size="${titleSize.toFixed(1)}" font-weight="500" letter-spacing="1.6" fill="${pal.ink}">
        <textPath href="#lbl-arc-top" startOffset="50%" text-anchor="middle">${esc(album.toUpperCase())}</textPath>
      </text>
      <text font-size="${artistSize.toFixed(1)}" font-weight="400" letter-spacing="1.8" fill="${pal.ink}" opacity="0.82">
        <textPath href="#lbl-arc-bottom" startOffset="50%" text-anchor="middle">${esc(artist.toUpperCase())}</textPath>
      </text>

      <!-- marque + record company -->
      ${recLabel ? `<text x="${C}" y="${C - marqueY + 6}" font-size="7.5" letter-spacing="1.8" fill="${pal.ink}" opacity="0.55" text-anchor="middle">${esc(recLabel)}</text>` : ""}
      <text x="${C}" y="${C + marqueY}" font-size="8.5" letter-spacing="2.2" fill="${pal.ink}" opacity="0.68" text-anchor="middle">${esc(marque)}</text>

      <!-- side marker + year -->
      <text x="${C - sideX}" y="${C + 6}" font-size="17" font-weight="600" fill="${pal.ink}" text-anchor="middle">${side}</text>
      ${year ? `<text x="${C + sideX}" y="${C + 5}" font-size="9.5" letter-spacing="1" fill="${pal.ink}" opacity="0.75" text-anchor="middle">${esc(year)}</text>` : ""}

      <!-- center hole (the static spindle sits over this) -->
      ${adapter}
      <circle cx="${C}" cy="${C}" r="${holeR}" fill="#000"/>
      <circle cx="${C}" cy="${C}" r="${holeR}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    `;
  }

  // ── Lyrics ──
  function parseLRC(lrc) {
    if (!lrc) return [];
    const lines = [];
    const offsetMatch = lrc.match(/^\[offset:([+-]?\d+)\]/mi);
    const offsetMs = offsetMatch ? parseInt(offsetMatch[1], 10) : 0;
    for (const line of lrc.split("\n")) {
      const stamps = [...line.matchAll(/\[(\d+):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
      if (stamps.length) {
        const text = line.replace(/\[(\d+):(\d{1,2})(?:[.:](\d{1,3}))?\]/g, "").trim();
        if (!text) continue;
        for (const m of stamps) {
          // LRC permits tenths, hundredths and milliseconds. Right-padding
          // preserves their meaning: .1=100ms, .12=120ms, .123=123ms.
          const fractionMs = parseInt((m[3] || "0").padEnd(3, "0").slice(0, 3), 10);
          const ms = Math.max(0,
            parseInt(m[1], 10) * 60000 + parseInt(m[2], 10) * 1000 + fractionMs + offsetMs);
          lines.push({ time: ms, text });
        }
      }
    }
    return lines.sort((a, b) => a.time - b.time);
  }

  async function fetchLyrics(trackName, artistName, albumName, durationSec) {
    try {
      const params = new URLSearchParams({
        track: trackName, artist: artistName,
        album: albumName, duration: String(durationSec)
      });
      const resp = await fetch("/api/lyrics?" + params);
      if (!resp.ok) return { lines: [], status: "Lyrics are temporarily unavailable." };
      const data = await resp.json();
      const lines = parseLRC(data.syncedLyrics);
      return { lines, status: lines.length ? "" : "No synced lyrics for this track." };
    } catch(e) { return { lines: [], status: "Lyrics are unavailable while offline." }; }
  }

  function showLyricsStatus(message, duration) {
    if (lyricsStatusTimer) clearTimeout(lyricsStatusTimer);
    lyricsStatus.textContent = message || "";
    lyricsStatus.classList.toggle("visible", !!message);
    if (message && duration) {
      lyricsStatusTimer = setTimeout(() => {
        lyricsStatus.textContent = "";
        lyricsStatus.classList.remove("visible");
      }, duration);
    }
  }

  function renderLyricLines() {
    // Recycle pooled line divs: grow the pool to fit, retext the rows in use
    // and hide the rest — no innerHTML teardown/rebuild per track. Each line
    // carries a base span and an accent twin (.ly-fill) for the karaoke sweep.
    while (lyricLinePool.length < lyricsLines.length) {
      const div = document.createElement("div");
      div.className = "lyric-line";
      const base = document.createElement("span");
      base.className = "ly-base";
      const fill = document.createElement("span");
      fill.className = "ly-fill";
      fill.setAttribute("aria-hidden", "true");
      div.append(base, fill);
      lyricLinePool.push(div);
      lyricsInner.appendChild(div);
    }
    for (let i = 0; i < lyricLinePool.length; i++) {
      const div = lyricLinePool[i];
      if (i < lyricsLines.length) {
        div.firstChild.textContent = lyricsLines[i].text;
        div.lastChild.textContent = lyricsLines[i].text;
        div.classList.remove("active", "past", "ly-filling");
        div.hidden = false;
      } else {
        div.hidden = true;
      }
    }
    lyricsWrap.classList.toggle("visible", lyricsLines.length > 0);
    currentLyricIdx = -1;
  }

  function updateLyrics(nowMs) {
    if (!lyricsLines.length) return;

    let p = state.progressMs;
    if (state.isPlaying && !state.stale) p += nowMs - state.lastUpdate;
    p = Math.min(p, state.durationMs);
