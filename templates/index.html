  // supply), so this page never needs to know USB-current details.
  const BRIGHT_ARC_R = 505;
  const BRIGHT_A0 = 125, BRIGHT_A1 = 235; // mirrored onto the left rim
  const IDLE_BRIGHTNESS_PERCENT = 10;
  const BRIGHTNESS_RETRY_DELAYS_MS = [250, 750, 1500];
  let brightHudTimer = null;
  let brightSendTimer = null;
  let brightTimerKind = null;
  let brightPendingIntent = null;
  let brightSendInFlight = false;
  let brightnessIntentRevision = 0;
  let brightnessModeSyncPending = false;

  function brightPoint(deg) {
    const r = (deg * Math.PI) / 180;
    return [540 + BRIGHT_ARC_R * Math.cos(r), 540 + BRIGHT_ARC_R * Math.sin(r)];
  }

  function brightArcPath(a0, a1) {
    const [x0, y0] = brightPoint(a0), [x1, y1] = brightPoint(a1);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${BRIGHT_ARC_R} ${BRIGHT_ARC_R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

  function renderBrightness(pct) {
    pct = Math.max(0, Math.min(100, Number(pct) || 0));
    const a = BRIGHT_A0 + (pct / 100) * (BRIGHT_A1 - BRIGHT_A0);
    brightFill.setAttribute("d", brightArcPath(BRIGHT_A0, a));
    const [kx, ky] = brightPoint(a);
    brightKnob.setAttribute("cx", kx.toFixed(1));
    brightKnob.setAttribute("cy", ky.toFixed(1));
    brightLabel.textContent = String(Math.round(pct));
  }

  function showBrightnessHud() {
    renderBrightness(state.brightness);
    volumeHud.classList.remove("visible");
    brightnessHud.classList.add("visible");
    if (brightHudTimer) clearTimeout(brightHudTimer);
    brightHudTimer = setTimeout(() => {
      brightnessHud.classList.remove("visible");
    }, 2600);
  }

  function logicalBrightnessFrom(data) {
    if (!data || typeof data !== "object") return null;
    const candidates = [
      data.desired_percent,
      data.percent,
      data.logical_percent,
      data.brightness,
    ];
    for (const value of candidates) {
      if (value === null || value === undefined || value === "") continue;
      const n = Number(value);
      if (Number.isFinite(n)) return Math.max(0, Math.min(100, n));
    }
    return null;
  }

  function armBrightnessSend(delay, kind) {
    brightTimerKind = kind;
    brightSendTimer = setTimeout(flushBrightnessSend, delay);
  }

  function scheduleBrightnessCommand(command, immediate) {
    brightPendingIntent = {
      command,
      revision: ++brightnessIntentRevision,
      retryCount: 0,
    };
    if (brightSendInFlight) return;
    if (brightSendTimer) {
      // A fresh user/mode intent supersedes a sleeping retry immediately. A
      // normal 150ms timer keeps coalescing live gesture updates as before.
      if (!immediate && brightTimerKind !== "retry") return;
      clearTimeout(brightSendTimer);
      brightSendTimer = null;
      brightTimerKind = null;
    }
    armBrightnessSend(immediate ? 0 : 150, "normal");
  }

  function scheduleBrightnessSend(pct, immediate) {
    scheduleBrightnessCommand({
      percent: Math.round(Math.max(0, Math.min(100, pct))),
    }, immediate);
  }

  function scheduleBrightnessMode(mode, immediate) {
    scheduleBrightnessCommand({ mode }, immediate);
  }

  async function flushBrightnessSend() {
    brightSendTimer = null;
    brightTimerKind = null;
    if (brightSendInFlight || brightPendingIntent === null) return;
    const intent = brightPendingIntent;
    brightPendingIntent = null;
    brightSendInFlight = true;
    let retryDelay = null;
    try {
      const response = await fetch("/api/backlight", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(intent.command),
      });
      if (!response.ok) {
        const error = new Error("backlight request failed: " + response.status);
        error.retryable = response.status === 408 || response.status === 425 ||
          response.status === 429 || response.status >= 500;
        throw error;
      }
      let data = null;
      try { data = await response.json(); } catch (e) { /* a 204 is also valid */ }
      const accepted = logicalBrightnessFrom(data);
      if (accepted !== null && brightPendingIntent === null &&
          intent.revision === brightnessIntentRevision) {
        const command = intent.command;
        const requestedPercent = Number(command.percent);
        const modeMatchesScreen = !command.mode ||
          command.mode === (screenDimmed ? "idle" : "active");
        const responseMatches = modeMatchesScreen && (command.mode ||
          (Number.isFinite(requestedPercent) && Math.abs(state.brightness - requestedPercent) < 0.51));
        if (responseMatches) {
          state.brightness = accepted;
          if (!screenDimmed && command.mode !== "idle") state.activeBrightness = accepted;
          renderBrightness(accepted);
        }
      }
    } catch (error) {
      console.warn("Backlight control unavailable:", error);
      const stillCurrent = intent.revision === brightnessIntentRevision &&
        brightPendingIntent === null;
      if (error.retryable !== false && stillCurrent &&
          intent.retryCount < BRIGHTNESS_RETRY_DELAYS_MS.length) {
        retryDelay = BRIGHTNESS_RETRY_DELAYS_MS[intent.retryCount];
        intent.retryCount++;
        brightPendingIntent = intent;
      }
    } finally {
      brightSendInFlight = false;
      if (brightPendingIntent !== null) {
        const retryingSameIntent = brightPendingIntent === intent && retryDelay !== null;
        armBrightnessSend(retryingSameIntent ? retryDelay : 0,
          retryingSameIntent ? "retry" : "normal");
      }
    }
  }

  function setBrightness(pct, { rememberActive = true, immediate = false } = {}) {
    pct = Math.max(0, Math.min(100, pct));
    state.brightness = pct;
    if (rememberActive && !screenDimmed) state.activeBrightness = pct;
    renderBrightness(pct);
    scheduleBrightnessSend(pct, immediate);
  }

  function syncScreenBrightness() {
    // If a screen-mode transition somehow lands during a gesture, defer it
    // until release instead of overwriting the value under the user's fingers.
    if (brightnessGesture) {
      brightnessModeSyncPending = true;
      return;
    }
    brightnessModeSyncPending = false;
    state.brightness = screenDimmed ? IDLE_BRIGHTNESS_PERCENT : state.activeBrightness;
    renderBrightness(state.brightness);
    scheduleBrightnessMode(screenDimmed ? "idle" : "active", true);
  }

  async function fetchBrightnessState() {
    if (brightSendInFlight || brightPendingIntent !== null || brightnessGesture) return;
    const intentAtStart = brightnessIntentRevision;
    try {
      const response = await fetch("/api/backlight", { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      if (intentAtStart !== brightnessIntentRevision || brightSendInFlight ||
          brightPendingIntent !== null || brightnessGesture) return;
      const logical = logicalBrightnessFrom(data);
      if (logical === null) return;
      state.brightness = logical;
      const reportedActive = Number(data.active_percent);
      if (data.active_percent != null && Number.isFinite(reportedActive)) {
        state.activeBrightness = Math.max(0, Math.min(100, reportedActive));
      } else if (!screenDimmed) {
        state.activeBrightness = logical;
      }
      renderBrightness(logical);
      // The backend can legitimately remain in idle mode across a kiosk
      // reload. This page starts awake, so restore the preserved active value
      // after hydrating it; the HUD stays hidden during reconciliation.
      if (!screenDimmed && data.mode === "idle") syncScreenBrightness();
    } catch (e) { /* backlight helper may still be starting */ }
  }

  // ── Twist-seek chip ──
  let chipTimer = null;
  function showGestureChip(text, autoHideMs) {
    gestureChip.textContent = text;
    gestureChip.classList.add("visible");
    if (chipTimer) clearTimeout(chipTimer);
    if (autoHideMs) {
      chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), autoHideMs);
    }
  }
  function hideGestureChip(afterMs) {
    if (chipTimer) clearTimeout(chipTimer);
    chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), afterMs || 0);
  }

  async function commitSeek(positionMs) {
    try {
      const r = await fetch("/api/control/seek", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ position_ms: Math.round(positionMs) }),
      });
      if (r.ok) {
        state.progressMs = positionMs;
        state.lastUpdate = performance.now();
        setTimeout(poll, 400);
      }
    } catch (e) { /* receiver offline */ }
  }

  // ── Playback transport: SSE signal + non-overlapping polling fallback ──
  const POLL_FALLBACK_MS = 2000;
  const POLL_SSE_SAFETY_MS = 15000;
  const PLAYBACK_ERROR_GRACE_MS = 8000;
  let pollTimer = null;
  let pollInFlight = null;
  let pollQueued = false;
  let pollGeneration = 0;
  let lastAppliedGeneration = 0;
  let lastPlaybackSuccessAt = 0;
  let eventSource = null;
  let sseConnected = false;
  let sseRetryTimer = null;
  // Reconnect backoff: 2s → 60s max with ±20% jitter, reset on a clean open.
  const SSE_RETRY_MIN_MS = 2000;
  const SSE_RETRY_MAX_MS = 60000;
  let sseRetryDelayMs = SSE_RETRY_MIN_MS;
  let pendingManualDirection = null;
  let pendingManualAt = -Infinity;
  let pendingManualProgress = 0;

  function schedulePoll(delay) {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(() => poll("timer"), Math.max(0, delay));
  }

  function applyIdlePlayback() {
      const hadTrack = !!state.trackId;
      if (state.tracklisting) closeTracklist();
      tlTracks = [];
      tlRows = [];
      tlPicker.replaceChildren();
      tlStatus.textContent = "";
      flipStartTime = 0;
      pendingArt = null;
      pendingPalette = undefined;
      flipArtSwapped = false;
      flipHoldDeadline = 0;
      vinyl.classList.remove("flipping");
      artworkEl.classList.remove("art-changing");
      progressCanvas.classList.remove("flip-hidden");
      sheenEl.classList.remove("flip-hidden");
      discFace.style.transform = "";
      state.trackId = null;
      state.trackUri = "";
      state.playbackKey = null;
      state.isPlaying = false;
      state.stale = false;
      state.progressMs = 0;
      state.durationMs = 1;
      state.trackName = "";
      state.artistName = "";
      state.albumName = "";
      state.albumId = "";
      state.releaseDate = "";
      state.recordLabel = "";
      stageNeutralArtwork(null);
      setPillMetadata("", "", false);
      timeElapsed.textContent = "0:00";
      timeRemaining.textContent = "-0:00";
      timeFill.style.transform = "scaleX(0)";
      pill.classList.remove("visible");
      skipPrev.classList.remove("visible");
      skipNext.classList.remove("visible");
      skipPrev.disabled = true;
      skipNext.disabled = true;
      pauseBtn.disabled = true;
      lyricsLines = [];
      lyricsTrackId = null;
      currentLyricIdx = -1;
      if (lyricsLoadingTimer) clearTimeout(lyricsLoadingTimer);
      lyricsLoadingTimer = null;
      showLyricsStatus("", 0);
      for (const div of lyricLinePool) div.hidden = true;
      lyricsWrap.classList.remove("visible");
      setSingleMode(false);
      setSpinTarget(0);
      pauseBtn.setAttribute("aria-label", "Play");
      if (state.browsing) exitBrowse(); // track ended — idle shelf takes over
      updateWledChipVisibility();
      if (hadTrack) {
        shelfFetchedAt = -Infinity;
        shelfRetryAt = -Infinity;
      }
      updateShelf();
      markCrateNowPlaying(); // albumId is cleared — retire the shelf's marker
      scheduleAnimation(true);
  }

  function shouldUse45Rpm(track, data) {
    const album = track.album || {};
    const explicit = Number(data.display_rpm || track.display_rpm || album.display_rpm || 0);
    if (explicit === 45 || explicit === 33 || explicit === 33.333) return explicit === 45;
    if ((album.album_type || "").toLowerCase() !== "single") return false;
    const trackCount = Number(album.total_tracks || track.album_track_count || 0);
    const duration = Number(track.duration_ms || 0);
    // Spotify labels EPs inconsistently. Conservative physical-media logic:
    // unknown/short singles may be 45; four-track or very long releases stay 33⅓.
    return (!trackCount || trackCount <= 3) && (!duration || duration <= 12 * 60 * 1000);
  }

  function applyPlaybackData(data) {
    const track = data.item;
    const newKey = stableTrackKey(track);
    const previousKey = state.playbackKey;
    const trackChanged = newKey !== previousKey;
    const incomingProgress = Number(data.progress_ms || 0);
    const now = performance.now();

    pill.classList.add("visible");
    if (!state.browsing) shelf.classList.remove("visible");

    // Volume from the receiver — unless the user is mid-adjustment here.
    const devVol = (data.device || {}).volume_percent;
    if (typeof devVol === "number" && performance.now() - volLastSetAt > 1500) {
      state.volume = devVol;
    }

    const images = (track.album || {}).images || [];
    const artUrl = images.length ? images[0].url : "";
    // Album id lands a poll or two after a track change (server enrichment);
    // keep it fresh every poll so the pinch-out tracklist can load.
    const priorAlbumId = state.albumId;
    state.albumId = (track.album || {}).id || state.albumId;
    if (!trackChanged && state.tracklisting && state.albumId !== priorAlbumId) refreshTracklist();

    // Track info — start the flip FIRST (before staging art) so the art swap
    // lands at the hidden 90° point instead of popping at a visible angle.
    if (trackChanged) {
      const hadTrack = !!previousKey;
      // A manual skip already flipped via the swipe handler — if the poll
      // notices the track change just after that flip finished, don't play a
      // second one. (Mid-flip changes are staged into the running flip.)
      if (hadTrack && !flipStartTime && now - lastFlipStartedAt > 2600) {
        startRecordFlip(pendingManualDirection || "next");
      }
      // Same-album track change: the artwork URL won't change, so nothing
      // would ever be staged — feed the current art to the running flip so
      // the 90° reveal (with its A/B side toggle) happens without holding.
      if (flipStartTime && !flipArtSwapped && artUrl && artUrl === state.artUrl) {
        pendingArt = artUrl;
        pendingPalette = labelPalette;
      }
      state.playbackKey = newKey;
      state.trackId = spotifyTrackId(track) || newKey;
      state.trackUri = track.uri || (spotifyTrackId(track) ? "spotify:track:" + spotifyTrackId(track) : "");
      state.trackName = track.name || "";
      state.artistName = (track.artists || []).map(a => a.name).join(", ");
      state.albumName = (track.album || {}).name || "";
      state.albumId = (track.album || {}).id || ""; // new record — don't keep the last album's id
      if (state.tracklisting) refreshTracklist(); // album changed under an open list
      setPillMetadata(state.trackName, state.artistName, hadTrack);

      // Fetch lyrics for new track
      if (newKey !== lyricsTrackId) {
        lyricsTrackId = newKey;
        lyricsLines = [];
        lyricsWrap.classList.remove("visible");
        currentLyricIdx = -1;
        if (lyricsLoadingTimer) clearTimeout(lyricsLoadingTimer);
        showLyricsStatus("", 0);
        lyricsLoadingTimer = setTimeout(() => {
          if (lyricsTrackId === newKey) showLyricsStatus("Finding synced lyrics…", 0);
        }, 600);
        const durSec = Math.round((track.duration_ms || 0) / 1000);
        fetchLyrics(state.trackName, state.artistName, state.albumName, durSec)
          .then(result => {
            if (lyricsTrackId === newKey) {
              if (lyricsLoadingTimer) clearTimeout(lyricsLoadingTimer);
              lyricsLoadingTimer = null;
              lyricsLines = result.lines;
              renderLyricLines();
              showLyricsStatus(result.status, result.status ? 3500 : 0);
            }
          });
      }
      pendingManualDirection = null;
    } else if (pendingManualDirection === "previous") {
      // Spotify's previous action often restarts the current track. Wait for
      // the receiver response, then flip the existing decoded bundle rather
      // than holding the disc edge-on waiting for an artwork URL change.
      const restarted = incomingProgress + 1000 < pendingManualProgress;
      if (restarted || now - pendingManualAt >= 1000) {
        startRecordFlip("previous");
        pendingArt = state.artUrl || artworkEl.currentSrc || artworkEl.src || "";
        pendingPalette = labelPalette;
        pendingManualDirection = null;
      }
    }

    // Art — staged so a running flip reveals it at the hidden 90° point;
    // outside a flip it applies immediately. Preloaded so the swap is instant.
    if (artUrl && (artUrl !== state.artUrl ||
        (artworkLoadFailedAt > 0 && now - artworkLoadFailedAt > 15000))) {
      state.artUrl = artUrl;
      loadArtworkBundle(artUrl, newKey);
    } else if (!artUrl && trackChanged) {
      stageNeutralArtwork(newKey);
    }

    // Playback
    state.isPlaying = data.is_playing || false;
    state.progressMs = data.progress_ms || 0;
    state.durationMs = track.duration_ms || 1;
    state.lastUpdate = now;
    state.stale = !!data.stale;

    // 45 Mode + label metadata — these arrive via background enrichment a
    // poll or two after the track starts, so check every poll rather than
    // only on track change.
    setSingleMode(shouldUse45Rpm(track, data));
    state.releaseDate = (track.album || {}).release_date || "";
    state.recordLabel = (track.album || {}).label || "";
    renderLabel();

    // Spin — but not while browsing, where the record is held minimized.
    if (!state.browsing) setSpinTarget(state.isPlaying ? 1 : 0);
    pauseBtn.setAttribute("aria-label", state.isPlaying ? "Pause" : "Play");
    if (state.isPlaying && screenDimmed) setScreenDimmed(false);

    // Living-state CSS hooks: freeze the karaoke sweep and the tracklist EQ
    // while paused/stale, and keep the shelf's now-spinning marker current.
    lyricsWrap.classList.toggle("lyrics-paused", !state.isPlaying || state.stale);
    tlPicker.classList.toggle("eq-paused", !state.isPlaying || state.stale);
    markCrateNowPlaying();

    // Show controls when track is loaded
    skipPrev.classList.toggle("visible", !!state.trackId);
    skipNext.classList.toggle("visible", !!state.trackId);
    skipPrev.disabled = !state.trackId;
    skipNext.disabled = !state.trackId;
    pauseBtn.disabled = !state.trackId;
    if (wledModal.classList.contains("open")) closeWledModal();
    updateWledChipVisibility();
    scheduleAnimation(true);
  }

  function handlePlaybackError(result) {
    if (result && crateProfileSignal(result.profile)) observeReceiverProfile(result.profile);
    else markCrateProfileUnknown();
    diagnostics.failures++;
    const sinceGood = lastPlaybackSuccessAt ? performance.now() - lastPlaybackSuccessAt : 0;
    const auth = result.status === 401 || result.status === 403;
    if (auth) {
      setConnectionMessage("Owner authorisation is required for this display.", "auth");
    } else if (sinceGood >= PLAYBACK_ERROR_GRACE_MS || diagnostics.failures >= 3) {
      setConnectionMessage("Connection interrupted — showing last known playback.", "offline");
      if (!state.stale && state.trackId) {
        state.progressMs = currentProgressMs();
        state.lastUpdate = performance.now();
        state.stale = true;
        if (!state.browsing) setSpinTarget(0);
      }
    }
    renderDiagnostics();
  }

  function poll(reason) {
    if (pollInFlight) {
      pollQueued = true;
      return pollInFlight;
    }
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    const generation = ++pollGeneration;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    pollInFlight = (async () => {
      const result = await fetchNowPlaying(controller.signal);
      clearTimeout(timeout);
      if (generation <= lastAppliedGeneration) return;
      lastAppliedGeneration = generation;
      if (result.kind === "aborted") {
        handlePlaybackError({ status: 0, error: new Error("Playback request timed out") });
        return;
      }
      if (result.kind === "error") {
        handlePlaybackError(result);
        return;
      }
      diagnostics.failures = 0;
      diagnostics.lastSuccessAt = performance.now();
      lastPlaybackSuccessAt = diagnostics.lastSuccessAt;
      if (result.kind === "data") observeReceiverProfile(result.data);
      else if (result.kind === "idle") observeReceiverProfile(result.data || result.profile);
      if (result.kind === "idle") applyIdlePlayback();
      else applyPlaybackData(result.data);
      if (result.kind === "data" && result.data.stale) {
        setConnectionMessage("Receiver data is stale — waiting for a fresh update.", "stale");
      } else {
        setConnectionMessage("", "");
      }
      renderDiagnostics();
    })().catch(error => {
      clearTimeout(timeout);
      handlePlaybackError({ status: 0, error });
    }).finally(() => {
      pollInFlight = null;
      if (pollQueued) {
        pollQueued = false;
        queueMicrotask(() => poll("queued"));
      } else {
        schedulePoll(sseConnected ? POLL_SSE_SAFETY_MS : POLL_FALLBACK_MS);
      }
    });
    return pollInFlight;
  }

  function connectPlaybackEvents() {
    if (!("EventSource" in window) || eventSource) return;
    diagnostics.transport = "sse-connecting";
    renderDiagnostics();
    const source = new EventSource("/api/events");
    eventSource = source;
    source.onopen = () => {
      if (source !== eventSource) return;
      sseConnected = true;
      sseRetryDelayMs = SSE_RETRY_MIN_MS;
      diagnostics.transport = "sse";
      renderDiagnostics();
      schedulePoll(POLL_SSE_SAFETY_MS);
    };
    const signalUpdate = event => {
      let trusted = false;
      if (event && event.data) {
        try {
          const data = JSON.parse(event.data);
          if (crateProfileSignal(data)) {
            observeReceiverProfile(data);
            trusted = true;
          }
        } catch (e) { /* malformed signal: fail closed below, then poll */ }
      }
      if (!trusted) markCrateProfileUnknown();
      poll("sse");
    };
    source.addEventListener("playback", signalUpdate);
    source.addEventListener("update", signalUpdate); // compatible with older prototypes
    source.onmessage = signalUpdate;
    source.onerror = () => {
      if (source !== eventSource) return;
      source.close();
      eventSource = null;
      sseConnected = false;
      diagnostics.transport = "polling";
      markCrateProfileUnknown();
      renderDiagnostics();
      schedulePoll(0);
      if (sseRetryTimer) clearTimeout(sseRetryTimer);
      const retryDelay = Math.round(sseRetryDelayMs * (0.8 + Math.random() * 0.4));
      sseRetryTimer = setTimeout(connectPlaybackEvents, retryDelay);
      sseRetryDelayMs = Math.min(sseRetryDelayMs * 2, SSE_RETRY_MAX_MS);
    };
  }

  async function readControlResponse(resp) {
    try {
      return await resp.json();
    } catch(e) {
      return {};
    }
  }

  // ── Playback controls ──
  async function controlAction(action) {
    try {
      const resp = await fetch("/api/control/" + action, { method: "POST" });
      const data = await readControlResponse(resp);
      if (!resp.ok) {
        console.warn("Control failed:", action, data.error || resp.status);
        showWledToast(resp.status === 401 || resp.status === 403
          ? "Owner authorisation is required"
          : "Playback control is unavailable");
        return false;
      }
      setTimeout(poll, 300);
      setTimeout(poll, 1100);
      return true;
    } catch(e) {
      console.warn("Control request failed:", action, e);
      return false;
    }
  }

  skipPrev.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    if (await controlAction("previous")) {
      pendingManualDirection = "previous";
      pendingManualAt = performance.now();
      pendingManualProgress = currentProgressMs();
      confirmSwipe("previous");
    }
  });
  skipNext.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    if (await controlAction("next")) {
      startRecordFlip("next");
      confirmSwipe("next");
    }
  });
  pauseBtn.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    await controlAction("play-pause");
  });

  // ── Swipe gestures (skip track) ──
  let swipeGesture = null;
  let lastSwipeAt = 0;
  let suppressTapUntil = 0;
  const SWIPE_MAX_TIME = 800;
  const SWIPE_COOLDOWN = 900;
  const SWIPE_VERTICAL_RATIO = 0.55;
  const SWIPE_MIN_VELOCITY = 0.25;

  // Pointer-generated clicks arrive after pointerup. Consume them during the
  // short suppression window so a completed multi-touch gesture cannot also
  // activate a sleeve, track row, shelf tab, or playback control beneath it.
  viewport.addEventListener("click", e => {
    if (performance.now() >= suppressTapUntil) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);

  function swipeThreshold() {
    return Math.max(96, viewport.clientWidth * 0.1);
  }

  function swipeActionForDelta(dx) {
    // Standard carousel convention on the corrected X axis: swipe left
    // (content pushed away) skips next, swipe right goes back.
    return dx > 0 ? "previous" : "next";
  }

  function clearSwipeFeedback() {
    for (const el of [skipPrev, skipNext]) {
      el.classList.remove("dragging");
      el.style.setProperty("--swipe-strength", "0");
    }
  }

  function showSwipeFeedback(dx) {
    if (!state.trackId) return;
    const target = swipeActionForDelta(dx) === "next" ? skipNext : skipPrev;
    const other = target === skipNext ? skipPrev : skipNext;
    const strength = Math.min(Math.abs(dx) / swipeThreshold(), 1);

    other.classList.remove("dragging");
    other.style.setProperty("--swipe-strength", "0");
    target.classList.add("dragging");
    target.style.setProperty("--swipe-strength", strength.toFixed(2));
  }

  function confirmSwipe(direction) {
    const target = direction === "previous" ? skipPrev : skipNext;
    target.classList.remove("dragging");
    target.classList.add("confirm");
    target.style.setProperty("--swipe-strength", "1");
    window.setTimeout(() => {
      target.classList.remove("confirm");
      target.style.setProperty("--swipe-strength", "0");
    }, 360);
  }

  // ── Multi-touch gesture engine ──
  // The panel reports 10 touch points. Two fingers retain the player gestures;
  // a third finger promotes the interaction to hardware backlight control:
  //   twist        → scrub (1 turn = 60s), the platter rotates under your fingers
  //   two-finger vertical drag → volume fader
  //   two-finger tap → play/pause
  //   pinch in     → minimize to the shelf (browse mode)
  //   pinch out    → open the current album's track list
  //   three-finger vertical drag → display backlight
  const activePointers = new Map(); // pointerId -> {x, y}
  let mtGesture = null;
  let brightnessGesture = null;
  let multiTouchDrain = false; // after one finger lifts, ignore the rest until all are up

  const TWIST_SECONDS_PER_TURN = 60;
  const MT_TAP_MAX_MS = 300;
  const MT_TAP_MAX_MOVE = 18;
  const PINCH_COMMIT_PX = 90;
  const BRIGHTNESS_START_PX = 32;
  const BRIGHTNESS_FULL_SCALE_PX = 620;

  function currentProgressMs() {
    let p = state.progressMs;
    if (state.isPlaying && !state.stale) p += performance.now() - state.lastUpdate;
    return Math.min(p, state.durationMs);
  }

  function mtGeometry(ids) {
    const a = activePointers.get(ids[0]);
    const b = activePointers.get(ids[1]);
    const dx = b.x - a.x, dy = b.y - a.y;
    return {
      dist: Math.hypot(dx, dy),
      angle: (Math.atan2(dy, dx) * 180) / Math.PI,
      cy: (a.y + b.y) / 2,
    };
  }

  function pointerCentroidY(ids) {
    return ids.reduce((sum, id) => sum + activePointers.get(id).y, 0) / ids.length;
  }

  function cancelSwipe() {
    if (!swipeGesture) return;
    const gesture = swipeGesture;
    swipeGesture = null;
    clearSwipeFeedback();
    if (gesture.captured && viewport.releasePointerCapture) {
      try { viewport.releasePointerCapture(gesture.pointerId); } catch (e) {}
    }
  }

  function startMtGesture() {
    const ids = [...activePointers.keys()].slice(0, 2);
    const g = mtGeometry(ids);
    cancelSwipe();
    mtGesture = {
      ids,
      mode: null,
      t0: performance.now(),
      d0: g.dist,
      cy0: g.cy,
      prevAngle: g.angle,
      accumDeg: 0,
      lastDDist: 0,
      maxMove: 0,
      moved: new Set(),
      seekBase: currentProgressMs(),
      seekPreview: null,
      volBase: state.volume,
      angleBase: currentAngle,
      startPts: ids.map(id => ({ ...activePointers.get(id) })),
    };
  }

  function processMtGesture(e) {
    const g = mtGeometry(mtGesture.ids);
    for (let i = 0; i < 2; i++) {
      const s = mtGesture.startPts[i];
      const c = activePointers.get(mtGesture.ids[i]);
      const move = Math.hypot(c.x - s.x, c.y - s.y);
      mtGesture.maxMove = Math.max(mtGesture.maxMove, move);
      if (move > 4) mtGesture.moved.add(mtGesture.ids[i]);
    }
    const dDist = g.dist - mtGesture.d0;
    mtGesture.lastDDist = dDist;
    let stepA = g.angle - mtGesture.prevAngle;
    if (stepA > 180) stepA -= 360;
    else if (stepA < -180) stepA += 360;
    mtGesture.prevAngle = g.angle;
    mtGesture.accumDeg += stepA;
    const dCy = g.cy - mtGesture.cy0;

    // Classify by the DOMINANT signal, and only once BOTH fingers have
    // moved. Touch hardware reports fingers alternately, so a parallel
    // two-finger drag creates transient angle spikes between updates —
    // first-past-threshold would misread it as a twist. Net values after
    // both fingers report are jitter-free.
    if (!mtGesture.mode && mtGesture.moved.size === 2) {
      const twistPx = (Math.abs(mtGesture.accumDeg) * Math.PI / 180) * (mtGesture.d0 / 2);
      const pinchPx = Math.abs(dDist);
      const dragPx = Math.abs(dCy);
      const top = Math.max(twistPx, pinchPx, dragPx);
      if (top > 44) {
        if (top === pinchPx) mtGesture.mode = "pinch";
        else if (top === twistPx && Math.abs(mtGesture.accumDeg) > 9) mtGesture.mode = "twist";
        else if (top === dragPx) mtGesture.mode = "vdrag";
      }
    }

    if (mtGesture.mode === "twist") {
      // The record follows your fingers — DJ-style.
      returningToZero = false;
      currentAngle = (currentAngle + stepA + 360) % 360;
      const preview = Math.max(0, Math.min(
        mtGesture.seekBase + (mtGesture.accumDeg / 360) * TWIST_SECONDS_PER_TURN * 1000,
        state.durationMs));
      mtGesture.seekPreview = preview;
      // Ghost the landing spot on the progress ring — forced redraws while
      // the twist is live, coalesced to ~30fps rather than raw pointermove
      // rate (two touch points can report at 120Hz+).
      seekPreviewPct = preview / Math.max(state.durationMs, 1);
      if (performance.now() - lastProgressDraw > 33) updateProgressRing(performance.now(), true);
      showGestureChip((mtGesture.accumDeg >= 0 ? "⟳ " : "⟲ ") + fmt(preview));
    } else if (mtGesture.mode === "vdrag") {
      setVolume(mtGesture.volBase + (-dCy / 620) * 100);
      showVolumeHud();
    } else if (mtGesture.mode === "pinch") {
      // Live z-depth feedback while pinching — tracks fingers instantly.
      platter.classList.add("no-transition");
      const s = Math.max(0.82, Math.min(1.06, 1 + dDist / 1400));
      platter.style.transform = `scale(${s.toFixed(3)})`;
    }
    e.preventDefault();
  }

  function finalizeMtGesture() {
    const g = mtGesture;
    const dur = performance.now() - g.t0;

    if (g.mode === null) {
      if (dur <= MT_TAP_MAX_MS && g.maxMove <= MT_TAP_MAX_MOVE) {
        controlAction("play-pause"); // two-finger tap
      }
    } else if (g.mode === "twist") {
      hideGestureChip(550);
      seekPreviewPct = null;
      updateProgressRing(performance.now(), true);
      if (g.seekPreview !== null && Math.abs(g.seekPreview - g.seekBase) > 1500) {
        commitSeek(g.seekPreview);
      }
    } else if (g.mode === "pinch") {
      // Re-enable the transition first so the release animates — either the
      // snap back to full size or the recede into browse mode.
      platter.classList.remove("no-transition");
      platter.style.transform = "";
      if (g.lastDDist <= -PINCH_COMMIT_PX) {
        enterBrowse();              // pinch in → out to the shelf
      } else if (g.lastDDist >= PINCH_COMMIT_PX) {
        openTracklist();            // pinch out → this album's tracklist
      }
    }
    // vdrag needs no finalize — the throttled sender delivers the last value.

    suppressTapUntil = performance.now() + 700;
    mtGesture = null;
  }

  function abortMtGesture() {
    if (!mtGesture) return false;
    if (mtGesture.mode === "twist") currentAngle = mtGesture.angleBase;
    if (mtGesture.mode === "vdrag") setVolume(mtGesture.volBase);
    seekPreviewPct = null;
    updateProgressRing(performance.now(), true);
    hideGestureChip(0);
    platter.classList.remove("no-transition");
    platter.style.transform = "";
    suppressTapUntil = performance.now() + 350;
    mtGesture = null;
    return true;
  }

  function startBrightnessGesture() {
    const ids = [...activePointers.keys()].slice(0, 3);
    if (ids.length !== 3) return;

    // Promotion is exclusive: landing the third finger ends the two-finger
    // recogniser without running any of its release actions.
    abortMtGesture();
    cancelSwipe();
    if (volHudTimer) clearTimeout(volHudTimer);
    volumeHud.classList.remove("visible");

    // The brightness gesture is available in browse and track-list modes too.
    // Retire their one/two-finger trackers so they cannot move or activate
    // content underneath the three fingers.
    if (crateDrag) {
      crateDrag = null;
      const max = crateMaxScroll();
      crateTarget = Math.min(max, Math.max(0,
        Math.round(crateScroll / CRATE_SPACING) * CRATE_SPACING));
    }
    if (state.tracklisting) {
      tlPts.clear();
      tlScroll = null;
      tlPinch = null;
      tlDragMoved = true;
      cancelAnimationFrame(tlSnapRaf);
    }

    brightnessGesture = {
      ids,
      cy0: pointerCentroidY(ids),
      base: state.brightness,
      started: false,
      moved: new Set(),
      startPts: ids.map(id => ({ ...activePointers.get(id) })),
    };
    suppressTapUntil = performance.now() + 700;
  }

  function processBrightnessGesture(e) {
    const gesture = brightnessGesture;
    for (let i = 0; i < gesture.ids.length; i++) {
      const start = gesture.startPts[i];
      const current = activePointers.get(gesture.ids[i]);
      if (Math.hypot(current.x - start.x, current.y - start.y) > 4) {
        gesture.moved.add(gesture.ids[i]);
      }
    }
    const dCy = pointerCentroidY(gesture.ids) - gesture.cy0;

    // Wait for all three contacts to report motion. The touch controller
    // updates them one at a time, and acting on the first report alone would
    // make a three-finger landing jump the fader.
    if (!gesture.started && gesture.moved.size === 3 && Math.abs(dCy) >= BRIGHTNESS_START_PX) {
      gesture.started = true;
    }
    if (gesture.started) {
      setBrightness(gesture.base + (-dCy / BRIGHTNESS_FULL_SCALE_PX) * 100);
      showBrightnessHud();
    }
    e.preventDefault();
  }

  function finishBrightnessGesture(aborted) {
    if (!brightnessGesture) return false;
    const gesture = brightnessGesture;
    const changed = gesture.started;
    brightnessGesture = null;
    if (changed && aborted) {
      // Cancellation is an abort, not a commit: restore the value from before
      // the gesture and immediately reconcile the hardware.
      setBrightness(gesture.base, { rememberActive: true, immediate: true });
    } else if (changed) {
      scheduleBrightnessSend(state.brightness, true);
    }
    if (aborted) brightnessHud.classList.remove("visible");
    suppressTapUntil = performance.now() + 700;
    if (state.tracklisting) {
      tlSnap();
      setTimeout(() => { if (!tlScroll) tlDragMoved = false; }, 750);
    }
    if (brightnessModeSyncPending) syncScreenBrightness();
    return true;
  }

  viewport.addEventListener("pointerdown", e => {
    noteActivity(); // wakes the retired skip arrows and extends open panels
    if (e.target.closest("#wled-modal")) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (multiTouchDrain || brightnessGesture) return;

    // Recognise this before the player-mode guards: hardware brightness must
    // remain adjustable from the shelf, track list, and idle screen.
    if (activePointers.size === 3) {
      startBrightnessGesture();
      e.preventDefault();
      return;
    }
    if (state.browsing) return; // browse mode: sleeve taps + mini-disc only
    if (state.tracklisting) return; // tracklist open: picker scroll + gutter taps only

    if (activePointers.size === 2 && state.trackId && !mtGesture) {
      startMtGesture();
    } else if (activePointers.size === 1 && state.trackId && !mtGesture && !swipeGesture) {
      swipeGesture = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        startTime: performance.now(),
        captured: false,
        swipeInProgress: false,
      };
      clearSwipeFeedback();
    }
  });

  viewport.addEventListener("pointermove", e => {
    const p = activePointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }

    if (brightnessGesture) {
      if (brightnessGesture.ids.includes(e.pointerId)
          && brightnessGesture.ids.every(id => activePointers.has(id))) {
        processBrightnessGesture(e);
      }
      return;
    }

    if (mtGesture) {
      if (mtGesture.ids.includes(e.pointerId)
          && mtGesture.ids.every(id => activePointers.has(id))) {
        processMtGesture(e);
      }
      return;
    }

    if (!swipeGesture || e.pointerId !== swipeGesture.pointerId) return;

    const dx = e.clientX - swipeGesture.startX;
    const dy = e.clientY - swipeGesture.startY;
    const horizontalEnough = Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy) * 1.25;

    swipeGesture.swipeInProgress = horizontalEnough;
    if (horizontalEnough) {
      if (!swipeGesture.captured && viewport.setPointerCapture) {
        viewport.setPointerCapture(e.pointerId);
        swipeGesture.captured = true;
      }
      showSwipeFeedback(dx);
      e.preventDefault();
    } else {
      clearSwipeFeedback();
    }
  }, { passive: false });

  function releasePointer(e) {
    activePointers.delete(e.pointerId);

    if (brightnessGesture && brightnessGesture.ids.includes(e.pointerId)) {
      finishBrightnessGesture(false);
      multiTouchDrain = activePointers.size > 0;
      return true;
    }
    if (mtGesture && mtGesture.ids.includes(e.pointerId)) {
      finalizeMtGesture();
      multiTouchDrain = activePointers.size > 0;
      return true;
    }
    if (activePointers.size === 0) multiTouchDrain = false;
    return false;
  }

  viewport.addEventListener("pointerup", e => {
    if (releasePointer(e)) { e.preventDefault(); return; }

    if (!swipeGesture || e.pointerId !== swipeGesture.pointerId) return;

    const now = performance.now();
    const dx = e.clientX - swipeGesture.startX;
    const dy = e.clientY - swipeGesture.startY;
    const dt = Math.max(now - swipeGesture.startTime, 1);
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    const threshold = swipeThreshold();
    const velocity = absX / dt;
    const canSwipeAgain = now - lastSwipeAt >= SWIPE_COOLDOWN;
    const shouldSkip =
      canSwipeAgain &&
      dt <= SWIPE_MAX_TIME &&
      absX >= threshold &&
      absY <= absX * SWIPE_VERTICAL_RATIO &&
      velocity >= SWIPE_MIN_VELOCITY;

    if (shouldSkip) {
      const action = swipeActionForDelta(dx);
      lastSwipeAt = now;
      suppressTapUntil = now + 650;
      clearSwipeFeedback();
      controlAction(action).then(ok => {
        if (ok) {
          if (action === "previous") {
            pendingManualDirection = "previous";
            pendingManualAt = performance.now();
            pendingManualProgress = currentProgressMs();
          } else {
            startRecordFlip(action);
          }
          confirmSwipe(action);
        }
      });
      e.preventDefault();
    } else {
      clearSwipeFeedback();
    }

    const completedGesture = swipeGesture;
    swipeGesture = null;
    if (completedGesture.captured && viewport.releasePointerCapture) {
      viewport.releasePointerCapture(e.pointerId);
    }
  }, { passive: false });

  viewport.addEventListener("pointercancel", e => {
    activePointers.delete(e.pointerId);
    if (brightnessGesture && brightnessGesture.ids.includes(e.pointerId)) {
      finishBrightnessGesture(true);
      multiTouchDrain = activePointers.size > 0;
      return;
    }
    if (mtGesture && mtGesture.ids.includes(e.pointerId)) {
      abortMtGesture();
      multiTouchDrain = activePointers.size > 0;
      return;
    }
    if (swipeGesture && e.pointerId === swipeGesture.pointerId) cancelSwipe();
    if (activePointers.size === 0) multiTouchDrain = false;
  });
  viewport.addEventListener("lostpointercapture", e => {
    // setPointerCapture(viewport) transfers Chromium's implicit touch capture
    // from the touched child. That child's lostpointercapture bubbles through
    // viewport. Capture loss is not contact loss: pointercancel, blur and
    // visibility changes own actual aborts. Deleting the pointer here used to
    // cancel a swipe during that normal child-to-viewport transfer.
    if (e.target !== viewport) return;
    if (swipeGesture && e.pointerId === swipeGesture.pointerId) {
      swipeGesture.captured = false;
    }
  });

  function abortAllInput() {
    activePointers.clear();
    finishBrightnessGesture(true);
    abortMtGesture();
    multiTouchDrain = false;
    cancelSwipe();
    clearSwipeFeedback();
    crateDrag = null;
    tlPts.clear();
    tlScroll = null;
    tlPinch = null;
    tlDragMoved = false;
    platter.classList.remove("no-transition");
    platter.style.transform = "";
  }
  window.addEventListener("blur", abortAllInput);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) abortAllInput();
    else { noteActivity(); poll("visible"); fetchBrightnessState(); }
  });

  // ── Wake from screen dim ──
  // While dimmed, #dimmer sits on top with pointer-events:auto, so the first
  // press lands here and ONLY wakes the screen: restart the idle countdown
  // (animate() then drops .dim, restoring pointer-events:none) and stop the
  // event so nothing underneath is activated. Touch pointers implicitly
  // capture to the dimmer, so the matching pointerup/click can't leak either.
  const wakeContactPointers = new Set();
  let wakeDrainReleaseTimer = null;

  function wakeScreen(e) {
    e.stopPropagation();
    e.preventDefault();
    if (wakeDrainReleaseTimer) clearTimeout(wakeDrainReleaseTimer);
    wakeDrainReleaseTimer = null;
    wakeContactPointers.add(e.pointerId);
    dimmer.classList.add("wake-drain");
    noteActivity();
    setScreenDimmed(false);
    suppressTapUntil = performance.now() + 650; // belt & braces vs stray clicks
  }

  function finishWakeContact(e) {
    e.stopPropagation();
    e.preventDefault();
    wakeContactPointers.delete(e.pointerId);
    if (wakeContactPointers.size) return;
    if (wakeDrainReleaseTimer) clearTimeout(wakeDrainReleaseTimer);
    wakeDrainReleaseTimer = setTimeout(() => {
      wakeDrainReleaseTimer = null;
      if (!wakeContactPointers.size) dimmer.classList.remove("wake-drain");
    }, 0);
  }

  function clearWakeContactDrain() {
    if (wakeDrainReleaseTimer) clearTimeout(wakeDrainReleaseTimer);
    wakeDrainReleaseTimer = null;
    wakeContactPointers.clear();
    dimmer.classList.remove("wake-drain");
  }

  dimmer.addEventListener("pointerdown", wakeScreen);
  dimmer.addEventListener("pointerup", finishWakeContact);
  dimmer.addEventListener("pointercancel", finishWakeContact);
  dimmer.addEventListener("lostpointercapture", finishWakeContact);
  dimmer.addEventListener("click", e => { e.stopPropagation(); e.preventDefault(); });
  window.addEventListener("blur", clearWakeContactDrain);

  // ── Prevent all image/element dragging ──
  document.addEventListener("dragstart", e => e.preventDefault());

  // ── WLED setup affordance ──
  const wledChip = $("wled-chip");
  const wledChipLabel = wledChip.querySelector(".label");
  const wledModal = $("wled-modal");
  const wledList = $("wled-list");
  const wledClose = $("wled-close");
  const wledDisable = $("wled-disable");
  const wledToast = $("wled-toast");

  // wledStatus shape: {enabled, configured, devices: [{host, name, pixel_count}]}
  // wledDiscovered shape: [{ip, name, port, pixel_count}, ...]
  let wledStatus = null;
  let wledDiscovered = [];
  let wledLastStatusFetch = -Infinity;
  let wledLastDevicesFetch = -Infinity;
  let wledToastTimer = null;
  let wledStatusError = "";
  let wledDiscoveryError = "";
  let wledRestoreFocus = null;
  let wledRefreshTimer = null;
  let wledMutationQueue = Promise.resolve();
  let wledStatusEpoch = 0;

  const WLED_STATUS_INTERVAL = 15000;
  const WLED_DEVICES_INTERVAL = 30000;

  function showWledToast(message) {
    wledToast.textContent = message;
    wledToast.classList.add("visible");
    if (wledToastTimer) clearTimeout(wledToastTimer);
    wledToastTimer = setTimeout(() => {
      wledToast.classList.remove("visible");
    }, 3000);
  }

  function isIdleForSetup() {
    // Only show setup UI in idle state. now-playing takes precedence whenever a track is active.
    return !state.trackId;
  }

  function configuredHosts() {
    if (!wledStatus || !Array.isArray(wledStatus.devices)) return new Set();
    return new Set(wledStatus.devices.map(d => d.host));
  }

  function hasUnaddedDiscoveredDevice() {
    if (!wledDiscovered.length) return false;
    const configured = configuredHosts();
    return wledDiscovered.some(d => !configured.has(d.ip));
  }

  function chipMessage() {
    const configured = configuredHosts();
    const unadded = wledDiscovered.filter(d => !configured.has(d.ip));
    if (configured.size === 0) {
      return unadded.length === 1
        ? "WLED device found — tap to set up"
        : `${unadded.length} WLED devices found — tap to set up`;
    }
    return unadded.length === 1
      ? "New WLED device found — tap to manage"
      : `${unadded.length} new WLED devices — tap to manage`;
  }

  function updateWledChipVisibility() {
    const show = !screenDimmed && isIdleForSetup() && hasUnaddedDiscoveredDevice() && !wledModal.classList.contains("open");
    if (show) wledChipLabel.textContent = chipMessage();
    wledChip.classList.toggle("visible", show);
    wledChip.setAttribute("aria-hidden", show ? "false" : "true");
    wledChip.tabIndex = show ? 0 : -1;
  }

  async function fetchWledStatus() {
    const epoch = ++wledStatusEpoch;
    try {
      const r = await fetch("/api/wled/status");
      if (epoch !== wledStatusEpoch) return;
      if (!r.ok) {
        wledStatusError = r.status === 401 || r.status === 403
          ? "Owner authorisation is required to manage WLED."
          : "WLED status is unavailable.";
        return;
      }
      const status = await r.json();
      if (epoch !== wledStatusEpoch) return;
      wledStatus = status;
      wledStatusError = "";
    } catch (e) {
      if (epoch === wledStatusEpoch) wledStatusError = "WLED status is unavailable while offline.";
    }
  }

  async function fetchWledDiscovered() {
    try {
      const r = await fetch("/api/wled/discovered");
      if (!r.ok) {
        wledDiscoveryError = r.status === 401 || r.status === 403
          ? "Owner authorisation is required to discover WLED devices."
          : "WLED discovery is unavailable.";
        return;
      }
      const data = await r.json();
      wledDiscovered = Array.isArray(data.devices) ? data.devices : [];
      wledDiscoveryError = "";
    } catch (e) { wledDiscoveryError = "WLED discovery is unavailable while offline."; }
  }

  async function refreshWled() {
    const now = performance.now();
    if (!isIdleForSetup() && !wledModal.classList.contains("open")) {
      wledDiscovered = [];
      updateWledChipVisibility();
      return;
    }
    const tasks = [];
    if (now - wledLastStatusFetch > WLED_STATUS_INTERVAL || wledStatus === null) {
      wledLastStatusFetch = now;
      tasks.push(fetchWledStatus());
    }
    if (now - wledLastDevicesFetch > WLED_DEVICES_INTERVAL) {
      wledLastDevicesFetch = now;
      tasks.push(fetchWledDiscovered());
    }
    if (tasks.length) await Promise.all(tasks);
    updateWledChipVisibility();
  }

  function scheduleWledRefresh(delay) {
    if (wledRefreshTimer) clearTimeout(wledRefreshTimer);
    wledRefreshTimer = null;
    if (screenDimmed) return;
    wledRefreshTimer = setTimeout(async () => {
      wledRefreshTimer = null;
      if (isIdleForSetup() || wledModal.classList.contains("open")) await refreshWled();
      scheduleWledRefresh(wledModal.classList.contains("open") ? 5000 : 10000);
    }, Math.max(0, delay));
  }

  function renderWledList() {
    wledList.innerHTML = "";

    const loadError = wledStatusError || wledDiscoveryError;
    if (loadError) {
      const error = document.createElement("li");
      error.className = "empty";
      error.setAttribute("role", "status");
      error.textContent = loadError;
      wledList.appendChild(error);
      if (wledStatusError) return;
    }

    // Build the union of discovered + configured devices so the user can
    // remove a configured device that's currently offline / not visible.
    const seen = new Set();
    const rows = [];
    for (const d of wledDiscovered) {
      seen.add(d.ip);
      rows.push({ host: d.ip, name: d.name || d.ip, pixel_count: d.pixel_count, visible: true });
    }
    if (wledStatus && Array.isArray(wledStatus.devices)) {
      for (const d of wledStatus.devices) {
        if (seen.has(d.host)) continue;
        rows.push({ host: d.host, name: d.name || d.host, pixel_count: d.pixel_count, visible: false });
      }
    }

    if (!rows.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No WLED devices visible on the network.";
      wledList.appendChild(empty);
      return;
    }

    const configured = configuredHosts();
    for (const row of rows) {
      const isAdded = configured.has(row.host);
      const li = document.createElement("li");
      if (isAdded) li.classList.add("added");
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-label", `${isAdded ? "Remove" : "Add"} ${row.name}`);

      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = row.name + (row.visible ? "" : " · offline");
      const ip = document.createElement("div");
      ip.className = "ip";
      ip.textContent = row.host + (row.pixel_count ? ` · ${row.pixel_count} px` : "");
      meta.appendChild(name);
      meta.appendChild(ip);

      const action = document.createElement("span");
      action.className = "action";
      action.textContent = isAdded ? "Remove" : "Add";

      button.appendChild(meta);
      button.appendChild(action);
      button.addEventListener("click", () => toggleWledDevice(row, !isAdded));
      li.appendChild(button);
      wledList.appendChild(li);
    }
  }

  async function pushWledDevices(devices, enabled) {
    const body = { devices };
    if (typeof enabled === "boolean") body.enabled = enabled;
    try {
      const r = await fetch("/api/wled/devices", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        showWledToast(r.status === 401 || r.status === 403
          ? "Owner authorisation is required"
          : "Failed to save WLED devices");
        return false;
      }
      await fetchWledStatus();
      renderWledList();
      updateWledChipVisibility();
      return true;
    } catch (e) {
      showWledToast("Failed to save WLED devices");
      return false;
    }
  }

  function serialiseWledMutation(operation) {
    const queued = wledMutationQueue.then(operation, operation);
    // Keep the queue usable after a failed mutation; callers still receive the
    // real operation result through `queued`.
    wledMutationQueue = queued.catch(() => false);
    return queued;
  }

  function toggleWledDevice(row, add) {
    return serialiseWledMutation(async () => {
      // Compute from the latest server-confirmed state at execution time, not
      // click time, so rapid edits to different devices cannot overwrite one another.
      const current = (wledStatus && wledStatus.devices) ? wledStatus.devices.slice() : [];
      let next;
      if (add) {
        next = current.filter(d => d.host !== row.host);
        next.push({ host: row.host, name: row.name, pixel_count: row.pixel_count || 46 });
      } else {
        next = current.filter(d => d.host !== row.host);
      }
      const ok = await pushWledDevices(next, next.length > 0);
      if (ok) showWledToast(add ? `Added ${row.name}` : `Removed ${row.name}`);
      return ok;
    });
  }

  function disableWled() {
    return serialiseWledMutation(async () => {
      const ok = await pushWledDevices([], false);
      if (ok) {
        showWledToast("WLED disabled");
        closeWledModal();
      }
      return ok;
    });
  }

  const modalInertRecords = new Map();
  const sharedPlayerBackgroundLayers = [
    platter, $("static-layer"), shelf, volumeHud, brightnessHud,
    gestureChip, connectionStatus, wledChip, diagnosticsEl,
  ];
  const tracklistBackgroundLayers = sharedPlayerBackgroundLayers;
  const wledBackgroundLayers = [...sharedPlayerBackgroundLayers, tlEl];

  function setModalLayersInert(owner, layers, inert) {
    for (const layer of layers) {
      if (!layer) continue;
      let record = modalInertRecords.get(layer);
      if (inert) {
        if (!record) {
          record = { initial: !!layer.inert, owners: new Set() };
          modalInertRecords.set(layer, record);
        }
        record.owners.add(owner);
        layer.inert = true;
      } else if (record) {
        record.owners.delete(owner);
        if (!record.owners.size) {
          layer.inert = record.initial;
          modalInertRecords.delete(layer);
        }
      }
    }
  }

  function openWledModal() {
    noteActivity();
    setScreenDimmed(false);
    abortAllInput();
    if (state.tracklisting) closeTracklist();
    wledRestoreFocus = document.activeElement;
    renderWledList();
    wledModal.classList.add("open");
    wledModal.setAttribute("aria-hidden", "false");
    viewport.classList.add("modal-open");
    setModalLayersInert("wled", wledBackgroundLayers, true);
    wledChip.classList.remove("visible");
    wledChip.setAttribute("aria-hidden", "true");
    wledModal.querySelector(".panel").focus({ preventScroll: true });
    wledLastStatusFetch = -Infinity;
    wledLastDevicesFetch = -Infinity;
    refreshWled().then(() => { if (wledModal.classList.contains("open")) renderWledList(); });
  }

  function closeWledModal() {
    wledModal.classList.remove("open");
    wledModal.setAttribute("aria-hidden", "true");
    viewport.classList.remove("modal-open");
    setModalLayersInert("wled", wledBackgroundLayers, false);
    noteActivity();
    updateWledChipVisibility();
    const focusTarget = wledRestoreFocus && wledRestoreFocus.offsetParent !== null
      ? wledRestoreFocus
      : (!pauseBtn.disabled ? pauseBtn : null);
    if (focusTarget && typeof focusTarget.focus === "function") focusTarget.focus({ preventScroll: true });
    wledRestoreFocus = null;
  }

  wledChip.addEventListener("click", openWledModal);
  wledClose.addEventListener("click", closeWledModal);
  wledDisable.addEventListener("click", disableWled);
  wledModal.addEventListener("click", e => {
    // Click outside the panel = dismiss
    if (e.target === wledModal) closeWledModal();
  });
  wledModal.addEventListener("pointerdown", e => e.stopPropagation());
  wledModal.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      e.preventDefault();
      closeWledModal();
      return;
    }
    if (e.key !== "Tab") return;
    const focusable = [...wledModal.querySelectorAll("button:not([disabled]), [tabindex='0']")]
      .filter(el => !el.hidden && el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    const panel = wledModal.querySelector(".panel");
    if (document.activeElement === panel) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
      return;
    }
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  document.addEventListener("keydown", e => {
    if ((e.key === "d" || e.key === "D") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      setDiagnosticsVisible(!diagnosticsVisible);
      return;
    }
    noteActivity();
    if (wledModal.classList.contains("open") || state.tracklisting) return;
    if (e.key === "Escape" && state.browsing) {
      e.preventDefault();
      exitBrowse();
      return;
    }
    if (state.browsing) return;
    if (e.target && e.target.closest("button, a, input, select, textarea, [role='listbox'], [role='tab'], [role='option']")) return;
    if ((e.key === " " || e.key === "Spacebar") && state.trackId) {
      e.preventDefault();
      controlAction("play-pause");
    } else if (e.key === "ArrowRight" && state.trackId) {
      e.preventDefault();
      controlAction("next").then(ok => { if (ok) startRecordFlip("next"); });
    } else if (e.key === "ArrowLeft" && state.trackId) {
      e.preventDefault();
      controlAction("previous").then(ok => {
        if (!ok) return;
        pendingManualDirection = "previous";
        pendingManualAt = performance.now();
        pendingManualProgress = currentProgressMs();
      });
    }
  });

  // ── Init ──
  if (FLAG_BOOT && !REDUCED_MOTION) {
    // Boot moment: grooves sweep in from the label outward over ~1.2s.
    const bootT0 = performance.now();
    (function bootSweep(now) {
      const t = Math.min(1, (now - bootT0) / 1200);
      drawGrooves(GROOVE_START, easeInOut(t));
      if (t < 1) requestAnimationFrame(bootSweep);
    })(bootT0);
  } else {
    drawGrooves();
  }
  volTrack.setAttribute("d", volArcPath(VOL_A0, VOL_A1));
  $("vol-backing").setAttribute("d", volArcPath(VOL_A0, VOL_A1));
  renderVolume(state.volume);
  brightTrack.setAttribute("d", brightArcPath(BRIGHT_A0, BRIGHT_A1));
  $("bright-backing").setAttribute("d", brightArcPath(BRIGHT_A0, BRIGHT_A1));
  renderBrightness(state.brightness);
  fetchBrightnessState();
  // Warm the crate so the first pinch-in shows records instantly.
  refreshCrateData();
  skipPrev.setAttribute("aria-keyshortcuts", "ArrowLeft");
  skipNext.setAttribute("aria-keyshortcuts", "ArrowRight");
  pauseBtn.setAttribute("aria-keyshortcuts", "Space");
  diagnostics.transport = "polling";
  setDiagnosticsVisible(diagnosticsVisible);
  scheduleAnimation(true);
  poll("init");
  connectPlaybackEvents();
  scheduleWledRefresh(0);

})();
</script>
</body>
</html>
