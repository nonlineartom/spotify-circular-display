<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080, user-scalable=no">
<title>Spotify Vinyl Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --size: 1080px;
    --center: 540px;
    --groove-start: 100;
    --groove-end: 530;
    --label-radius: 96px;
    --ring-radius: 90px;
    --spindle-radius: 14px;
    --pill-w: 610px;
    --pill-r: 18px;
  }

  html, body {
    width: var(--size); height: var(--size);
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    cursor: none;
    user-select: none;
  }

  #viewport {
    position: relative;
    width: var(--size); height: var(--size);
    border-radius: 50%;
    overflow: hidden;
    touch-action: none;
  }

  #viewport::before,
  #viewport::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    z-index: 18;
    pointer-events: none;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.35s ease;
  }

  #viewport.playing::before,
  #viewport.playing::after {
    opacity: 0;
    visibility: hidden;
  }

  #viewport::before {
    top: 0;
    height: 44%;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(0,0,0,0.56) 0%, rgba(0,0,0,0.30) 38%, rgba(0,0,0,0) 76%),
      linear-gradient(to bottom, rgba(0,0,0,0.34), rgba(0,0,0,0));
  }

  #viewport::after {
    bottom: 0;
    height: 35%;
    background:
      radial-gradient(ellipse at 50% 92%, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.42) 44%, rgba(0,0,0,0) 82%),
      linear-gradient(to top, rgba(0,0,0,0.38), rgba(0,0,0,0));
  }

  /* ── Outer rim depth shadow (static, on top of everything) ── */
  #rim-shadow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 40;
    pointer-events: none;
    /* Multi-layered inset shadow for realistic depth */
    box-shadow:
      /* Outer bevel — dark ring at very edge */
      inset 0 0 0 3px rgba(0,0,0,0.5),
      /* Top highlight — subtle light catch */
      inset 0 4px 8px rgba(255,255,255,0.08),
      /* Bottom shadow — depth underneath */
      inset 0 -6px 16px rgba(0,0,0,0.6),
      /* Soft wide inner vignette */
      inset 0 0 60px rgba(0,0,0,0.4),
      /* Tighter vignette near edge */
      inset 0 0 120px rgba(0,0,0,0.15),
      /* Outer glow/shadow on the desk */
      0 4px 20px rgba(0,0,0,0.8),
      0 0 40px rgba(0,0,0,0.3);
  }

  /* ── Platter — the player layer that minimizes away (iOS-style) ── */
  #platter {
    position: absolute;
    inset: 0;
    z-index: 1;
    transform-origin: 50% 50%;
    will-change: transform;
    transition: transform 680ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  /* Browse mode: platter shrinks to a square album cover parked at the top,
     the crate fills the screen beneath it. (The circle→square morph and
     spin-down are driven per-frame in JS; this just parks the layer.) */
  #viewport.browsing #platter {
    transform: translateY(-392px) scale(0.224);
    z-index: 36; /* lift the parked cover above the crate's depth veil */
  }
  /* Live pinch feedback must track the fingers, not ease behind them */
  #platter.no-transition {
    transition: none;
  }
  #viewport.browsing #pill,
  #viewport.browsing #lyrics-wrap,
  #viewport.browsing .skip-btn {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #viewport.browsing #pause-btn {
    pointer-events: none;
  }
  #viewport.browsing #shelf {
    transition: opacity 0.55s ease 0.12s, visibility 0.55s, transform 680ms cubic-bezier(0.32, 0.72, 0, 1);
  }

  /* ── Vinyl record (rotates) ── */
  #vinyl {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 1;
    will-change: transform;
    transform-style: flat;
    transform-origin: 50% 50%;
    transition: none;
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    --flip-sheen: 0;
  }
  #vinyl.flipping {
    transform-style: preserve-3d;
    backface-visibility: visible;
  }
  #vinyl::after {
    content: '';
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    opacity: var(--flip-sheen);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.04) 46%, rgba(0,0,0,0.42) 100%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.38) 100%);
    mix-blend-mode: screen;
  }
  #vinyl.flipping::after {
    display: block;
  }

  /* Everything printed on the disc — mirrored as one unit at the flip's
     hidden 90° point. Deliberately NO transition: the counter-mirror must
     snap in the same frame as the rotation math, never ease. */
  #disc-face {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    border-radius: 50%;
  }

  /* Album art fills the vinyl */
  #artwork {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    -webkit-user-drag: none;
    user-drag: none;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.36s ease, filter 0.5s ease, transform 0.5s ease;
  }
  #artwork.art-changing {
    opacity: 0.72;
    filter: saturate(0.86) brightness(0.78);
    transform: scale(1.035);
  }

  /* Groove overlay — drawn by canvas */
  #grooves {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 6;
  }

  /* Procedural record label — lives inside #vinyl so it rotates and flips
     with the record. Content is rendered as SVG per track. */
  #label {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #label text {
    font-family: 'Montserrat', sans-serif;
  }

  /* 45 Mode — singles get the classic 7" big-hole look */
  #viewport.single {
    --spindle-radius: 30px;
  }

  /* Spindle */
  #spindle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc(var(--spindle-radius) * 2);
    height: calc(var(--spindle-radius) * 2);
    border-radius: 50%;
    background: #323232;
    border: 1px solid #1e1e1e;
    z-index: 10;
    transition: width 0.8s ease, height 0.8s ease;
  }
  #spindle::after {
    content: '';
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-radius: 50%;
    border: 1px solid #464646;
  }

  /* ── Static layer (doesn't rotate) ── */
  #static-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }

  /* ── Canvas progress ring (on the center label) ── */
  #progress-ring-canvas {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: calc((var(--ring-radius) * 2) + 40px);
    height: calc((var(--ring-radius) * 2) + 40px);
    z-index: 25;
    pointer-events: none;
    transition: width 0.8s ease, height 0.8s ease, opacity 0.28s ease;
  }
  /* The ring doesn't flip with the disc — hide it during the flip so the
     static notches aren't a distraction. !important so it also wins over
     the inline opacity the minimize morph manages. */
  #progress-ring-canvas.flip-hidden {
    opacity: 0 !important;
  }
  /* On a 7" single the label is wider — swell the ring to its edge so it
     hugs the paper instead of cutting through the curved type. The canvas
     drawing scales with its CSS box, so everything stays proportional. */
  #viewport.single #progress-ring-canvas {
    width: calc(((var(--ring-radius) * 2) + 40px) * 1.24);
    height: calc(((var(--ring-radius) * 2) + 40px) * 1.24);
  }

  /* ── Player info ── */
  #pill {
    position: absolute;
    left: 50%;
    bottom: 96px;
    transform: translateX(-50%) translateY(12px);
    width: fit-content;
    min-width: 318px;
    max-width: min(560px, calc(100vw - 260px));
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 30;
    pointer-events: auto;
    background: rgba(5, 7, 8, 0.78);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 8px;
    box-shadow:
      0 18px 42px rgba(0,0,0,0.46),
      inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 15px 30px 17px;
    opacity: 0;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  #pill.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Subtle text shadow — backdrop-filter handles contrast now */
  #pill-track, #pill-artist, #time-row {
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  #pill-track {
    font-size: 31px;
    font-weight: 500;
    line-height: 1.18;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(500px, calc(100vw - 330px));
    text-align: center;
    padding-bottom: 2px;
    transition: opacity 0.28s ease, transform 0.36s ease, filter 0.36s ease;
  }

  #pill-artist {
    margin-top: 7px;
    font-size: 21px;
    font-weight: 300;
    color: rgba(255,255,255,0.86);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(470px, calc(100vw - 350px));
    text-align: center;
    transition: opacity 0.28s ease, transform 0.36s ease, filter 0.36s ease;
  }

  #pill.metadata-out #pill-track,
  #pill.metadata-out #pill-artist {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
    filter: blur(7px);
  }

  #pill.metadata-in #pill-track,
  #pill.metadata-in #pill-artist {
    animation: metadata-in 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  #time-row {
    width: 100%;
    min-width: 258px;
    margin-top: 13px;
    display: grid;
    grid-template-columns: 48px 1fr 58px;
    align-items: center;
    gap: 13px;
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.68);
    font-variant-numeric: tabular-nums;
  }

  #time-elapsed {
    text-align: right;
  }

  #time-remaining {
    text-align: left;
  }

  #time-bar {
    position: relative;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background:
      linear-gradient(to right, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.05),
      0 1px 7px rgba(0,0,0,0.28);
  }

  #time-fill {
    position: absolute;
    inset: 0;
    transform-origin: 0 50%;
    transform: scaleX(0);
    border-radius: inherit;
    background:
      linear-gradient(to right, rgba(255,255,255,0.58), rgba(255,255,255,0.96));
    box-shadow: 0 0 16px rgba(255,255,255,0.18);
    transition: transform 0.38s linear;
  }

  /* ── Playback controls ── */
  .skip-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;
    --swipe-strength: 0;
    width: 172px;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    opacity: 0;
    transition: opacity 0.22s ease, transform 0.22s ease, filter 0.22s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .skip-btn::before {
    content: '';
    position: absolute;
    top: 24px; bottom: 24px;
    width: 160px;
    opacity: calc(var(--swipe-strength) * 0.78);
    transition: opacity 0.22s ease;
    pointer-events: none;
  }
  .skip-btn.visible { opacity: 0.22; }
  .skip-btn.visible.dragging {
    opacity: calc(0.28 + var(--swipe-strength) * 0.62);
    transform: translateY(-50%) scale(calc(1 + var(--swipe-strength) * 0.08));
    filter: drop-shadow(0 0 calc(18px + var(--swipe-strength) * 18px) rgba(255,255,255,0.18));
  }
  .skip-btn.confirm {
    animation: edge-confirm 360ms ease-out;
  }
  .skip-btn:active { opacity: 0.78; }
  #skip-prev { left: 0; }
  #skip-next { right: 0; }
  #skip-prev::before {
    left: 0;
    background: linear-gradient(to right, rgba(255,255,255,0.32), rgba(255,255,255,0));
  }
  #skip-next::before {
    right: 0;
    background: linear-gradient(to left, rgba(255,255,255,0.32), rgba(255,255,255,0));
  }
  .skip-btn svg {
    width: 58px;
    height: 58px;
    fill: rgba(255,255,255,0.78);
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.65));
  }
  #pause-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 190px; height: 190px;
    border-radius: 50%;
    z-index: 26;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Lyrics overlay (top half, frosted glass) ── */
  #lyrics-wrap {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 720px;
    height: 355px;
    padding: 54px 52px 60px;
    z-index: 28;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    content-visibility: hidden;
    transition: opacity 0.6s;
    background:
      radial-gradient(ellipse at 50% 34%, rgba(255,255,255,0.06), rgba(255,255,255,0) 64%),
      rgba(0, 0, 0, 0.26);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    /* Mask fades top/bottom — also softens the blur edges naturally */
    -webkit-mask-image: linear-gradient(to bottom,
      transparent 0%, transparent 9%, white 25%, white 66%, transparent 92%, transparent 100%);
    mask-image: linear-gradient(to bottom,
      transparent 0%, transparent 9%, white 25%, white 66%, transparent 92%, transparent 100%);
  }
  #lyrics-wrap.visible {
    opacity: 1;
    visibility: visible;
    content-visibility: visible;
  }

  #lyrics-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .lyric-line {
    font-size: 23px;
    font-weight: 400;
    line-height: 1.28;
    text-align: center;
    padding: 7px 20px;
    color: rgba(255,255,255,0.24);
    transition: color 0.35s, transform 0.35s, font-size 0.35s;
    text-shadow: 0 2px 12px rgba(0,0,0,0.58);
    white-space: normal;
    overflow: hidden;
    text-overflow: clip;
    max-width: 620px;
    max-height: 2.65em;
  }
  .lyric-line.active {
    color: #fff;
    font-size: 31px;
    font-weight: 500;
    transform: translateY(-1px);
    text-shadow:
      0 2px 16px rgba(0,0,0,0.72),
      0 0 28px rgba(255,255,255,0.18);
  }
  .lyric-line.past {
    color: rgba(255,255,255,0.38);
  }

  @keyframes edge-confirm {
    0% { opacity: 0.98; filter: drop-shadow(0 0 32px rgba(255,255,255,0.25)); }
    100% { opacity: 0.22; filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
  }

  @keyframes metadata-in {
    0% {
      opacity: 0;
      transform: translateY(-10px) scale(0.985);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  /* ── Record Shelf (idle launcher) ── */
  #shelf {
    position: absolute;
    inset: 0;
    z-index: 32;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.12);
    transition: opacity 0.7s ease, visibility 0.7s, transform 0.7s ease;
  }
  /* Depth veil — pushes whatever record is on the platter back in z so the
     crate reads as the front layer */
  #shelf::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 56%,
      rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.44) 52%, rgba(0,0,0,0.28) 100%);
  }
  #shelf.visible {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }
  /* Section chips — switch between crates */
  #crate-chips {
    position: absolute;
    top: 300px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 30; /* above the crate drag surface — chips must stay tappable */
  }
  .crate-chip {
    pointer-events: none;
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(20, 20, 22, 0.66);
    border: 1px solid rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.55);
    font-size: 13.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }
  #shelf.visible .crate-chip { pointer-events: auto; }
  .crate-chip.active {
    color: rgba(255,255,255,0.95);
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.22);
  }

  /* The crate itself — a draggable belt of standing records */
  #crate {
    /* Drag surface is a band, not the whole screen — it must not swallow
       taps on the chips above or the parked cover in browse mode. */
    position: absolute;
    top: 360px;
    left: 0; right: 0;
    height: 560px;
    perspective: 1500px;
    perspective-origin: 50% 42%;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shelf.visible #crate { pointer-events: auto; }
  .crate-card {
    position: absolute;
    top: 0; left: 0;
    width: 312px;
    height: 312px;
    border-radius: 5px;
    background-size: cover;
    background-position: center;
    background-color: #1b1b20;
    border-left: 6px solid var(--accent, #888);
    box-shadow:
      0 18px 36px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.10);
    will-change: transform, opacity;
    pointer-events: none; /* the belt handles all input */
    backface-visibility: hidden;
  }
  .crate-card.focused {
    box-shadow:
      0 26px 52px rgba(0,0,0,0.7),
      0 0 36px rgba(255,255,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.16);
  }

  /* Caption for the focused record */
  #crate-caption {
    position: absolute;
    top: 884px;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    text-align: center;
    pointer-events: none;
  }
  #crate-caption .cap-title {
    font-size: 23px;
    font-weight: 500;
    color: rgba(255,255,255,0.88);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  #crate-caption .cap-sub {
    margin-top: 5px;
    font-size: 14.5px;
    font-weight: 300;
    color: rgba(255,255,255,0.48);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Volume HUD — arc fader on the right rim ── */
  #volume-hud {
    position: absolute;
    inset: 0;
    z-index: 45;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s;
  }
  #volume-hud.visible {
    opacity: 1;
    visibility: visible;
  }
  #volume-hud svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
  }
  #volume-hud.pinned svg {
    pointer-events: auto;
    touch-action: none;
  }
  #vol-knob {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.45));
  }
  #vol-label {
    position: absolute;
    right: 152px;
    top: 50%;
    transform: translateY(-50%);
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(15, 15, 17, 0.82);
    border: 1px solid rgba(255,255,255,0.10);
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  #vol-label::after {
    content: "%";
    font-size: 15px;
    font-weight: 300;
    color: rgba(255,255,255,0.55);
    margin-left: 2px;
  }

  /* ── Gesture chip — transient twist-seek readout ── */
  #gesture-chip {
    position: absolute;
    top: 132px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 45;
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(15, 15, 17, 0.86);
    border: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    font-size: 22px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #gesture-chip.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Screen dimmer (saves display after extended idle) ── */
  #dimmer {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    /* base transition = the WAKE fade: quick */
    transition: opacity 0.45s ease;
  }
  /* While dimmed the overlay swallows all input — the first press anywhere
     only wakes the screen, it can never activate what's underneath. */
  #dimmer.dim {
    opacity: 0.85;
    pointer-events: auto;
    /* dimming down stays slow and gentle */
    transition: opacity 3s ease-in-out;
  }

  /* ── WLED setup affordance (idle only) ── */
  #wled-chip {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(20, 20, 22, 0.78);
    color: rgba(255, 255, 255, 0.86);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    border: 1px solid rgba(255, 255, 255, 0.08);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  #wled-chip.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #wled-chip .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b8ff70;
    margin-right: 10px;
    vertical-align: 1px;
    box-shadow: 0 0 8px rgba(184, 255, 112, 0.7);
  }

  #wled-modal {
    position: absolute;
    inset: 0;
    z-index: 70;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    color: rgba(255, 255, 255, 0.92);
  }
  #wled-modal.open { display: flex; }
  #wled-modal .panel {
    width: 560px;
    max-width: 80%;
    background: #111114;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 28px 28px 22px;
  }
  #wled-modal h2 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #wled-modal .sub {
    margin: 0 0 18px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
  }
  #wled-modal ul {
    list-style: none;
    padding: 0;
    margin: 0 0 16px;
    max-height: 320px;
    overflow-y: auto;
  }
  #wled-modal li {
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s ease;
  }
  #wled-modal li:hover, #wled-modal li:active {
    background: rgba(255, 255, 255, 0.08);
  }
  #wled-modal li .meta { display: flex; flex-direction: column; gap: 2px; }
  #wled-modal li .name { font-size: 15px; }
  #wled-modal li .ip { font-size: 12px; color: rgba(255, 255, 255, 0.45); }
  #wled-modal li .action {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.85);
  }
  #wled-modal li.added .action {
    color: #b8ff70;
    border-color: rgba(184, 255, 112, 0.4);
    background: rgba(184, 255, 112, 0.06);
  }
  #wled-modal .controls {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  #wled-modal .controls button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.78);
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  #wled-modal .controls button.danger {
    color: #ffb1b1;
  }
  #wled-modal .empty {
    padding: 24px;
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
  }

  #wled-toast {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 80;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(20, 20, 22, 0.9);
    color: rgba(255, 255, 255, 0.9);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #wled-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="viewport">
  <!-- Platter — everything that shrinks away when the player minimizes -->
  <div id="platter">
    <!-- Vinyl record — this whole div rotates -->
    <div id="vinyl">
      <!-- disc-face wraps everything printed on the disc so the 90° counter-
           mirror moves art, grooves and label as ONE object, instantly
           (the wrapper has no CSS transitions). -->
      <div id="disc-face">
        <img id="artwork" src="" alt="" draggable="false" ondragstart="return false" onmousedown="return false">
        <canvas id="grooves" width="1080" height="1080"></canvas>
        <!-- Procedural record label — rendered per track, spins and flips with the record -->
        <svg id="label" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>

    <!-- Spindle (static, doesn't rotate) -->
    <div id="spindle"></div>

    <!-- Circular progress ring (canvas-based for smooth rendering) -->
    <canvas id="progress-ring-canvas" width="296" height="296"></canvas>
  </div>

	  <!-- Static overlay layer -->
	  <div id="static-layer">
    <!-- Lyrics -->
    <div id="lyrics-wrap">
      <div id="lyrics-inner"></div>
    </div>

    <!-- Player pill -->
    <div id="pill">
      <div id="pill-track"></div>
      <div id="pill-artist"></div>
      <div id="time-row">
        <span id="time-elapsed">0:00</span>
        <div id="time-bar"><div id="time-fill"></div></div>
        <span id="time-remaining">-0:00</span>
      </div>
    </div>

    <!-- Skip buttons — semi-transparent triangles at outer edges -->
    <div id="skip-prev" class="skip-btn">
      <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4"/><rect x="5" y="4" width="3" height="16"/></svg>
    </div>
    <div id="skip-next" class="skip-btn">
      <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><rect x="16" y="4" width="3" height="16"/></svg>
    </div>

	    <!-- Tap-to-pause zone over center label -->
	    <div id="pause-btn"></div>
	  </div>

	  <!-- Outer rim depth shadow — creates 3D recessed look -->
	  <div id="rim-shadow"></div>

  <!-- Record Shelf — the crate: riffle through records, tap to put one on -->
  <div id="shelf">
    <div id="crate-chips"></div>
    <div id="crate"><div id="crate-belt"></div></div>
    <div id="crate-caption">
      <div class="cap-title"></div>
      <div class="cap-sub"></div>
    </div>
  </div>

  <!-- Volume HUD — arc fader hugging the right rim -->
  <div id="volume-hud">
    <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="vol-blur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="11"/>
        </filter>
      </defs>
      <!-- dark backing band so the arc reads over bright album art -->
      <path id="vol-backing" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="60" stroke-linecap="round" filter="url(#vol-blur)"/>
      <path id="vol-track" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
      <path id="vol-fill" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="12" stroke-linecap="round"/>
      <circle id="vol-knob" r="14" fill="#fff"/>
    </svg>
    <div id="vol-label">50</div>
  </div>

  <!-- Gesture chip — transient readout for twist-seek -->
  <div id="gesture-chip"></div>

  <!-- Screen dimmer — fades to near-black after extended idle -->
  <div id="dimmer"></div>

  <!-- WLED setup affordance (only appears when idle and a new device is seen) -->
  <div id="wled-chip"><span class="dot"></span><span class="label">WLED device found — tap to set up</span></div>

  <!-- WLED device picker modal -->
  <div id="wled-modal" role="dialog" aria-modal="true">
    <div class="panel">
      <h2>WLED devices</h2>
      <p class="sub">Tap to add or remove a device. All selected strips run the same album-art palette in sync.</p>
      <ul id="wled-list"></ul>
      <div class="controls">
        <button type="button" id="wled-disable" class="danger">Disable WLED</button>
        <button type="button" id="wled-close">Done</button>
      </div>
    </div>
  </div>

  <div id="wled-toast"></div>
</div>

<script>
(function() {
  "use strict";

  // ── Constants ──
  const SIZE = 1080;
  const CENTER = SIZE / 2;
  const GROOVE_COUNT = 120;
  const GROOVE_START = 100;
  const GROOVE_END = 530;
  // 45 Mode: albums spin at 33⅓, singles at 45 — like the real shelf.
  const RPM_BASE = 33.333;
  const RPM_SINGLE = 45;
  const RPM_EASE_MS = 450;   // exponential approach time constant
  let rpmCurrent = RPM_BASE;
  let rpmTarget = RPM_BASE;

  // Eased spin-up / spin-down duration (ms)
  const SPIN_RAMP = 4000;

  // ── Elements ──
  const $ = id => document.getElementById(id);
  const viewport   = $("viewport");
  const vinyl      = $("vinyl");
  const artworkEl  = $("artwork");
  const pill       = $("pill");
  const pillTrack  = $("pill-track");
  const pillArtist = $("pill-artist");
  const timeElapsed = $("time-elapsed");
  const timeRemaining = $("time-remaining");
  const timeFill = $("time-fill");
  const progressCanvas = $("progress-ring-canvas");
  const progressCtx = progressCanvas.getContext("2d");
  const lyricsWrap = $("lyrics-wrap");
  const lyricsInner = $("lyrics-inner");
  const skipPrev   = $("skip-prev");
  const skipNext   = $("skip-next");
  const pauseBtn   = $("pause-btn");
  const dimmer     = $("dimmer");
  const groovesEl  = $("grooves");
  const spindleEl  = $("spindle");
  const discFace   = $("disc-face");
  const platter    = $("platter");
  const volumeHud  = $("volume-hud");
  const volTrack   = $("vol-track");
  const volFill    = $("vol-fill");
  const volKnob    = $("vol-knob");
  const volLabel   = $("vol-label");
  const gestureChip = $("gesture-chip");

  // Progress ring constants (canvas is 296x296 = 2x the CSS size for retina)
  const RING_CX = 148;
  const RING_CY = 148;
  const RING_R = 122;          // main arc radius (leave room for ticks + glow)
  const RING_TRACK_W = 2.2;    // background track width
  const RING_ARC_W = 6.5;      // progress arc width
  const RING_DOT_R = 9;        // dot outer radius
  const RING_DOT_INNER = 4.5;  // dot inner radius (creates ring shape)
  const TICK_COUNT = 60;        // minute-mark ticks around the ring
  const TICK_MAJOR_EVERY = 5;   // every 5th tick is longer

  // ── State ──
  let state = {
    isPlaying: false,
    progressMs: 0,
    durationMs: 1,
    trackId: null,
    trackName: "",
    artistName: "",
    albumName: "",
    artUrl: "",
    volume: 50,
    isSingle: false,
    releaseDate: "",
    recordLabel: "",
    browsing: false,
    lastUpdate: performance.now(),
  };

  let pausedSince = 0;
  let screenDimmed = false;
  // Idle time before the screen dims. Overridable for testing/tuning via
  // URL param, e.g. /?dim=30 dims after 30 seconds.
  const DIM_DELAY = (parseInt(new URLSearchParams(location.search).get("dim"), 10) || 5 * 60) * 1000;

  // Lyrics state
  let lyricsLines = [];      // [{time: ms, text: ""}, ...]
  let lyricsTrackId = null;
  let currentLyricIdx = -1;

  // Vinyl rotation state
  let currentAngle = 0;
  let spinSpeed = 0;        // 0 = stopped, 1 = full speed
  let spinTarget = 0;       // 0 or 1
  let spinStartTime = 0;
  let spinStartSpeed = 0;
  let lastFrameTime = performance.now();

  // Return-to-zero state
  let returningToZero = false;
  let returnStartAngle = 0;
  let returnStartTime = 0;
  const RETURN_DURATION = 1200; // ms to ease back to 0

  // Minimize (pinch-to-crate) morph: 0 = full spinning vinyl, 1 = square cover
  // parked at the top. Drives the circle→square shape and decoration fade,
  // and decelerates the record to upright as it shrinks.
  let minimizeProg = 0;
  let lastMinimizeProg = -1;
  let browseStartAngle = 0;
  let browseTargetAngle = 0;

  // Track transition state
  let metadataTimer = null;
  let flipStartTime = 0;
  let flipDirection = 1;
  const FLIP_DURATION = 920;
  // New art/label are revealed at the flip's hidden 90° point. They're staged
  // here while the front half plays, then swapped; if a fresh skip's art is
  // slow to load the flip holds edge-on (up to FLIP_HOLD_MAX) until it arrives.
  // If nothing arrives at all, the flip completes as a plain turn-over.
  let pendingArt = null;
  let pendingPalette = undefined;
  let flipArtSwapped = false;
  let flipHoldDeadline = 0;
  let lastFlipStartedAt = -Infinity;
  const FLIP_HOLD_MAX = 1800;
  let lastProgressDraw = 0;
  let lastProgressEmpty = false;
  const PROGRESS_DRAW_INTERVAL = 125;

  // ── Draw grooves on canvas (redrawn when the label size changes) ──
  function drawGrooves(startRadius) {
    const start = startRadius || GROOVE_START;
    const canvas = $("grooves");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, SIZE, SIZE);
    const spacing = (GROOVE_END - start) / GROOVE_COUNT;

    for (let i = 0; i < GROOVE_COUNT; i++) {
      const r = start + i * spacing;
      const alpha = (15 + (i % 3) * 5) / 255;
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Outer rim
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, SIZE / 2 - 2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0,0,0,0.157)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // ── Helpers ──
  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  async function api(method, path) {
    try {
      const resp = await fetch("/api" + path, { method });
      if (resp.ok && resp.status !== 204) return resp.json();
    } catch(e) {}
    return null;
  }

  function setPlayerMode(hasTrack) {
    viewport.classList.toggle("playing", hasTrack);
  }

  // ── Procedural record label ("The Pressing") ──
  // Every album gets a generated label: palette-tinted paper, curved type,
  // an RPM marque, the release year, a side marker that alternates A/B with
  // each record flip, and a faint dead-wax etching in the run-out band.
  const labelSvg = $("label");
  let labelPalette = null;   // {base, edge, ink, accent} from album art, or null
  let sideB = false;
  let lastLabelKey = "";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h = (h * 60 + 360) % 360;
    }
    return [h, max ? d / max : 0, max];
  }

  function hsvToCss(h, s, v) {
    const f = n => {
      const k = (n + h / 60) % 6;
      return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))));
    };
    return `rgb(${f(5)},${f(3)},${f(1)})`;
  }

  // Sample colors from a CORS-enabled copy of the artwork. The displayed
  // <img> is left untouched so artwork can never break if the CDN refuses
  // cross-origin reads — we just fall back to a cream paper label.
  function sampleLabelPalette(url) {
    return new Promise(resolve => {
      if (!url) return resolve(null);
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = c.height = 24;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(img, 0, 0, 24, 24);
          const d = x.getImageData(0, 0, 24, 24).data;
          let best = null, bestScore = -1;
          let rSum = 0, gSum = 0, bSum = 0, n = 0;
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            rSum += r; gSum += g; bSum += b; n++;
            const [h, s, v] = rgbToHsv(r, g, b);
            const score = s * v * (0.35 + 0.65 * Math.min(1, v * 1.4));
            if (score > bestScore) { bestScore = score; best = [h, s, v]; }
          }
          const [ah, as, av] = rgbToHsv(rSum / n, gSum / n, bSum / n);
          // Prefer the punchiest accent; fall back to the average hue.
          const hue = (best && best[1] > 0.18) ? best[0] : ah;
          const sat = (best && best[1] > 0.18) ? best[1] : as;
          const baseV = 0.58 + Math.min(0.2, av * 0.25);
          const baseS = Math.min(0.62, sat * 0.75 + 0.08);
          resolve({
            base: hsvToCss(hue, baseS, baseV),
            edge: hsvToCss(hue, Math.min(0.7, baseS * 1.15), baseV * 0.66),
            ink: baseV * (1 - baseS * 0.45) > 0.42 ? "#181208" : "#f3ecdc",
            accent: hsvToCss(hue, Math.min(1, sat * 1.2), Math.min(0.9, Math.max(0.4, (best ? best[2] : av)))),
          });
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  const LABEL_FALLBACK = { base: "#d9cfba", edge: "#a89a7e", ink: "#241c10", accent: "#8a2d22" };

  function arcFontSize(text, radius, maxPx) {
    const arcLen = Math.PI * radius * 0.96;
    return Math.max(8.5, Math.min(maxPx, arcLen / (Math.max(text.length, 6) * 0.62)));
  }

  function clip(text, max) {
    return text.length > max ? text.slice(0, max - 1).trimEnd() + "…" : text;
  }

  function renderLabel() {
    if (!state.trackId) return; // keep the last pressing on the platter when idle
    // During a flip's front half, hold the old label — the new one is drawn at
    // the hidden 90° swap (which calls renderLabel with flipArtSwapped set).
    if (flipStartTime && !flipArtSwapped) return;

    const single = state.isSingle;
    const pal = labelPalette || LABEL_FALLBACK;
    const album = clip(state.albumName || state.trackName || "", 34);
    const artist = clip(state.artistName || "", 36);
    const year = (state.releaseDate || "").slice(0, 4);
    const recLabel = clip((state.recordLabel || "").toUpperCase(), 24);
    const side = sideB ? "B" : "A";

    const key = [state.trackId, album, artist, year, recLabel, single, side, pal.base].join("|");
    if (key === lastLabelKey) return;
    lastLabelKey = key;

    const C = 540;
    const R = single ? 114 : 96;        // label paper radius
    const holeR = single ? 30 : 16;     // center hole
    const textR = single ? 74 : 62;     // title/artist arc radius
    const marqueY = single ? 48 : 40;   // marque offset below center
    const sideX = single ? 64 : 50;     // side letter / year offset
    const etchR = R + 9;                // dead-wax etching radius

    const titleSize = arcFontSize(album, textR, 13.5);
    const artistSize = arcFontSize(artist, textR, 11);
    const marque = (single ? "45 RPM" : "33⅓ RPM") + " · STEREO";
    const cat = "PID-" + (state.trackId || "").replace(/[^a-zA-Z0-9]/g, "").slice(-6).toUpperCase();
    const etch = [cat, "SIDE " + side, year, recLabel].filter(Boolean).join(" ✵ ");

    const adapter = single
      ? `<circle cx="${C}" cy="${C}" r="34" fill="none" stroke="url(#lbl-metal)" stroke-width="9"/>
         <circle cx="${C}" cy="${C}" r="38.5" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1"/>`
      : "";

    labelSvg.innerHTML = `
      <defs>
        <radialGradient id="lbl-paper" cx="50%" cy="47%" r="55%">
          <stop offset="0%" stop-color="${pal.base}"/>
          <stop offset="78%" stop-color="${pal.base}"/>
          <stop offset="100%" stop-color="${pal.edge}"/>
        </radialGradient>
        <linearGradient id="lbl-metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#777"/>
          <stop offset="45%" stop-color="#3c3c3c"/>
          <stop offset="100%" stop-color="#666"/>
        </linearGradient>
        <path id="lbl-arc-top" d="M ${C - textR} ${C} A ${textR} ${textR} 0 0 1 ${C + textR} ${C}"/>
        <path id="lbl-arc-bottom" d="M ${C - textR} ${C} A ${textR} ${textR} 0 0 0 ${C + textR} ${C}"/>
        <path id="lbl-arc-etch" d="M ${C - etchR} ${C} A ${etchR} ${etchR} 0 0 0 ${C + etchR} ${C}"/>
      </defs>

      <!-- dead-wax etching (outside the paper, in the run-out) -->
      <text font-size="10" letter-spacing="5.5" fill="rgba(255,255,255,0.20)">
        <textPath href="#lbl-arc-etch" startOffset="50%" text-anchor="middle">${esc(etch)}</textPath>
      </text>

      <!-- label paper -->
      <circle cx="${C}" cy="${C}" r="${R}" fill="url(#lbl-paper)"/>
      <circle cx="${C}" cy="${C}" r="${R - 1}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      <circle cx="${C}" cy="${C}" r="${R - 5}" fill="none" stroke="${pal.edge}" stroke-width="1.6" opacity="0.65"/>
      <!-- press rings -->
      <circle cx="${C}" cy="${C}" r="${R * 0.48}" fill="none" stroke="${pal.ink}" stroke-width="0.6" opacity="0.10"/>
      <circle cx="${C}" cy="${C}" r="${R * 0.62}" fill="none" stroke="${pal.ink}" stroke-width="0.6" opacity="0.08"/>

      <!-- curved type -->
      <text font-size="${titleSize.toFixed(1)}" font-weight="500" letter-spacing="1.6" fill="${pal.ink}">
        <textPath href="#lbl-arc-top" startOffset="50%" text-anchor="middle">${esc(album.toUpperCase())}</textPath>
      </text>
      <text font-size="${artistSize.toFixed(1)}" font-weight="400" letter-spacing="1.8" fill="${pal.ink}" opacity="0.82">
        <textPath href="#lbl-arc-bottom" startOffset="50%" text-anchor="middle">${esc(artist.toUpperCase())}</textPath>
      </text>

      <!-- marque + record company -->
      ${recLabel ? `<text x="${C}" y="${C - marqueY + 6}" font-size="7.5" letter-spacing="1.8" fill="${pal.ink}" opacity="0.55" text-anchor="middle">${esc(recLabel)}</text>` : ""}
      <text x="${C}" y="${C + marqueY}" font-size="8.5" letter-spacing="2.2" fill="${pal.ink}" opacity="0.68" text-anchor="middle">${esc(marque)}</text>

      <!-- side marker + year -->
      <text x="${C - sideX}" y="${C + 6}" font-size="17" font-weight="600" fill="${pal.ink}" text-anchor="middle">${side}</text>
      ${year ? `<text x="${C + sideX}" y="${C + 5}" font-size="9.5" letter-spacing="1" fill="${pal.ink}" opacity="0.75" text-anchor="middle">${esc(year)}</text>` : ""}

      <!-- center hole (the static spindle sits over this) -->
      ${adapter}
      <circle cx="${C}" cy="${C}" r="${holeR}" fill="#000"/>
      <circle cx="${C}" cy="${C}" r="${holeR}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    `;
  }

  // ── Lyrics ──
  function parseLRC(lrc) {
    if (!lrc) return [];
    const lines = [];
    for (const line of lrc.split("\n")) {
      const m = line.match(/^\[(\d+):(\d+)\.(\d+)\]\s*(.*)/);
      if (m) {
        const ms = parseInt(m[1]) * 60000 + parseInt(m[2]) * 1000 + parseInt(m[3]) * 10;
        const text = m[4].trim();
        if (text) lines.push({ time: ms, text });
      }
    }
    return lines;
  }

  async function fetchLyrics(trackName, artistName, albumName, durationSec) {
    try {
      const params = new URLSearchParams({
        track: trackName, artist: artistName,
        album: albumName, duration: String(durationSec)
      });
      const resp = await fetch("/api/lyrics?" + params);
      if (!resp.ok) return [];
      const data = await resp.json();
      return parseLRC(data.syncedLyrics);
    } catch(e) { return []; }
  }

  function renderLyricLines() {
    lyricsInner.innerHTML = "";
    if (!lyricsLines.length) {
      lyricsWrap.classList.remove("visible");
      return;
    }
    for (const line of lyricsLines) {
      const div = document.createElement("div");
      div.className = "lyric-line";
      div.textContent = line.text;
      lyricsInner.appendChild(div);
    }
    lyricsWrap.classList.add("visible");
    currentLyricIdx = -1;
  }

  function updateLyrics(nowMs) {
    if (!lyricsLines.length) return;

    let p = state.progressMs;
    if (state.isPlaying) p += nowMs - state.lastUpdate;
    p = Math.min(p, state.durationMs);

    // Find current line
    let idx = -1;
    for (let i = lyricsLines.length - 1; i >= 0; i--) {
      if (p >= lyricsLines[i].time) { idx = i; break; }
    }

    if (idx === currentLyricIdx) return;
    currentLyricIdx = idx;

    const els = lyricsInner.children;
    for (let i = 0; i < els.length; i++) {
      els[i].classList.toggle("active", i === idx);
      els[i].classList.toggle("past", i < idx);
    }

    // Scroll so active line is near top of visible area
    if (idx >= 0 && els[idx]) {
      const offset = els[idx].offsetTop - 118; // keep the active line in the focus lane
      lyricsInner.style.transform = `translateY(${-offset}px)`;
    }
  }

  // ── Easing: cubic ease-in-out ──
  function easeInOut(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutQuint(t) {
    return 1 - Math.pow(1 - t, 5);
  }

  function applyVinylTransform(now) {
    // Flip is a single rigid rotation about the VERTICAL centre axis
    // (rotateY) so it matches the horizontal skip swipe — a "next" swipe
    // (right→left) turns the record over to the left like a page, and a
    // "previous" swipe (left→right) turns it the other way. The vinyl spin
    // is frozen for the duration so the flip reads as one clean motion.
    // `flipDirection` carries the swipe's sign.
    let flipAngle = 0;
    let sheen = 0;

    if (flipStartTime) {
      let t = Math.min((now - flipStartTime) / FLIP_DURATION, 1);

      // At the hidden 90° point, reveal the new track's art + label and
      // counter-mirror the whole disc face so the back half (90→180°) reads
      // upright. If the art isn't loaded yet (fresh skip), hold edge-on until
      // it arrives; if nothing ever arrives, finish as a plain turn-over
      // (no swap, no mirror — the pre-existing look).
      if (!flipArtSwapped && t >= 0.5) {
        if (pendingArt !== null) {
          flipArtSwapped = true;
          artworkEl.src = pendingArt;
          pendingArt = null;
          if (pendingPalette !== undefined) { labelPalette = pendingPalette; pendingPalette = undefined; }
          sideB = !sideB;
          lastLabelKey = "";
          renderLabel();
          discFace.style.transform = "scaleX(-1)";
        } else if (flipHoldDeadline && now >= flipHoldDeadline) {
          flipArtSwapped = true; // give up waiting — plain turn-over
        } else {
          if (!flipHoldDeadline) flipHoldDeadline = now + FLIP_HOLD_MAX;
          flipStartTime = now - FLIP_DURATION * 0.5;
          t = 0.5;
        }
      }

      const resolve = easeInOut(t);
      flipAngle = resolve * 180 * flipDirection;
      // Subtle sheen pulse — sells the 3D rotation against the album art.
      sheen = Math.sin(t * Math.PI) * 0.55;

      if (t >= 1) {
        flipStartTime = 0;
        sheen = 0;
        vinyl.classList.remove("flipping");
        artworkEl.classList.remove("art-changing");
        progressCanvas.classList.remove("flip-hidden"); // notches ease back in
        // Cleared in the same frame the rotateY(180°) below disappears —
        // rotateY(180)+mirror ≡ upright, so the hand-off is invisible. The
        // wrapper has no transition, so both snap together.
        discFace.style.transform = "";
      }
    }

    vinyl.style.setProperty("--flip-sheen", sheen.toFixed(3));
    if (flipStartTime) {
      // Spin (rotate = rotateZ) is applied first (innermost) so it stays the
      // record's own centre spin, then the flip pivots about the screen's
      // vertical axis — matching the horizontal swipe, never a tilted axis.
      vinyl.style.transform =
        `perspective(1600px) rotateY(${flipAngle.toFixed(2)}deg) rotate(${currentAngle.toFixed(2)}deg)`;
    } else {
      vinyl.style.transform = `rotate(${currentAngle.toFixed(2)}deg)`;
    }
  }

  // Circle→square morph driven by minimizeProg: the album art rounds off to
  // a square cover and the vinyl furniture (grooves, label, spindle, ring)
  // fades, so the spinning record becomes the original square artwork.
  function applyMinimizeMorph() {
    const m = minimizeProg;
    artworkEl.style.borderRadius = (50 - 47.5 * m).toFixed(2) + "%";
    // Decorations clear a touch ahead of full square so the cover reads clean.
    const fade = Math.max(0, 1 - m * 1.15).toFixed(3);
    groovesEl.style.opacity = fade;
    labelSvg.style.opacity = fade;
    spindleEl.style.opacity = fade;
    progressCanvas.style.opacity = fade;
  }

  function startRecordFlip(direction) {
    flipDirection = direction === "previous" ? 1 : -1;
    flipStartTime = performance.now();
    lastFlipStartedAt = flipStartTime;
    flipArtSwapped = false;
    flipHoldDeadline = 0;
    pendingArt = null;
    pendingPalette = undefined;
    // Clear any counter-mirror a prior (rapidly-superseded) flip left behind,
    // so this flip's front half is never mirrored.
    discFace.style.transform = "";
    vinyl.classList.add("flipping");
    artworkEl.classList.add("art-changing");
    progressCanvas.classList.add("flip-hidden"); // static notches fade off for the flip
    // The disc-face swap, and the art-changing cleanup, are handled at the
    // hidden 90° point and on flip completion inside applyVinylTransform.
  }

  // Stage new artwork/palette so a running flip reveals it at the hidden 90°
  // point; outside a flip, apply immediately.
  function stageArtwork(url) {
    if (flipStartTime && !flipArtSwapped) pendingArt = url;
    else artworkEl.src = url;
  }
  function stagePalette(p) {
    if (flipStartTime && !flipArtSwapped) {
      pendingPalette = p;
    } else {
      labelPalette = p;
      lastLabelKey = "";
      renderLabel();
    }
  }

  function setPillMetadata(trackName, artistName, animateChange) {
    if (metadataTimer) {
      window.clearTimeout(metadataTimer);
      metadataTimer = null;
    }

    if (!animateChange) {
      pill.classList.remove("metadata-out", "metadata-in");
      pillTrack.textContent = trackName;
      pillArtist.textContent = artistName;
      return;
    }

    pill.classList.remove("metadata-in");
    pill.classList.add("metadata-out");
    metadataTimer = window.setTimeout(() => {
      pillTrack.textContent = trackName;
      pillArtist.textContent = artistName;
      pill.classList.remove("metadata-out");
      pill.classList.add("metadata-in");
      metadataTimer = window.setTimeout(() => {
        pill.classList.remove("metadata-in");
        metadataTimer = null;
      }, 560);
    }, 190);
  }

  // ── Animation loop ──
  function animate(now) {
    requestAnimationFrame(animate);

    const dt = now - lastFrameTime;
    lastFrameTime = now;

    // --- Minimize morph easing (pinch to/from the crate) ---
    const minTarget = state.browsing ? 1 : 0;
    if (minimizeProg !== minTarget) {
      minimizeProg += (minTarget - minimizeProg) * (1 - Math.exp(-dt / 150));
      if (Math.abs(minTarget - minimizeProg) < 0.0015) minimizeProg = minTarget;
    }

    if (state.browsing) {
      // Minimizing: decelerate the record to upright (so it lands as a
      // square cover the right way up), coupled to the shrink progress.
      const e = easeOutQuint(Math.min(1, minimizeProg));
      currentAngle = browseStartAngle + (browseTargetAngle - browseStartAngle) * e;
    } else {
      // --- Spin easing ---
      if (spinSpeed !== spinTarget) {
        const elapsed = now - spinStartTime;
        const t = Math.min(elapsed / SPIN_RAMP, 1);
        const eased = easeInOut(t);
        spinSpeed = spinStartSpeed + (spinTarget - spinStartSpeed) * eased;
        if (t >= 1) {
          spinSpeed = spinTarget;
          // When fully stopped, start return-to-zero
          if (spinTarget === 0 && !returningToZero && Math.abs(currentAngle % 360) > 0.5) {
            returningToZero = true;
            returnStartAngle = currentAngle % 360;
            returnStartTime = now;
          }
        }
      }

      // --- Return to 0 degrees when stopped ---
      if (returningToZero && spinSpeed === 0) {
        const elapsed = now - returnStartTime;
        const t = Math.min(elapsed / RETURN_DURATION, 1);
        const eased = easeInOut(t);
        // Take shortest path to 0
        let target = 0;
        if (returnStartAngle > 180) target = 360;
        currentAngle = returnStartAngle + (target - returnStartAngle) * eased;
        if (t >= 1) {
          currentAngle = 0;
          returningToZero = false;
        }
      }
      // --- Rotate vinyl ---
      // Spin pauses during a flip so the only motion you see is the clean
      // 180° flip about the horizontal centre line, just like grabbing a
      // record off the platter to turn it over. The spin resumes on the
      // same angle the moment the flip ends.
      else if (spinSpeed > 0.001 && !flipStartTime) {
        returningToZero = false;
        // Ease toward the target RPM so a 33⅓ ↔ 45 change reads as the
        // platter motor catching up, not a snap.
        if (rpmCurrent !== rpmTarget) {
          rpmCurrent += (rpmTarget - rpmCurrent) * Math.min(1, dt / RPM_EASE_MS);
          if (Math.abs(rpmCurrent - rpmTarget) < 0.02) rpmCurrent = rpmTarget;
        }
        currentAngle += ((rpmCurrent * 360) / 60000) * dt * spinSpeed;
        currentAngle %= 360;
      }
    }

    applyVinylTransform(now);
    if (minimizeProg !== lastMinimizeProg) {
      applyMinimizeMorph();
      lastMinimizeProg = minimizeProg;
    }

    // --- Progress ring ---
    updateProgressRing(now);

    // --- Lyrics ---
    updateLyrics(now);

    // --- Crate glide/snap ---
    updateCrate(now, dt);

    // --- Screen dim after extended idle/paused state ---
    const timePaused = pausedSince > 0 ? now - pausedSince : 0;
    setPlayerMode(!!state.trackId);

    const shouldDim = !state.isPlaying && timePaused >= DIM_DELAY;
    if (shouldDim && !screenDimmed) {
      dimmer.classList.add("dim");
      screenDimmed = true;
    } else if (!shouldDim && screenDimmed) {
      dimmer.classList.remove("dim");
      screenDimmed = false;
    }
  }

  function updateProgressRing(now) {
    if (!state.trackId) {
      if (!lastProgressEmpty) {
        progressCtx.clearRect(0, 0, 296, 296);
        timeElapsed.textContent = "0:00";
        timeRemaining.textContent = "-0:00";
        timeFill.style.transform = "scaleX(0)";
        lastProgressEmpty = true;
      }
      return;
    }
    if (now - lastProgressDraw < PROGRESS_DRAW_INTERVAL) return;
    lastProgressDraw = now;
    lastProgressEmpty = false;

    let p = state.progressMs;
    if (state.isPlaying) {
      p += now - state.lastUpdate;
    }
    p = Math.min(p, state.durationMs);
    const pct = p / Math.max(state.durationMs, 1);

    const ctx = progressCtx;
    const cx = RING_CX, cy = RING_CY, r = RING_R;
    const startAngle = -Math.PI / 2; // 12 o'clock

    ctx.clearRect(0, 0, 296, 296);

    // ── Tick marks (watch-style) ──
    for (let i = 0; i < TICK_COUNT; i++) {
      const angle = startAngle + (i / TICK_COUNT) * Math.PI * 2;
      const major = i % TICK_MAJOR_EVERY === 0;
      const len = major ? 10 : 4;
      const gap = 4;
      const tickR1 = r + gap;
      const tickR2 = r + gap + len;
      const x1 = cx + tickR1 * Math.cos(angle);
      const y1 = cy + tickR1 * Math.sin(angle);
      const x2 = cx + tickR2 * Math.cos(angle);
      const y2 = cy + tickR2 * Math.sin(angle);

      // Ticks that have been "passed" by progress glow brighter
      const tickPct = i / TICK_COUNT;
      const passed = tickPct <= pct;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      if (passed) {
        ctx.strokeStyle = major ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.2)";
      } else {
        ctx.strokeStyle = major ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.06)";
      }
      ctx.lineWidth = major ? 1.5 : 0.8;
      ctx.stroke();
    }

    // ── Background track ──
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = RING_TRACK_W;
    ctx.stroke();

    if (pct <= 0) {
      timeElapsed.textContent = fmt(p);
      timeRemaining.textContent = "-" + fmt(state.durationMs - p);
      timeFill.style.transform = "scaleX(0)";
      return;
    }

    // ── Progress arc with gradient ──
    const endAngle = startAngle + pct * Math.PI * 2;

    // Create a conical-style gradient by drawing many small segments
    const segments = Math.max(2, Math.floor(pct * 72));
    for (let i = 0; i < segments; i++) {
      const t0 = i / segments;
      const t1 = (i + 1.5) / segments; // slight overlap to avoid gaps
      const a0 = startAngle + t0 * pct * Math.PI * 2;
      const a1 = startAngle + Math.min(t1, 1) * pct * Math.PI * 2;

      // Gradient: dim warm → bright white along the arc
      const t = t0;
      const alpha = 0.3 + t * 0.7;
      // Warm-to-white: start with subtle warm tint, end pure white
      const rr = Math.round(180 + t * 75);
      const gg = Math.round(170 + t * 85);
      const bb = Math.round(160 + t * 95);

      ctx.beginPath();
      ctx.arc(cx, cy, r, a0, a1);
      ctx.strokeStyle = `rgba(${rr},${gg},${bb},${alpha})`;
      ctx.lineWidth = RING_ARC_W;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    // ── Glow behind the leading edge ──
    const glowAngle = endAngle;
    const glowX = cx + r * Math.cos(glowAngle);
    const glowY = cy + r * Math.sin(glowAngle);
    const glow = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, 18);
    glow.addColorStop(0, "rgba(255,255,255,0.25)");
    glow.addColorStop(0.5, "rgba(255,255,255,0.08)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    ctx.arc(glowX, glowY, 18, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // ── Dot at the leading edge ──
    const dotX = cx + r * Math.cos(endAngle);
    const dotY = cy + r * Math.sin(endAngle);

    // Outer ring
    ctx.beginPath();
    ctx.arc(dotX, dotY, RING_DOT_R, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();

    // Inner cutout (creates a ring/donut shape)
    ctx.beginPath();
    ctx.arc(dotX, dotY, RING_DOT_INNER, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(30,30,30,0.9)";
    ctx.fill();

    // Tiny bright center
    ctx.beginPath();
    ctx.arc(dotX, dotY, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fill();

    // Pause icon — two vertical bars in center when paused
    if (!state.isPlaying && state.trackId) {
      const barW = 5, barH = 24, gap = 8;
      // Soft dark backing so the bars read on light label paper too
      ctx.beginPath();
      ctx.arc(cx, cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,6,4,0.45)";
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.roundRect(cx - gap/2 - barW, cy - barH/2, barW, barH, 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(cx + gap/2, cy - barH/2, barW, barH, 2);
      ctx.fill();
    }

    // Time display
    timeElapsed.textContent = fmt(p);
    timeRemaining.textContent = "-" + fmt(state.durationMs - p);
    timeFill.style.transform = `scaleX(${pct.toFixed(4)})`;
  }

  // ── Spin control ──
  function setSpinTarget(target) {
    if (spinTarget === target) return;
    spinTarget = target;
    spinStartTime = performance.now();
    spinStartSpeed = spinSpeed;
  }

  // ── 45 Mode ──
  function setSingleMode(isSingle) {
    if (state.isSingle === isSingle) return;
    state.isSingle = isSingle;
    rpmTarget = isSingle ? RPM_SINGLE : RPM_BASE;
    viewport.classList.toggle("single", isSingle);
    // A 7" label is wider — grooves start beyond it, and the label re-renders
    // in its big-hole form.
    drawGrooves(isSingle ? 122 : GROOVE_START);
    lastLabelKey = "";
    renderLabel();
  }

  // ── Record Shelf — the crate ──
  // Sections of records (house picks, your playlists, recently spun, deeper
  // cuts) presented as a draggable crate: riffle through with momentum and
  // snap, the focused record turns face-on and lifts, tap it to put it on.
  const shelf = $("shelf");
  const crateEl = $("crate");
  const crateBelt = $("crate-belt");
  const crateChips = $("crate-chips");
  const capTitle = document.querySelector("#crate-caption .cap-title");
  const capSub = document.querySelector("#crate-caption .cap-sub");

  const CRATE_SPACING = 224;   // px between records in the row
  const CRATE_CARD = 312;      // face size
  const CRATE_TOP = 360;       // #crate band's screen offset (must match CSS top)
  const CRATE_ROW_Y = 636 - CRATE_TOP; // row center, container-local (lower half)
  const CRATE_LIFT = 46;       // how far the focused record rises out of the crate
  let crateData = null;        // {sections: [...]}
  let crateSection = null;     // active section id
  let crateItems = [];
  let crateCards = [];
  let crateScroll = 0;
  let crateTarget = 0;         // null while dragging
  let crateDrag = null;
  let crateCaptionIdx = -1;
  let shelfFetchedAt = -Infinity;
  let shelfLaunchedAt = -Infinity;
  let shelfRenderKey = "";

  function crateMaxScroll() {
    return Math.max(0, (crateItems.length - 1) * CRATE_SPACING);
  }

  function crateFocusedIndex() {
    return Math.max(0, Math.min(crateItems.length - 1, Math.round(crateScroll / CRATE_SPACING)));
  }

  function renderChips() {
    crateChips.innerHTML = "";
    for (const s of crateData.sections) {
      const chip = document.createElement("div");
      chip.className = "crate-chip" + (s.id === crateSection ? " active" : "");
      chip.textContent = s.title;
      chip.addEventListener("click", () => {
        if (crateSection === s.id) return;
        crateSection = s.id;
        buildCrate();
        renderChips();
      });
      crateChips.appendChild(chip);
    }
  }

  function buildCrate() {
    const sections = crateData.sections;
    const section = sections.find(s => s.id === crateSection) || sections[0];
    if (!section) return;
    crateSection = section.id;
    crateItems = section.items || [];
    crateBelt.innerHTML = "";
    crateCards = crateItems.map(item => {
      const el = document.createElement("div");
      el.className = "crate-card";
      el.style.setProperty("--accent", item.accent || "#888");
      if (item.image) el.style.backgroundImage = `url('${esc(item.image)}')`;
      crateBelt.appendChild(el);
      return el;
    });
    crateScroll = 0;
    crateTarget = 0;
    crateCaptionIdx = -1;
    layoutCrate();
  }

  function layoutCrate() {
    const focusIdx = crateFocusedIndex();
    for (let i = 0; i < crateCards.length; i++) {
      const el = crateCards[i];
      const d = i * CRATE_SPACING - crateScroll;
      const ad = Math.abs(d);
      if (ad > 720) {
        el.style.opacity = "0";
        el.style.transform = "translate3d(-9999px,0,0)";
        continue;
      }
      const t = Math.max(-1, Math.min(1, d / 320));
      const lift = 1 - Math.abs(t);
      const x = 540 + d * 1.02 - CRATE_CARD / 2;
      const y = CRATE_ROW_Y - lift * CRATE_LIFT - CRATE_CARD / 2;
      const z = lift * 220;
      const rotY = -t * 56;
      const scale = 0.80 + lift * 0.40;
      el.style.transform =
        `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) rotateY(${rotY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
      el.style.opacity = ad > 560 ? String(Math.max(0, 1 - (ad - 560) / 140)) : "1";
      el.style.zIndex = String(200 - Math.round(ad / 10));
      el.classList.toggle("focused", i === focusIdx);
    }
    if (focusIdx !== crateCaptionIdx && crateItems[focusIdx]) {
      crateCaptionIdx = focusIdx;
      capTitle.textContent = crateItems[focusIdx].title || "";
      capSub.textContent = crateItems[focusIdx].subtitle || "";
    }
  }

  // Crate physics — exponential glide toward the snap target; momentum comes
  // from projecting the release velocity forward before snapping.
  function updateCrate(now, dt) {
    if (!crateCards.length || !shelf.classList.contains("visible")) return;
    if (!crateDrag && crateTarget !== null && crateScroll !== crateTarget) {
      const k = 1 - Math.exp(-dt / 130);
      crateScroll += (crateTarget - crateScroll) * k;
      if (Math.abs(crateTarget - crateScroll) < 0.4) crateScroll = crateTarget;
      layoutCrate();
    }
  }

  crateEl.addEventListener("pointerdown", e => {
    if (!crateCards.length) return;
    try { crateEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    crateDrag = {
      id: e.pointerId,
      startX: e.clientX,
      startScroll: crateScroll,
      lastX: e.clientX,
      lastT: performance.now(),
      vel: 0,
      moved: false,
    };
  });

  crateEl.addEventListener("pointermove", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const now = performance.now();
    if (Math.abs(e.clientX - crateDrag.startX) > 9) crateDrag.moved = true;
    let next = crateDrag.startScroll - (e.clientX - crateDrag.startX);
    const max = crateMaxScroll();
    if (next < 0) next *= 0.35;                       // rubber band
    else if (next > max) next = max + (next - max) * 0.35;
    const dtm = Math.max(1, now - crateDrag.lastT);
    crateDrag.vel = 0.75 * crateDrag.vel + 0.25 * (-(e.clientX - crateDrag.lastX) / dtm);
    crateDrag.lastX = e.clientX;
    crateDrag.lastT = now;
    crateScroll = next;
    crateTarget = null;
    layoutCrate();
    e.preventDefault();
  }, { passive: false });

  function crateRelease(e) {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const drag = crateDrag;
    crateDrag = null;
    const max = crateMaxScroll();

    if (!drag.moved) {
      // In browse mode the parked mini-disc overlaps the top of this band —
      // a tap there means "back to the player", so let it bubble to the
      // viewport handler instead of gliding the crate.
      if (state.browsing && Math.abs(e.clientX - 540) <= 150 && e.clientY <= 320) return;
      // Tap — invert the layout to find which record was touched.
      const d = (e.clientX - 540) / 1.02;
      const idx = Math.round((crateScroll + d) / CRATE_SPACING);
      if (idx >= 0 && idx < crateItems.length) {
        const offset = Math.abs(d - (idx * CRATE_SPACING - crateScroll));
        if (idx === crateFocusedIndex() && offset < CRATE_CARD * 0.7) {
          launchItem(crateItems[idx]);   // tap the focused record → play it
        } else {
          crateTarget = Math.min(max, Math.max(0, idx * CRATE_SPACING));
        }
      }
      return;
    }
    // Flick — project the velocity forward, snap to the nearest record.
    const projected = crateScroll + drag.vel * 260;
    crateTarget = Math.min(max, Math.max(0, Math.round(projected / CRATE_SPACING) * CRATE_SPACING));
  }
  crateEl.addEventListener("pointerup", crateRelease);
  crateEl.addEventListener("pointercancel", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    crateDrag = null;
    crateTarget = Math.min(crateMaxScroll(), Math.max(0, Math.round(crateScroll / CRATE_SPACING) * CRATE_SPACING));
  });

  async function launchItem(item) {
    if (performance.now() - shelfLaunchedAt < 4000) return;
    shelfLaunchedAt = performance.now();
    try {
      const r = await fetch("/api/idle/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uri: item.uri }),
      });
      if (!r.ok) {
        let msg = "";
        try { msg = (await r.json()).error || ""; } catch (e2) {}
        throw new Error(msg || ("idle play failed: " + r.status));
      }
      shelf.classList.remove("visible");
      exitBrowse(); // zoom the platter back up for the new record
      startRecordFlip("next"); // pull the record onto the platter
      setTimeout(poll, 600);
      setTimeout(poll, 1800);
    } catch (e) {
      shelfLaunchedAt = -Infinity;
      // "not ready" = go-librespot has no stored session yet. One Spotify
      // Connect visit fixes it for good (credentials persist from then on).
      showWledToast(/not ready/i.test(e.message)
        ? "One-time setup: pick “Pi Display” in Spotify once — then the shelf can start music by itself"
        : "Couldn't start playback — speaker not ready");
    }
  }

  async function updateShelf() {
    if (state.trackId && !state.browsing) {
      shelf.classList.remove("visible");
      return;
    }
    // Just launched something — stay hidden while the receiver starts up.
    if (performance.now() - shelfLaunchedAt < 10000) return;

    const now = performance.now();
    if (!crateData || now - shelfFetchedAt > 120000) {
      shelfFetchedAt = now;
      const refresh = (async () => {
        try {
          const r = await fetch("/api/crate");
          if (r.ok) {
            const d = await r.json();
            if (d && d.sections && d.sections.length) crateData = d;
          }
        } catch (e) { /* offline — try again next cycle */ }
      })();
      // Only block when we have nothing to show; a stale crate renders
      // immediately and the refresh lands on a later poll.
      if (!crateData) await refresh;
    }
    const sections = (crateData && crateData.sections) || [];
    if (!sections.length) {
      shelf.classList.remove("visible");
      return;
    }
    const key = JSON.stringify(sections.map(s => [s.id, (s.items || []).length, s.items[0] && s.items[0].uri]));
    if (key !== shelfRenderKey) {
      shelfRenderKey = key;
      if (!crateSection || !sections.find(s => s.id === crateSection)) crateSection = sections[0].id;
      renderChips();
      buildCrate();
    }
    if (!state.trackId || state.browsing) shelf.classList.add("visible");
  }

  // ── Browse mode (pinch-in minimize) ──
  // The platter recedes to a mini-disc parked up top while the shelf rises
  // beneath — layers moving in z, like minimizing an app. Tap the mini-disc
  // (or wait) to zoom back; tap a sleeve to put on a new record.
  let browseTimer = null;

  function enterBrowse() {
    if (state.browsing || !state.trackId) return;
    state.browsing = true;
    viewport.classList.add("browsing");
    // Decelerate the record to a stop at the nearest upright position, so it
    // settles square-side-up as it morphs into the cover. The animate loop
    // eases currentAngle from here to browseTargetAngle over the minimize.
    browseStartAngle = ((currentAngle % 360) + 360) % 360;
    browseTargetAngle = browseStartAngle > 180 ? 360 : 0;
    spinTarget = 0;
    spinSpeed = 0;
    spinStartSpeed = 0;
    returningToZero = false;
    // Show whatever crate data we already have IMMEDIATELY — updateShelf
    // refreshes in the background when its TTL lapses. Forcing a refetch
    // here made every pinch-in wait on the server.
    updateShelf();
    armBrowseTimeout();
  }

  function exitBrowse() {
    if (!state.browsing) return;
    state.browsing = false;
    viewport.classList.remove("browsing");
    if (browseTimer) { clearTimeout(browseTimer); browseTimer = null; }
    if (state.trackId) shelf.classList.remove("visible");
    // Record is upright (angle 0) — spin it back up if playback continues.
    setSpinTarget(state.isPlaying ? 1 : 0);
  }

  function armBrowseTimeout() {
    if (browseTimer) clearTimeout(browseTimer);
    browseTimer = setTimeout(exitBrowse, 45000);
  }

  // Tap the parked cover (top of screen) to return to the player.
  viewport.addEventListener("click", e => {
    if (!state.browsing) return;
    if (Math.abs(e.clientX - 540) <= 150 && e.clientY <= 300) exitBrowse();
  });

  // ── Volume HUD (two-finger drag / pinch-out) ──
  const VOL_ARC_R = 505;
  const VOL_A0 = -55, VOL_A1 = 55; // degrees on the right rim; -55 = top = 100%
  let volHudTimer = null;
  let volSendTimer = null;
  let volPendingPct = null;
  let volLastSetAt = -Infinity;

  function volPoint(deg) {
    const r = (deg * Math.PI) / 180;
    return [540 + VOL_ARC_R * Math.cos(r), 540 + VOL_ARC_R * Math.sin(r)];
  }
  function volArcPath(a0, a1) {
    const [x0, y0] = volPoint(a0), [x1, y1] = volPoint(a1);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${VOL_ARC_R} ${VOL_ARC_R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

  function renderVolume(pct) {
    const a = VOL_A1 - (pct / 100) * (VOL_A1 - VOL_A0);
    volFill.setAttribute("d", volArcPath(a, VOL_A1));
    const [kx, ky] = volPoint(a);
    volKnob.setAttribute("cx", kx.toFixed(1));
    volKnob.setAttribute("cy", ky.toFixed(1));
    volLabel.textContent = String(Math.round(pct));
  }

  function showVolumeHud(opts) {
    renderVolume(state.volume);
    volumeHud.classList.add("visible");
    volumeHud.classList.toggle("pinned", !!(opts && opts.pinned));
    if (volHudTimer) clearTimeout(volHudTimer);
    volHudTimer = setTimeout(() => {
      volumeHud.classList.remove("visible", "pinned");
    }, (opts && opts.pinned) ? 4500 : 2600);
  }

  function setVolume(pct) {
    pct = Math.max(0, Math.min(100, pct));
    state.volume = pct;
    volLastSetAt = performance.now();
    renderVolume(pct);
    // Throttle the POSTs; always deliver the final value.
    volPendingPct = Math.round(pct);
    if (!volSendTimer) {
      volSendTimer = setTimeout(async () => {
        volSendTimer = null;
        const send = volPendingPct;
        volPendingPct = null;
        try {
          await fetch("/api/control/volume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ percent: send }),
          });
        } catch (e) { /* receiver offline — HUD still reflects intent */ }
      }, 150);
    }
  }

  // Pinned HUD: drag anywhere along the right rim to set volume directly.
  function hudPointerVolume(e) {
    if (!volumeHud.classList.contains("pinned")) return;
    const deg = (Math.atan2(e.clientY - 540, e.clientX - 540) * 180) / Math.PI;
    if (deg < VOL_A0 - 14 || deg > VOL_A1 + 14) return;
    setVolume(((VOL_A1 - deg) / (VOL_A1 - VOL_A0)) * 100);
    showVolumeHud({ pinned: true }); // keep it open while interacting
    e.preventDefault();
    e.stopPropagation();
  }
  volumeHud.querySelector("svg").addEventListener("pointerdown", hudPointerVolume);
  volumeHud.querySelector("svg").addEventListener("pointermove", e => {
    if (e.buttons || e.pressure > 0) hudPointerVolume(e);
  });

  // ── Twist-seek chip ──
  let chipTimer = null;
  function showGestureChip(text, autoHideMs) {
    gestureChip.textContent = text;
    gestureChip.classList.add("visible");
    if (chipTimer) clearTimeout(chipTimer);
    if (autoHideMs) {
      chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), autoHideMs);
    }
  }
  function hideGestureChip(afterMs) {
    if (chipTimer) clearTimeout(chipTimer);
    chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), afterMs || 0);
  }

  async function commitSeek(positionMs) {
    try {
      const r = await fetch("/api/control/seek", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ position_ms: Math.round(positionMs) }),
      });
      if (r.ok) {
        state.progressMs = positionMs;
        state.lastUpdate = performance.now();
        setTimeout(poll, 400);
      }
    } catch (e) { /* receiver offline */ }
  }

  // ── Poll Spotify ──
  async function poll() {
    const data = await api("GET", "/now-playing");
    if (!data || !data.item) {
      state.trackId = null;
      state.isPlaying = false;
      state.progressMs = 0;
      state.durationMs = 1;
      state.trackName = "";
      state.artistName = "";
      state.albumName = "";
      state.releaseDate = "";
      state.recordLabel = "";
      if (!pausedSince) pausedSince = performance.now();
      setPillMetadata("", "", false);
      timeElapsed.textContent = "0:00";
      timeRemaining.textContent = "-0:00";
      timeFill.style.transform = "scaleX(0)";
      pill.classList.remove("visible");
      skipPrev.classList.remove("visible");
      skipNext.classList.remove("visible");
      lyricsLines = [];
      lyricsTrackId = null;
      currentLyricIdx = -1;
      lyricsInner.innerHTML = "";
      lyricsWrap.classList.remove("visible");
      setSingleMode(false);
      setSpinTarget(0);
      if (state.browsing) exitBrowse(); // track ended — idle shelf takes over
      updateShelf();
      return;
    }

    const track = data.item;
    const newId = track.id;
    pill.classList.add("visible");
    if (!state.browsing) shelf.classList.remove("visible");

    // Volume from the receiver — unless the user is mid-adjustment here.
    const devVol = (data.device || {}).volume_percent;
    if (typeof devVol === "number" && performance.now() - volLastSetAt > 1500) {
      state.volume = devVol;
    }

    const images = (track.album || {}).images || [];
    const artUrl = images.length ? images[0].url : "";

    // Track info — start the flip FIRST (before staging art) so the art swap
    // lands at the hidden 90° point instead of popping at a visible angle.
    if (newId !== state.trackId) {
      const hadTrack = !!state.trackId;
      // A manual skip already flipped via the swipe handler — if the poll
      // notices the track change just after that flip finished, don't play a
      // second one. (Mid-flip changes are staged into the running flip.)
      if (hadTrack && !flipStartTime && performance.now() - lastFlipStartedAt > 2600) {
        startRecordFlip("next");
      }
      // Same-album track change: the artwork URL won't change, so nothing
      // would ever be staged — feed the current art to the running flip so
      // the 90° reveal (with its A/B side toggle) happens without holding.
      if (flipStartTime && !flipArtSwapped && artUrl && artUrl === state.artUrl) {
        pendingArt = artUrl;
      }
      state.trackId = newId;
      state.trackName = track.name || "";
      state.artistName = (track.artists || []).map(a => a.name).join(", ");
      state.albumName = (track.album || {}).name || "";
      setPillMetadata(state.trackName, state.artistName, hadTrack);

      // Fetch lyrics for new track
      if (newId !== lyricsTrackId) {
        lyricsTrackId = newId;
        lyricsLines = [];
        lyricsWrap.classList.remove("visible");
        currentLyricIdx = -1;
        const durSec = Math.round((track.duration_ms || 0) / 1000);
        fetchLyrics(state.trackName, state.artistName, state.albumName, durSec)
          .then(lines => {
            if (lyricsTrackId === newId) {
              lyricsLines = lines;
              renderLyricLines();
            }
          });
      }
    }

    // Art — staged so a running flip reveals it at the hidden 90° point;
    // outside a flip it applies immediately. Preloaded so the swap is instant.
    if (artUrl && artUrl !== state.artUrl) {
      state.artUrl = artUrl;
      const preload = new Image();
      preload.onload = () => stageArtwork(artUrl);
      preload.onerror = () => stageArtwork(artUrl);
      preload.src = artUrl;
      sampleLabelPalette(artUrl).then(stagePalette);
    }

    // Playback
    state.isPlaying = data.is_playing || false;
    state.progressMs = data.progress_ms || 0;
    state.durationMs = track.duration_ms || 1;
    state.lastUpdate = performance.now();

    // 45 Mode + label metadata — these arrive via background enrichment a
