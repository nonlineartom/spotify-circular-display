      const t = Math.max(-1, Math.min(1, d / 320));
      const lift = 1 - Math.abs(t);
      const x = 540 + d * 1.02 - CRATE_CARD / 2;
      const y = CRATE_ROW_Y - lift * CRATE_LIFT - CRATE_CARD / 2;
      const z = lift * 220;
      const rotY = -t * 56;
      const scale = 0.80 + lift * 0.40;
      el.style.transform =
        `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, ${z.toFixed(1)}px) rotateY(${rotY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
      el.style.opacity = ad > 560 ? String(Math.max(0, 1 - (ad - 560) / 140)) : "1";
      el.style.zIndex = String(200 - Math.round(ad / 10));
      el.classList.toggle("focused", i === focusIdx);
    }
    if (focusIdx !== crateCaptionIdx && crateItems[focusIdx]) {
      crateCaptionIdx = focusIdx;
      capTitle.textContent = crateItems[focusIdx].title || "";
      capSub.textContent = crateItems[focusIdx].subtitle || "";
    }
  }

  // Crate physics — exponential glide toward the snap target; momentum comes
  // from projecting the release velocity forward before snapping.
  function updateCrate(now, dt) {
    if (!crateCards.length || !shelf.classList.contains("visible")) return;
    if (!crateDrag && crateTarget !== null && crateScroll !== crateTarget) {
      const k = 1 - Math.exp(-dt / 130);
      crateScroll += (crateTarget - crateScroll) * k;
      if (Math.abs(crateTarget - crateScroll) < 0.4) crateScroll = crateTarget;
      layoutCrate();
    }
  }

  crateEl.addEventListener("pointerdown", e => {
    if (!crateCards.length) return;
    try { crateEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    crateDrag = {
      id: e.pointerId,
      startX: e.clientX,
      startScroll: crateScroll,
      lastX: e.clientX,
      lastT: performance.now(),
      vel: 0,
      moved: false,
    };
  });

  crateEl.addEventListener("pointermove", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const now = performance.now();
    if (Math.abs(e.clientX - crateDrag.startX) > 9) crateDrag.moved = true;
    let next = crateDrag.startScroll - (e.clientX - crateDrag.startX);
    const max = crateMaxScroll();
    if (next < 0) next *= 0.35;                       // rubber band
    else if (next > max) next = max + (next - max) * 0.35;
    const dtm = Math.max(1, now - crateDrag.lastT);
    crateDrag.vel = 0.75 * crateDrag.vel + 0.25 * (-(e.clientX - crateDrag.lastX) / dtm);
    crateDrag.lastX = e.clientX;
    crateDrag.lastT = now;
    crateScroll = next;
    crateTarget = null;
    layoutCrate();
    e.preventDefault();
  }, { passive: false });

  function crateRelease(e) {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    const drag = crateDrag;
    crateDrag = null;
    const max = crateMaxScroll();

    if (!drag.moved) {
      // In browse mode the parked mini-disc overlaps the top of this band —
      // a tap there means "back to the player", so let it bubble to the
      // viewport handler instead of gliding the crate.
      if (state.browsing && Math.abs(e.clientX - 540) <= 150 && e.clientY <= 320) return;
      // Tap — invert the layout to find which record was touched.
      const d = (e.clientX - 540) / 1.02;
      const idx = Math.round((crateScroll + d) / CRATE_SPACING);
      if (idx >= 0 && idx < crateItems.length) {
        const offset = Math.abs(d - (idx * CRATE_SPACING - crateScroll));
        if (idx === crateFocusedIndex() && offset < CRATE_CARD * 0.7) {
          launchItem(crateItems[idx]);   // tap the focused record → play it
        } else {
          crateTarget = Math.min(max, Math.max(0, idx * CRATE_SPACING));
        }
      }
      return;
    }
    // Flick — project the velocity forward, snap to the nearest record.
    const projected = crateScroll + drag.vel * 260;
    crateTarget = Math.min(max, Math.max(0, Math.round(projected / CRATE_SPACING) * CRATE_SPACING));
  }
  crateEl.addEventListener("pointerup", crateRelease);
  crateEl.addEventListener("pointercancel", e => {
    if (!crateDrag || e.pointerId !== crateDrag.id) return;
    crateDrag = null;
    crateTarget = Math.min(crateMaxScroll(), Math.max(0, Math.round(crateScroll / CRATE_SPACING) * CRATE_SPACING));
  });

  async function launchItem(item) {
    if (performance.now() - shelfLaunchedAt < 4000) return;
    shelfLaunchedAt = performance.now();
    try {
      const r = await fetch("/api/idle/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uri: item.uri }),
      });
      if (!r.ok) {
        let msg = "";
        try { msg = (await r.json()).error || ""; } catch (e2) {}
        throw new Error(msg || ("idle play failed: " + r.status));
      }
      shelf.classList.remove("visible");
      exitBrowse(); // zoom the platter back up for the new record
      startRecordFlip("next"); // pull the record onto the platter
      setTimeout(poll, 600);
      setTimeout(poll, 1800);
    } catch (e) {
      shelfLaunchedAt = -Infinity;
      // "not ready" = go-librespot has no stored session yet. One Spotify
      // Connect visit fixes it for good (credentials persist from then on).
      showWledToast(/not ready/i.test(e.message)
        ? "One-time setup: pick “Pi Display” in Spotify once — then the shelf can start music by itself"
        : "Couldn't start playback — speaker not ready");
    }
  }

  // Warm every crate cover into the browser's HTTP cache ahead of time, so the
  // background-images that buildCrate() assigns paint instantly at pinch-in
  // instead of downloading blank-first over Wi-Fi. Image refs are held until
  // load so the fetch can't be GC-cancelled; URLs are de-duped across refreshes.
  const _crateImgWarm = new Map();
  function preloadCrateImages(data) {
    if (!data || !data.sections) return;
    for (const s of data.sections) {
      for (const it of (s.items || [])) {
        const u = it && it.image;
        if (!u || _crateImgWarm.has(u)) continue;
        const im = new Image();
        _crateImgWarm.set(u, im);
        im.decoding = "async";
        im.onload = im.onerror = () => { _crateImgWarm.delete(u); };
        im.src = u;
      }
    }
  }

  async function updateShelf() {
    if (state.trackId && !state.browsing) {
      shelf.classList.remove("visible");
      return;
    }
    // Just launched something — keep the *idle* shelf hidden while the receiver
    // starts up. But if the user has pinched back into browse mode they want the
    // crate NOW, so don't let the startup window swallow a deliberate re-entry.
    if (!state.browsing && performance.now() - shelfLaunchedAt < 10000) return;

    const now = performance.now();
    if (!crateData || now - shelfFetchedAt > 120000) {
      shelfFetchedAt = now;
      const refresh = (async () => {
        try {
          const r = await fetch("/api/crate");
          if (r.ok) {
            const d = await r.json();
            if (d && d.sections && d.sections.length) { crateData = d; preloadCrateImages(d); }
          }
        } catch (e) { /* offline — try again next cycle */ }
      })();
      // Only block when we have nothing to show; a stale crate renders
      // immediately and the refresh lands on a later poll.
      if (!crateData) await refresh;
    }
    const sections = (crateData && crateData.sections) || [];
    if (!sections.length) {
      shelf.classList.remove("visible");
      return;
    }
    const key = JSON.stringify(sections.map(s => [s.id, (s.items || []).length, s.items[0] && s.items[0].uri]));
    if (key !== shelfRenderKey) {
      shelfRenderKey = key;
      if (!crateSection || !sections.find(s => s.id === crateSection)) crateSection = sections[0].id;
      renderChips();
      buildCrate();
    }
    if (!state.trackId || state.browsing) shelf.classList.add("visible");
  }

  // ── Browse mode (pinch-in minimize) ──
  // The platter recedes to a mini-disc parked up top while the shelf rises
  // beneath — layers moving in z, like minimizing an app. Tap the mini-disc
  // (or wait) to zoom back; tap a sleeve to put on a new record.
  let browseTimer = null;

  function enterBrowse() {
    if (state.browsing || !state.trackId) return;
    state.browsing = true;
    viewport.classList.add("browsing");
    // Decelerate the record to a stop at the nearest upright position, so it
    // settles square-side-up as it morphs into the cover. The animate loop
    // eases currentAngle from here to browseTargetAngle over the minimize.
    browseStartAngle = ((currentAngle % 360) + 360) % 360;
    browseTargetAngle = browseStartAngle > 180 ? 360 : 0;
    spinTarget = 0;
    spinSpeed = 0;
    spinStartSpeed = 0;
    returningToZero = false;
    // Show whatever crate data we already have IMMEDIATELY — updateShelf
    // refreshes in the background when its TTL lapses. Forcing a refetch
    // here made every pinch-in wait on the server.
    updateShelf();
    armBrowseTimeout();
  }

  function exitBrowse() {
    if (!state.browsing) return;
    state.browsing = false;
    viewport.classList.remove("browsing");
    if (browseTimer) { clearTimeout(browseTimer); browseTimer = null; }
    if (state.trackId) shelf.classList.remove("visible");
    // Record is upright (angle 0) — spin it back up if playback continues.
    setSpinTarget(state.isPlaying ? 1 : 0);
  }

  function armBrowseTimeout() {
    if (browseTimer) clearTimeout(browseTimer);
    browseTimer = setTimeout(exitBrowse, 45000);
  }

  // Tap the parked cover (top of screen) to return to the player.
  viewport.addEventListener("click", e => {
    if (!state.browsing) return;
    if (Math.abs(e.clientX - 540) <= 150 && e.clientY <= 300) exitBrowse();
  });

  // ── Track list (pinch-out) ──
  // The record stays spinning but recedes behind a scrim; a center-focused
  // picker of the album's tracks rises over it. Tap a track to play the album
  // from there; tap aside (off the list column) to dismiss.
  const tlEl = $("tracklist");
  const tlPicker = $("tl-picker");
  const tlAlbumEl = tlEl.querySelector(".tl-album");
  const tlArtistEl = tlEl.querySelector(".tl-artist");
  const TL_ROW_PX = 96;        // vertical spacing between rows (1080 space)
  const TL_CENTER = 330;       // picker mid-line (height 660 / 2)
  const tracklistCache = {};   // albumId -> [tracks]
  let tlTracks = [];
  let tlRows = [];
  let tlOffset = 0;            // float index centered on the mid-line
  let tlSnapRaf = null;
  let tlDragMoved = false;
  let tlTimer = null;
  let tlLaunchAt = -Infinity;

  // Tracklist highlight uses the guarded UI accent — same tint as the rest of
  // the chrome, and never goes muddy on dark artwork like the raw accent could.
  function tlAccent() { return uiAccentCss; }

  function tlLayout() {
    for (let i = 0; i < tlRows.length; i++) {
      const d = i - tlOffset, ad = Math.abs(d);
      const y = TL_CENTER + d * TL_ROW_PX;
      const scale = Math.max(0.6, 1 - 0.085 * ad);
      const op = ad > 3.6 ? 0 : Math.max(0, 1.12 - 0.30 * ad);
      const row = tlRows[i];
      row.style.transform = `translateY(${y}px) scale(${scale.toFixed(3)})`;
      row.style.opacity = op.toFixed(3);
      row.style.pointerEvents = ad > 3.6 ? "none" : "auto";
      if (!row._current) {
        const t = row.querySelector(".tl-title");
        t.style.color = `rgba(255,255,255,${(0.4 + 0.5 * Math.max(0, 1 - ad * 0.5)).toFixed(2)})`;
      }
    }
  }

  function tlAnimateTo(target) {
    cancelAnimationFrame(tlSnapRaf);
    const step = () => {
      tlOffset += (target - tlOffset) * 0.22;
      if (Math.abs(target - tlOffset) < 0.004) { tlOffset = target; tlLayout(); return; }
      tlLayout();
      tlSnapRaf = requestAnimationFrame(step);
    };
    step();
  }

  function tlSnap() {
    tlOffset = Math.max(0, Math.min(tlTracks.length - 1, Math.round(tlOffset)));
    tlAnimateTo(tlOffset);
  }

  function buildTlRows() {
    tlPicker.innerHTML = "";
    tlRows = [];
    const curUri = state.trackId ? "spotify:track:" + state.trackId : "";
    let curIdx = 0;
    tlTracks.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "tl-row";
      const isCur = t.uri === curUri;
      if (isCur) { row.classList.add("tl-current"); row._current = true; curIdx = i; }
      const num = document.createElement("span");
      num.className = "tl-num";
      num.textContent = t.number || (i + 1);
      const title = document.createElement("span");
      title.className = "tl-title";
      title.textContent = t.name || "";
      const dur = document.createElement("span");
      dur.className = "tl-dur";
      dur.textContent = fmt(t.duration_ms || 0);
      if (isCur) { num.style.color = tlAccent(); title.style.color = tlAccent(); }
      row.append(num, title, dur);
      row.addEventListener("click", ev => {
        ev.stopPropagation();
        if (tlDragMoved) return;
        playTrack(t.uri);
      });
      tlPicker.appendChild(row);
      tlRows.push(row);
    });
    tlOffset = curIdx;
    tlLayout();
  }

  async function loadTracklist() {
    const key = state.albumId || "";
    if (key && tracklistCache[key]) { tlTracks = tracklistCache[key]; buildTlRows(); return; }
    try {
      const url = key ? "/api/album/tracks?album_id=" + encodeURIComponent(key) : "/api/album/tracks";
      const r = await fetch(url);
      if (r.ok) {
        const d = await r.json();
        tlTracks = (d && d.tracks) || [];
        if (d && d.album_id) tracklistCache[d.album_id] = tlTracks;
      } else { tlTracks = []; }
    } catch (e) { tlTracks = []; }
    if (state.tracklisting) buildTlRows();
  }

  function refreshTracklist() {
    if (!state.tracklisting) return;
    tlAlbumEl.textContent = state.albumName || "";
    tlArtistEl.textContent = state.artistName || "";
    loadTracklist();
  }

  function openTracklist() {
    if (state.tracklisting || state.browsing || !state.trackId) return;
    state.tracklisting = true;
    viewport.classList.add("tracklisting");
    tlEl.classList.add("visible");
    tlAlbumEl.textContent = state.albumName || "";
    tlArtistEl.textContent = state.artistName || "";
    loadTracklist();
    armTlTimeout();
  }

  function closeTracklist() {
    if (!state.tracklisting) return;
    state.tracklisting = false;
    viewport.classList.remove("tracklisting");
    tlEl.classList.remove("visible");
    if (tlTimer) { clearTimeout(tlTimer); tlTimer = null; }
  }

  function armTlTimeout() {
    if (tlTimer) clearTimeout(tlTimer);
    tlTimer = setTimeout(closeTracklist, 45000);
  }

  async function playTrack(uri) {
    if (performance.now() - tlLaunchAt < 1500) return;
    tlLaunchAt = performance.now();
    try {
      const r = await fetch("/api/album/play-track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uri }),
      });
      if (!r.ok) {
        let msg = "";
        try { msg = (await r.json()).error || ""; } catch (e2) {}
        throw new Error(msg || ("play-track failed: " + r.status));
      }
      closeTracklist();
      startRecordFlip("next");      // pull the chosen track onto the platter
      setTimeout(poll, 600);
      setTimeout(poll, 1800);
    } catch (e) {
      tlLaunchAt = -Infinity;
      showWledToast("Couldn't start that track");
    }
  }

  // One pointer tracker for the whole overlay drives BOTH interactions:
  // one finger on the list column scrolls it; two fingers pinching in closes
  // the tracklist (back to the player — same as tapping aside). Events on the
  // rows/picker bubble up to #tracklist, so no pointer capture is needed.
  const tlPts = new Map();        // pointerId -> {x, y}
  let tlScroll = null;            // {id, y, o} active one-finger scroll
  let tlPinch = null;             // {d0} active two-finger pinch
  function tlDist() {
    const p = [...tlPts.values()];
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  tlEl.addEventListener("pointerdown", e => {
    tlPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    armTlTimeout();
    if (tlPts.size === 2) {
      tlScroll = null;            // a second finger landed — it's a pinch, not a scroll
      tlPinch = { d0: tlDist() };
    } else if (tlPts.size === 1 && e.target.closest("#tl-picker")) {
      tlScroll = { id: e.pointerId, y: e.clientY, o: tlOffset };
      tlDragMoved = false;
      cancelAnimationFrame(tlSnapRaf);
    }
  });
  tlEl.addEventListener("pointermove", e => {
    const p = tlPts.get(e.pointerId);
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (tlPinch && tlPts.size >= 2) {
      // Fingers drawn together past the commit distance → back to the player.
      if (tlDist() - tlPinch.d0 <= -PINCH_COMMIT_PX) { tlPinch = null; closeTracklist(); }
      return;
    }
    if (tlScroll && e.pointerId === tlScroll.id) {
      const dy = e.clientY - tlScroll.y;
      if (Math.abs(dy) > 5) tlDragMoved = true;
      tlOffset = Math.max(0, Math.min(tlTracks.length - 1, tlScroll.o - dy / TL_ROW_PX));
      tlLayout();
    }
  });
  function tlPointerEnd(e) {
    tlPts.delete(e.pointerId);
    if (tlScroll && e.pointerId === tlScroll.id) {
      tlScroll = null;
      if (tlDragMoved) tlSnap();
      setTimeout(() => { tlDragMoved = false; }, 0); // let the row click see it first
    }
    if (tlPts.size < 2) tlPinch = null;
  }
  tlEl.addEventListener("pointerup", tlPointerEnd);
  tlEl.addEventListener("pointercancel", tlPointerEnd);
  tlPicker.addEventListener("wheel", e => {
    e.preventDefault();
    tlOffset = Math.max(0, Math.min(tlTracks.length - 1, tlOffset + (e.deltaY > 0 ? 0.5 : -0.5)));
    tlLayout();
    armTlTimeout();
    clearTimeout(tlPicker._wt);
    tlPicker._wt = setTimeout(tlSnap, 140);
  }, { passive: false });

  // Tap anywhere off the list column (gutters, scrim, header band) dismisses.
  tlEl.addEventListener("click", e => {
    if (tlDragMoved) return;
    if (e.target.closest("#tl-picker")) return;
    closeTracklist();
  });

  // ── Volume HUD (two-finger drag / pinch-out) ──
  const VOL_ARC_R = 505;
  const VOL_A0 = -55, VOL_A1 = 55; // degrees on the right rim; -55 = top = 100%
  let volHudTimer = null;
  let volSendTimer = null;
  let volPendingPct = null;
  let volLastSetAt = -Infinity;

  function volPoint(deg) {
    const r = (deg * Math.PI) / 180;
    return [540 + VOL_ARC_R * Math.cos(r), 540 + VOL_ARC_R * Math.sin(r)];
  }
  function volArcPath(a0, a1) {
    const [x0, y0] = volPoint(a0), [x1, y1] = volPoint(a1);
    return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${VOL_ARC_R} ${VOL_ARC_R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }

  function renderVolume(pct) {
    const a = VOL_A1 - (pct / 100) * (VOL_A1 - VOL_A0);
    volFill.setAttribute("d", volArcPath(a, VOL_A1));
    const [kx, ky] = volPoint(a);
    volKnob.setAttribute("cx", kx.toFixed(1));
    volKnob.setAttribute("cy", ky.toFixed(1));
    volLabel.textContent = String(Math.round(pct));
  }

  function showVolumeHud(opts) {
    renderVolume(state.volume);
    volumeHud.classList.add("visible");
    volumeHud.classList.toggle("pinned", !!(opts && opts.pinned));
    if (volHudTimer) clearTimeout(volHudTimer);
    volHudTimer = setTimeout(() => {
      volumeHud.classList.remove("visible", "pinned");
    }, (opts && opts.pinned) ? 4500 : 2600);
  }

  function setVolume(pct) {
    pct = Math.max(0, Math.min(100, pct));
    state.volume = pct;
    volLastSetAt = performance.now();
    renderVolume(pct);
    // Throttle the POSTs; always deliver the final value.
    volPendingPct = Math.round(pct);
    if (!volSendTimer) {
      volSendTimer = setTimeout(async () => {
        volSendTimer = null;
        const send = volPendingPct;
        volPendingPct = null;
        try {
          await fetch("/api/control/volume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ percent: send }),
          });
        } catch (e) { /* receiver offline — HUD still reflects intent */ }
      }, 150);
    }
  }

  // Pinned HUD: drag anywhere along the right rim to set volume directly.
  function hudPointerVolume(e) {
    if (!volumeHud.classList.contains("pinned")) return;
    const deg = (Math.atan2(e.clientY - 540, e.clientX - 540) * 180) / Math.PI;
    if (deg < VOL_A0 - 14 || deg > VOL_A1 + 14) return;
    setVolume(((VOL_A1 - deg) / (VOL_A1 - VOL_A0)) * 100);
    showVolumeHud({ pinned: true }); // keep it open while interacting
    e.preventDefault();
    e.stopPropagation();
  }
  volumeHud.querySelector("svg").addEventListener("pointerdown", hudPointerVolume);
  volumeHud.querySelector("svg").addEventListener("pointermove", e => {
    if (e.buttons || e.pressure > 0) hudPointerVolume(e);
  });

  // ── Twist-seek chip ──
  let chipTimer = null;
  function showGestureChip(text, autoHideMs) {
    gestureChip.textContent = text;
    gestureChip.classList.add("visible");
    if (chipTimer) clearTimeout(chipTimer);
    if (autoHideMs) {
      chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), autoHideMs);
    }
  }
  function hideGestureChip(afterMs) {
    if (chipTimer) clearTimeout(chipTimer);
    chipTimer = setTimeout(() => gestureChip.classList.remove("visible"), afterMs || 0);
  }

  async function commitSeek(positionMs) {
    try {
      const r = await fetch("/api/control/seek", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ position_ms: Math.round(positionMs) }),
      });
      if (r.ok) {
        state.progressMs = positionMs;
        state.lastUpdate = performance.now();
        setTimeout(poll, 400);
      }
    } catch (e) { /* receiver offline */ }
  }

  // ── Poll Spotify ──
  async function poll() {
    const data = await api("GET", "/now-playing");
    if (!data || !data.item) {
      state.trackId = null;
      state.isPlaying = false;
      state.progressMs = 0;
      state.durationMs = 1;
      state.trackName = "";
      state.artistName = "";
      state.albumName = "";
      state.releaseDate = "";
      state.recordLabel = "";
      if (!pausedSince) pausedSince = performance.now();
      setPillMetadata("", "", false);
      timeElapsed.textContent = "0:00";
      timeRemaining.textContent = "-0:00";
      timeFill.style.transform = "scaleX(0)";
      pill.classList.remove("visible");
      skipPrev.classList.remove("visible");
      skipNext.classList.remove("visible");
      lyricsLines = [];
      lyricsTrackId = null;
      currentLyricIdx = -1;
      lyricsInner.innerHTML = "";
      lyricsWrap.classList.remove("visible");
      setSingleMode(false);
      setSpinTarget(0);
      if (state.browsing) exitBrowse(); // track ended — idle shelf takes over
      updateShelf();
      return;
    }

    const track = data.item;
    const newId = track.id;
    pill.classList.add("visible");
    if (!state.browsing) shelf.classList.remove("visible");

    // Volume from the receiver — unless the user is mid-adjustment here.
    const devVol = (data.device || {}).volume_percent;
    if (typeof devVol === "number" && performance.now() - volLastSetAt > 1500) {
      state.volume = devVol;
    }

    const images = (track.album || {}).images || [];
    const artUrl = images.length ? images[0].url : "";
    // Album id lands a poll or two after a track change (server enrichment);
    // keep it fresh every poll so the pinch-out tracklist can load.
    state.albumId = (track.album || {}).id || state.albumId;

    // Track info — start the flip FIRST (before staging art) so the art swap
    // lands at the hidden 90° point instead of popping at a visible angle.
    if (newId !== state.trackId) {
      const hadTrack = !!state.trackId;
      // A manual skip already flipped via the swipe handler — if the poll
      // notices the track change just after that flip finished, don't play a
      // second one. (Mid-flip changes are staged into the running flip.)
      if (hadTrack && !flipStartTime && performance.now() - lastFlipStartedAt > 2600) {
        startRecordFlip("next");
      }
      // Same-album track change: the artwork URL won't change, so nothing
      // would ever be staged — feed the current art to the running flip so
      // the 90° reveal (with its A/B side toggle) happens without holding.
      if (flipStartTime && !flipArtSwapped && artUrl && artUrl === state.artUrl) {
        pendingArt = artUrl;
      }
      state.trackId = newId;
      state.trackName = track.name || "";
      state.artistName = (track.artists || []).map(a => a.name).join(", ");
      state.albumName = (track.album || {}).name || "";
      state.albumId = (track.album || {}).id || ""; // new record — don't keep the last album's id
      if (state.tracklisting) refreshTracklist(); // album changed under an open list
      setPillMetadata(state.trackName, state.artistName, hadTrack);

      // Fetch lyrics for new track
      if (newId !== lyricsTrackId) {
        lyricsTrackId = newId;
        lyricsLines = [];
        lyricsWrap.classList.remove("visible");
        currentLyricIdx = -1;
        const durSec = Math.round((track.duration_ms || 0) / 1000);
        fetchLyrics(state.trackName, state.artistName, state.albumName, durSec)
          .then(lines => {
            if (lyricsTrackId === newId) {
              lyricsLines = lines;
              renderLyricLines();
            }
          });
      }
    }

    // Art — staged so a running flip reveals it at the hidden 90° point;
    // outside a flip it applies immediately. Preloaded so the swap is instant.
    if (artUrl && artUrl !== state.artUrl) {
      state.artUrl = artUrl;
      const preload = new Image();
      preload.onload = () => stageArtwork(artUrl);
      preload.onerror = () => stageArtwork(artUrl);
      preload.src = artUrl;
      sampleLabelPalette(artUrl).then(stagePalette);
    }

    // Playback
    state.isPlaying = data.is_playing || false;
    state.progressMs = data.progress_ms || 0;
    state.durationMs = track.duration_ms || 1;
    state.lastUpdate = performance.now();

    // 45 Mode + label metadata — these arrive via background enrichment a
    // poll or two after the track starts, so check every poll rather than
    // only on track change.
    setSingleMode(((track.album || {}).album_type || "") === "single");
    state.releaseDate = (track.album || {}).release_date || "";
    state.recordLabel = (track.album || {}).label || "";
    renderLabel();

    // Pause/idle tracking for screen dimming
    if (!state.isPlaying && !pausedSince) {
      pausedSince = performance.now();
    } else if (state.isPlaying) {
      pausedSince = 0;
    }

    // Spin — but not while browsing, where the record is held minimized.
    if (!state.browsing) setSpinTarget(state.isPlaying ? 1 : 0);

    // Show controls when track is loaded
    skipPrev.classList.toggle("visible", !!state.trackId);
    skipNext.classList.toggle("visible", !!state.trackId);
  }

  async function readControlResponse(resp) {
    try {
      return await resp.json();
    } catch(e) {
      return {};
    }
  }

  // ── Playback controls ──
  async function controlAction(action) {
    try {
      const resp = await fetch("/api/control/" + action, { method: "POST" });
      const data = await readControlResponse(resp);
      if (!resp.ok) {
        console.warn("Control failed:", action, data.error || resp.status);
        return false;
      }
      setTimeout(poll, 300);
      return true;
    } catch(e) {
      console.warn("Control request failed:", action, e);
      return false;
    }
  }

  skipPrev.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    if (await controlAction("previous")) {
      startRecordFlip("previous");
      confirmSwipe("previous");
    }
  });
  skipNext.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    if (await controlAction("next")) {
      startRecordFlip("next");
      confirmSwipe("next");
    }
  });
  pauseBtn.addEventListener("click", async () => {
    if (performance.now() < suppressTapUntil) return;
    await controlAction("play-pause");
  });

  // ── Swipe gestures (skip track) ──
  let swipeGesture = null;
  let lastSwipeAt = 0;
  let suppressTapUntil = 0;
  const SWIPE_MAX_TIME = 800;
  const SWIPE_COOLDOWN = 900;
  const SWIPE_VERTICAL_RATIO = 0.55;
  const SWIPE_MIN_VELOCITY = 0.25;

  function swipeThreshold() {
    return Math.max(96, viewport.clientWidth * 0.1);
  }

  function clearSwipeFeedback() {
    for (const el of [skipPrev, skipNext]) {
      el.classList.remove("dragging");
      el.style.setProperty("--swipe-strength", "0");
    }
  }

  function showSwipeFeedback(dx) {
    if (!state.trackId) return;
    const target = dx > 0 ? skipPrev : skipNext;
    const other = dx > 0 ? skipNext : skipPrev;
    const strength = Math.min(Math.abs(dx) / swipeThreshold(), 1);

    other.classList.remove("dragging");
    other.style.setProperty("--swipe-strength", "0");
    target.classList.add("dragging");
    target.style.setProperty("--swipe-strength", strength.toFixed(2));
  }

  function confirmSwipe(direction) {
    const target = direction === "previous" ? skipPrev : skipNext;
    target.classList.remove("dragging");
    target.classList.add("confirm");
    target.style.setProperty("--swipe-strength", "1");
    window.setTimeout(() => {
      target.classList.remove("confirm");
      target.style.setProperty("--swipe-strength", "0");
    }, 360);
  }

  // ── Multi-touch gesture engine ──
  // The panel reports 10 touch points; we use two:
  //   twist        → scrub (1 turn = 60s), the platter rotates under your fingers
  //   vertical drag→ volume fader
  //   two-finger tap → play/pause
  //   pinch in     → minimize to the shelf (browse mode)
  //   pinch out    → pin the volume HUD open
  const activePointers = new Map(); // pointerId -> {x, y}
  let mtGesture = null;

  const TWIST_SECONDS_PER_TURN = 60;
  const MT_TAP_MAX_MS = 300;
  const MT_TAP_MAX_MOVE = 18;
  const PINCH_COMMIT_PX = 90;

  function currentProgressMs() {
    let p = state.progressMs;
    if (state.isPlaying) p += performance.now() - state.lastUpdate;
    return Math.min(p, state.durationMs);
  }

  function mtGeometry(ids) {
    const a = activePointers.get(ids[0]);
    const b = activePointers.get(ids[1]);
    const dx = b.x - a.x, dy = b.y - a.y;
    return {
      dist: Math.hypot(dx, dy),
      angle: (Math.atan2(dy, dx) * 180) / Math.PI,
      cy: (a.y + b.y) / 2,
    };
  }

  function cancelSwipe() {
    if (!swipeGesture) return;
    clearSwipeFeedback();
    if (swipeGesture.captured && viewport.releasePointerCapture) {
      try { viewport.releasePointerCapture(swipeGesture.pointerId); } catch (e) {}
    }
    swipeGesture = null;
  }

  function startMtGesture() {
    const ids = [...activePointers.keys()].slice(0, 2);
    const g = mtGeometry(ids);
    cancelSwipe();
    mtGesture = {
      ids,
      mode: null,
      t0: performance.now(),
      d0: g.dist,
      cy0: g.cy,
      prevAngle: g.angle,
      accumDeg: 0,
      lastDDist: 0,
      maxMove: 0,
      moved: new Set(),
      seekBase: currentProgressMs(),
      seekPreview: null,
      volBase: state.volume,
      startPts: ids.map(id => ({ ...activePointers.get(id) })),
    };
  }

  function processMtGesture(e) {
    const g = mtGeometry(mtGesture.ids);
    for (let i = 0; i < 2; i++) {
      const s = mtGesture.startPts[i];
      const c = activePointers.get(mtGesture.ids[i]);
      const move = Math.hypot(c.x - s.x, c.y - s.y);
      mtGesture.maxMove = Math.max(mtGesture.maxMove, move);
      if (move > 4) mtGesture.moved.add(mtGesture.ids[i]);
    }
    const dDist = g.dist - mtGesture.d0;
    mtGesture.lastDDist = dDist;
    let stepA = g.angle - mtGesture.prevAngle;
    if (stepA > 180) stepA -= 360;
    else if (stepA < -180) stepA += 360;
    mtGesture.prevAngle = g.angle;
    mtGesture.accumDeg += stepA;
    const dCy = g.cy - mtGesture.cy0;

    // Classify by the DOMINANT signal, and only once BOTH fingers have
    // moved. Touch hardware reports fingers alternately, so a parallel
    // two-finger drag creates transient angle spikes between updates —
    // first-past-threshold would misread it as a twist. Net values after
    // both fingers report are jitter-free.
    if (!mtGesture.mode && mtGesture.moved.size === 2) {
      const twistPx = (Math.abs(mtGesture.accumDeg) * Math.PI / 180) * (mtGesture.d0 / 2);
      const pinchPx = Math.abs(dDist);
      const dragPx = Math.abs(dCy);
      const top = Math.max(twistPx, pinchPx, dragPx);
      if (top > 44) {
        if (top === pinchPx) mtGesture.mode = "pinch";
        else if (top === twistPx && Math.abs(mtGesture.accumDeg) > 9) mtGesture.mode = "twist";
        else if (top === dragPx) mtGesture.mode = "vdrag";
      }
    }

    if (mtGesture.mode === "twist") {
      // The record follows your fingers — DJ-style.
      returningToZero = false;
      currentAngle = (currentAngle + stepA + 360) % 360;
      const preview = Math.max(0, Math.min(
        mtGesture.seekBase + (mtGesture.accumDeg / 360) * TWIST_SECONDS_PER_TURN * 1000,
        state.durationMs));
      mtGesture.seekPreview = preview;
      showGestureChip((mtGesture.accumDeg >= 0 ? "⟳ " : "⟲ ") + fmt(preview));
    } else if (mtGesture.mode === "vdrag") {
      setVolume(mtGesture.volBase + (-dCy / 620) * 100);
      showVolumeHud();
    } else if (mtGesture.mode === "pinch") {
      // Live z-depth feedback while pinching — tracks fingers instantly.
      platter.classList.add("no-transition");
      const s = Math.max(0.82, Math.min(1.06, 1 + dDist / 1400));
      platter.style.transform = `scale(${s.toFixed(3)})`;
    }
    e.preventDefault();
  }

  function finalizeMtGesture() {
    const g = mtGesture;
    const dur = performance.now() - g.t0;

    if (g.mode === null) {
      if (dur <= MT_TAP_MAX_MS && g.maxMove <= MT_TAP_MAX_MOVE) {
        controlAction("play-pause"); // two-finger tap
      }
    } else if (g.mode === "twist") {
      hideGestureChip(550);
      if (g.seekPreview !== null && Math.abs(g.seekPreview - g.seekBase) > 1500) {
        commitSeek(g.seekPreview);
      }
    } else if (g.mode === "pinch") {
      // Re-enable the transition first so the release animates — either the
      // snap back to full size or the recede into browse mode.
      platter.classList.remove("no-transition");
      platter.style.transform = "";
      if (g.lastDDist <= -PINCH_COMMIT_PX) {
        enterBrowse();              // pinch in → out to the shelf
      } else if (g.lastDDist >= PINCH_COMMIT_PX) {
        openTracklist();            // pinch out → this album's tracklist
      }
    }
    // vdrag needs no finalize — the throttled sender delivers the last value.

    suppressTapUntil = performance.now() + 700;
    mtGesture = null;
  }

  viewport.addEventListener("pointerdown", e => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.browsing) return; // browse mode: sleeve taps + mini-disc only
    if (state.tracklisting) return; // tracklist open: picker scroll + gutter taps only

    if (activePointers.size === 2 && state.trackId && !mtGesture) {
      startMtGesture();
    } else if (activePointers.size === 1 && state.trackId && !mtGesture && !swipeGesture) {
      swipeGesture = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        startTime: performance.now(),
        captured: false,
        swipeInProgress: false,
      };
      clearSwipeFeedback();
    }
  });

  viewport.addEventListener("pointermove", e => {
    const p = activePointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }

    if (mtGesture) {
      if (mtGesture.ids.includes(e.pointerId)
          && mtGesture.ids.every(id => activePointers.has(id))) {
        processMtGesture(e);
      }
      return;
    }

    if (!swipeGesture || e.pointerId !== swipeGesture.pointerId) return;

    const dx = e.clientX - swipeGesture.startX;
    const dy = e.clientY - swipeGesture.startY;
    const horizontalEnough = Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy) * 1.25;

    swipeGesture.swipeInProgress = horizontalEnough;
    if (horizontalEnough) {
      if (!swipeGesture.captured && viewport.setPointerCapture) {
        viewport.setPointerCapture(e.pointerId);
        swipeGesture.captured = true;
      }
      showSwipeFeedback(dx);
      e.preventDefault();
    } else {
      clearSwipeFeedback();
    }
  }, { passive: false });

  function releasePointer(e) {
    activePointers.delete(e.pointerId);

    if (mtGesture && mtGesture.ids.includes(e.pointerId)) {
      finalizeMtGesture();
      return true;
    }
    return false;
  }

  viewport.addEventListener("pointerup", e => {
    if (releasePointer(e)) { e.preventDefault(); return; }

    if (!swipeGesture || e.pointerId !== swipeGesture.pointerId) return;

    const now = performance.now();
    const dx = e.clientX - swipeGesture.startX;
    const dy = e.clientY - swipeGesture.startY;
    const dt = Math.max(now - swipeGesture.startTime, 1);
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    const threshold = swipeThreshold();
    const velocity = absX / dt;
    const canSwipeAgain = now - lastSwipeAt >= SWIPE_COOLDOWN;
    const shouldSkip =
      canSwipeAgain &&
      dt <= SWIPE_MAX_TIME &&
      absX >= threshold &&
      absY <= absX * SWIPE_VERTICAL_RATIO &&
      velocity >= SWIPE_MIN_VELOCITY;

    if (shouldSkip) {
      const action = dx < 0 ? "next" : "previous";
      lastSwipeAt = now;
      suppressTapUntil = now + 650;
      clearSwipeFeedback();
      controlAction(action).then(ok => {
        if (ok) {
          startRecordFlip(action);
          confirmSwipe(action);
        }
      });
      e.preventDefault();
    } else {
      clearSwipeFeedback();
    }

    if (swipeGesture.captured && viewport.releasePointerCapture) {
      viewport.releasePointerCapture(e.pointerId);
    }
    swipeGesture = null;
  }, { passive: false });

  viewport.addEventListener("pointercancel", e => {
    if (releasePointer(e)) return;
    if (!swipeGesture || e.pointerId !== swipeGesture.pointerId) return;
    cancelSwipe();
  });

  // ── Wake from screen dim ──
  // While dimmed, #dimmer sits on top with pointer-events:auto, so the first
  // press lands here and ONLY wakes the screen: restart the idle countdown
  // (animate() then drops .dim, restoring pointer-events:none) and stop the
  // event so nothing underneath is activated. Touch pointers implicitly
  // capture to the dimmer, so the matching pointerup/click can't leak either.
  function wakeScreen(e) {
    e.stopPropagation();
    e.preventDefault();
    pausedSince = performance.now();
    suppressTapUntil = performance.now() + 650; // belt & braces vs stray clicks
  }
  dimmer.addEventListener("pointerdown", wakeScreen);
  dimmer.addEventListener("pointerup", e => { e.stopPropagation(); e.preventDefault(); });
  dimmer.addEventListener("click", e => { e.stopPropagation(); e.preventDefault(); });

  // ── Prevent all image/element dragging ──
  document.addEventListener("dragstart", e => e.preventDefault());

  // ── WLED setup affordance ──
  const wledChip = $("wled-chip");
  const wledChipLabel = wledChip.querySelector(".label");
  const wledModal = $("wled-modal");
  const wledList = $("wled-list");
  const wledClose = $("wled-close");
  const wledDisable = $("wled-disable");
  const wledToast = $("wled-toast");

  // wledStatus shape: {enabled, configured, devices: [{host, name, pixel_count}]}
  // wledDiscovered shape: [{ip, name, port, pixel_count}, ...]
  let wledStatus = null;
  let wledDiscovered = [];
  let wledLastStatusFetch = 0;
  let wledLastDevicesFetch = 0;
  let wledToastTimer = null;

  const WLED_STATUS_INTERVAL = 30000;
  const WLED_DEVICES_INTERVAL = 5000;

  function showWledToast(message) {
    wledToast.textContent = message;
    wledToast.classList.add("visible");
    if (wledToastTimer) clearTimeout(wledToastTimer);
    wledToastTimer = setTimeout(() => {
      wledToast.classList.remove("visible");
    }, 3000);
  }

  function isIdleForSetup() {
    // Only show setup UI in idle state. now-playing takes precedence whenever a track is active.
    return !state.trackId;
  }

  function configuredHosts() {
    if (!wledStatus || !Array.isArray(wledStatus.devices)) return new Set();
    return new Set(wledStatus.devices.map(d => d.host));
  }

  function hasUnaddedDiscoveredDevice() {
    if (!wledDiscovered.length) return false;
    const configured = configuredHosts();
    return wledDiscovered.some(d => !configured.has(d.ip));
  }

  function chipMessage() {
    const configured = configuredHosts();
    const unadded = wledDiscovered.filter(d => !configured.has(d.ip));
    if (configured.size === 0) {
      return unadded.length === 1
        ? "WLED device found — tap to set up"
        : `${unadded.length} WLED devices found — tap to set up`;
    }
    return unadded.length === 1
      ? "New WLED device found — tap to manage"
      : `${unadded.length} new WLED devices — tap to manage`;
  }

  function updateWledChipVisibility() {
    const show = isIdleForSetup() && hasUnaddedDiscoveredDevice() && !wledModal.classList.contains("open");
    if (show) wledChipLabel.textContent = chipMessage();
    wledChip.classList.toggle("visible", show);
  }

  async function fetchWledStatus() {
    try {
      const r = await fetch("/api/wled/status");
      if (!r.ok) return;
      wledStatus = await r.json();
    } catch (e) { /* ignore */ }
  }

  async function fetchWledDiscovered() {
    try {
      const r = await fetch("/api/wled/discovered");
      if (!r.ok) return;
      const data = await r.json();
      wledDiscovered = Array.isArray(data.devices) ? data.devices : [];
    } catch (e) { /* ignore */ }
  }

  async function refreshWled() {
    const now = performance.now();
    if (!isIdleForSetup()) {
      wledDiscovered = [];
      updateWledChipVisibility();
      return;
    }
    const tasks = [];
    if (now - wledLastStatusFetch > WLED_STATUS_INTERVAL || wledStatus === null) {
      wledLastStatusFetch = now;
      tasks.push(fetchWledStatus());
    }
    if (now - wledLastDevicesFetch > WLED_DEVICES_INTERVAL) {
      wledLastDevicesFetch = now;
      tasks.push(fetchWledDiscovered());
    }
    if (tasks.length) await Promise.all(tasks);
    updateWledChipVisibility();
  }

  function renderWledList() {
    wledList.innerHTML = "";

    // Build the union of discovered + configured devices so the user can
    // remove a configured device that's currently offline / not visible.
    const seen = new Set();
    const rows = [];
    for (const d of wledDiscovered) {
      seen.add(d.ip);
      rows.push({ host: d.ip, name: d.name || d.ip, pixel_count: d.pixel_count, visible: true });
    }
    if (wledStatus && Array.isArray(wledStatus.devices)) {
      for (const d of wledStatus.devices) {
        if (seen.has(d.host)) continue;
        rows.push({ host: d.host, name: d.name || d.host, pixel_count: d.pixel_count, visible: false });
      }
    }

    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No WLED devices visible on the network.";
      wledList.appendChild(empty);
      return;
    }

    const configured = configuredHosts();
    for (const row of rows) {
      const isAdded = configured.has(row.host);
      const li = document.createElement("li");
      if (isAdded) li.classList.add("added");

      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = row.name + (row.visible ? "" : " · offline");
      const ip = document.createElement("div");
      ip.className = "ip";
      ip.textContent = row.host + (row.pixel_count ? ` · ${row.pixel_count} px` : "");
      meta.appendChild(name);
      meta.appendChild(ip);

      const action = document.createElement("span");
      action.className = "action";
      action.textContent = isAdded ? "Remove" : "Add";

      li.appendChild(meta);
      li.appendChild(action);
      li.addEventListener("click", () => toggleWledDevice(row, !isAdded));
      wledList.appendChild(li);
    }
  }

  async function pushWledDevices(devices, enabled) {
    const body = { devices };
    if (typeof enabled === "boolean") body.enabled = enabled;
    try {
      const r = await fetch("/api/wled/devices", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        showWledToast("Failed to save WLED devices");
        return false;
      }
      await fetchWledStatus();
      renderWledList();
      updateWledChipVisibility();
      return true;
    } catch (e) {
      showWledToast("Failed to save WLED devices");
      return false;
    }
  }

  async function toggleWledDevice(row, add) {
    const current = (wledStatus && wledStatus.devices) ? wledStatus.devices.slice() : [];
    let next;
    if (add) {
      next = current.filter(d => d.host !== row.host);
      next.push({ host: row.host, name: row.name, pixel_count: row.pixel_count || 46 });
    } else {
      next = current.filter(d => d.host !== row.host);
    }
    const ok = await pushWledDevices(next, next.length > 0);
    if (ok) {
      showWledToast(add ? `Added ${row.name}` : `Removed ${row.name}`);
    }
  }

  async function disableWled() {
    const ok = await pushWledDevices([], false);
    if (ok) {
      showWledToast("WLED disabled");
      closeWledModal();
    }
  }

  function openWledModal() {
    renderWledList();
    wledModal.classList.add("open");
    wledChip.classList.remove("visible");
  }

  function closeWledModal() {
    wledModal.classList.remove("open");
    updateWledChipVisibility();
  }

  wledChip.addEventListener("click", openWledModal);
  wledClose.addEventListener("click", closeWledModal);
  wledDisable.addEventListener("click", disableWled);
  wledModal.addEventListener("click", e => {
    // Click outside the panel = dismiss
    if (e.target === wledModal) closeWledModal();
  });

  // ── Init ──
  drawGrooves();
  volTrack.setAttribute("d", volArcPath(VOL_A0, VOL_A1));
  $("vol-backing").setAttribute("d", volArcPath(VOL_A0, VOL_A1));
  renderVolume(state.volume);
  // Warm the crate so the first pinch-in shows records instantly.
  fetch("/api/crate").then(r => (r.ok ? r.json() : null)).then(d => {
    if (d && d.sections && d.sections.length && !crateData) {
      crateData = d;
      shelfFetchedAt = performance.now();
      preloadCrateImages(d); // warm covers during playback so the pinch reveal is instant
    }
  }).catch(() => {});
  requestAnimationFrame(animate);
  poll();
  setInterval(poll, 2000);
  refreshWled();
  setInterval(refreshWled, 2000);

})();
</script>
</body>
</html>
